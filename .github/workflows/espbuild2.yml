name: ESP32-S3-BOX PRO STABLE BUILD (WEBUI + AP + MQTT SAFE ARCH)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe git directory
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================

      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE PROPER ESP-IDF COMPONENTS (FIX LINKER ERRORS)
# =====================================================

      - name: Create extensions component structure
        run: |
          mkdir -p components/extensions/webui
          mkdir -p components/extensions/ap
          mkdir -p components/extensions/mqtt

# =====================================================
# WEBUI COMPONENT
# =====================================================

      - name: WebUI source
        run: |
          cat > components/extensions/webui/web_ui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"
          
          static const char *TAG = "WEBUI";
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body><h1>ESP32-S3-BOX PRO</h1></body></html>";
          
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
          
              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };
          
                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF
          
          cat > components/extensions/webui/CMakeLists.txt << 'EOF'
          idf_component_register(SRCS "web_ui.c"
                                INCLUDE_DIRS ".")
          EOF

# =====================================================
# AP FALLBACK COMPONENT
# =====================================================

      - name: AP fallback source
        run: |
          cat > components/extensions/ap/ap_fallback.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"
          
          static const char *TAG = "AP";
          
          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };
          
              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();
          
              ESP_LOGI(TAG, "AP fallback started");
          }
          EOF
          
          cat > components/extensions/ap/CMakeLists.txt << 'EOF'
          idf_component_register(SRCS "ap_fallback.c"
                                INCLUDE_DIRS ".")
          EOF

# =====================================================
# MQTT COMPONENT
# =====================================================

      - name: MQTT source
        run: |
          cat > components/extensions/mqtt/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"
          
          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;
          
          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };
          
              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_start(client);
          
              ESP_LOGI(TAG, "MQTT started");
          }
          EOF
          
          cat > components/extensions/mqtt/CMakeLists.txt << 'EOF'
          idf_component_register(SRCS "mqtt_bridge.c"
                                INCLUDE_DIRS ".")
          EOF

# =====================================================
# CREATE HEADER (FIX LINKING)
# =====================================================

      - name: Extensions header
        run: |
          cat > components/extensions/extensions.h << 'EOF'
          #pragma once
          
          void web_ui_start(void);
          void ap_fallback_start(void);
          void mqtt_bridge_start(void);
          EOF

# =====================================================
# PATCH MAIN.C (SAFE INCLUDE ONLY)
# =====================================================

      - name: Patch main.c safely
        run: |
          FILE=examples/factory_demo/main/main.c
          
          if ! grep -q "extensions.h" $FILE; then
            sed -i '/#include/a #include "extensions/extensions.h"' $FILE
          fi
          
          if ! grep -q "web_ui_start" $FILE; then
            sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(4000));\
          web_ui_start();\
          ap_fallback_start();\
          mqtt_bridge_start();' $FILE
          fi

# =====================================================
# BUILD
# =====================================================

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# FIND BIN (NO FLASH ARGS BUGS)
# =====================================================

      - name: Collect firmware
        run: |
          mkdir -p output
          cp examples/factory_demo/build/*.bin output/ || true

# =====================================================
# UPLOAD
# =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-pro-stable
          path: output/
