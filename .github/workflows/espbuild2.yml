name: ESP32-S3-BOX WEBUI GOLDEN MQTT (ZERO ERROR)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# PATCH MAIN.C (SAFE)
# =====================================================
      - name: Inject WEBUI + MQTT
        run: |
          FILE=examples/factory_demo/main/main.c

          cat > /tmp/insert_block.c <<'EOF'
#include "esp_http_server.h"
#include "mqtt_client.h"

static httpd_handle_t server = NULL;
static esp_mqtt_client_handle_t mqtt_client = NULL;

static esp_err_t root_handler(httpd_req_t *req)
{
    const char html[] =
    "<html><body style='text-align:center;font-family:sans-serif;'>"
    "<h1>ESP32 BOX</h1>"
    "<button onclick=\"fetch('/light')\">LIGHT</button><br><br>"
    "<button onclick=\"fetch('/mqtt')\">MQTT</button>"
    "</body></html>";

    httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
    return ESP_OK;
}

static esp_err_t light_handler(httpd_req_t *req)
{
    httpd_resp_send(req, "LIGHT OK", HTTPD_RESP_USE_STRLEN);
    return ESP_OK;
}

static esp_err_t mqtt_handler(httpd_req_t *req)
{
    if (mqtt_client) {
        esp_mqtt_client_publish(
            mqtt_client,
            "espbox/webui",
            "pressed",
            0,1,0
        );
    }

    httpd_resp_send(req, "MQTT SENT", HTTPD_RESP_USE_STRLEN);
    return ESP_OK;
}

static void start_webserver(void)
{
    httpd_config_t config = HTTPD_DEFAULT_CONFIG();

    if (httpd_start(&server, &config) == ESP_OK) {

        httpd_uri_t root = {
            .uri="/",
            .method=HTTP_GET,
            .handler=root_handler
        };

        httpd_uri_t light = {
            .uri="/light",
            .method=HTTP_GET,
            .handler=light_handler
        };

        httpd_uri_t mqtt = {
            .uri="/mqtt",
            .method=HTTP_GET,
            .handler=mqtt_handler
        };

        httpd_register_uri_handler(server, &root);
        httpd_register_uri_handler(server, &light);
        httpd_register_uri_handler(server, &mqtt);
    }
}

static void start_mqtt(void)
{
    esp_mqtt_client_config_t cfg = {
        .broker.address.uri = "mqtt://broker.hivemq.com"
    };

    mqtt_client = esp_mqtt_client_init(&cfg);
    esp_mqtt_client_start(mqtt_client);
}
EOF

          awk '
          BEGIN{done=0}
          /#include "app_rmaker.h"/ && done==0 {
              print
              while ((getline line < "/tmp/insert_block.c") > 0) print line
              done=1
              next
          }
          {print}
          ' "$FILE" > /tmp/main.new && mv /tmp/main.new "$FILE"

          sed -i '/app_rmaker_start()/a\
    start_webserver();\
    vTaskDelay(pdMS_TO_TICKS(5000));\
    start_mqtt();' "$FILE"

# =====================================================
# BUILD
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGED BIN
# =====================================================
      - name: Create Full Firmware BIN
        run: |
          cd examples/factory_demo/build
          python /opt/esp/idf/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin -o full_firmware.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x10000 factory_demo.bin

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-webui-golden-mqtt
          path: examples/factory_demo/build/full_firmware.bin
