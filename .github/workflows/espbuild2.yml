name: ESP32-S3-BOX FINAL PRODUCTION BUILD
# Stable Production Firmware
# Includes:
# - Original factory_demo
# - RainMaker
# - Speech Recognition preserved
# - WebUI
# - AP fallback
# - Local IP control
# - MQTT Layer 2
# - Safe namespaced modules
# - Boot safe delayed startup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean Build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE MODULES
# =====================================================
      - name: Create custom modules
        run: |
          mkdir -p examples/factory_demo/main/custom

# =====================================================
# WEBUI MODULE
# =====================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/custom/bx_web.h << 'EOF'
#pragma once
#ifdef __cplusplus
extern "C" {
#endif
void bx_web_start(void);
#ifdef __cplusplus
}
#endif
EOF

          cat > examples/factory_demo/main/custom/bx_web.c << 'EOF'
#include "bx_web.h"
#include "esp_http_server.h"
#include "esp_log.h"

static const char *TAG = "BX_WEB";

static esp_err_t root(httpd_req_t *req)
{
    const char html[] =
    "<html><body style='text-align:center;'>"
    "<h1>ESP-BOX</h1>"
    "<button onclick=\"fetch('/ping')\">PING</button>"
    "</body></html>";

    httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
    return ESP_OK;
}

static esp_err_t ping(httpd_req_t *req)
{
    httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
    return ESP_OK;
}

void bx_web_start(void)
{
    httpd_handle_t server = NULL;
    httpd_config_t config = HTTPD_DEFAULT_CONFIG();

    if (httpd_start(&server, &config) == ESP_OK) {

        httpd_uri_t uri_root = {
            .uri="/",
            .method=HTTP_GET,
            .handler=root
        };

        httpd_uri_t uri_ping = {
            .uri="/ping",
            .method=HTTP_GET,
            .handler=ping
        };

        httpd_register_uri_handler(server, &uri_root);
        httpd_register_uri_handler(server, &uri_ping);

        ESP_LOGI(TAG, "WebUI started");
    }
}
EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/custom/bx_ap.h << 'EOF'
#pragma once
#ifdef __cplusplus
extern "C" {
#endif
void bx_ap_start(void);
#ifdef __cplusplus
}
#endif
EOF

          cat > examples/factory_demo/main/custom/bx_ap.c << 'EOF'
#include "bx_ap.h"
#include "esp_wifi.h"
#include "esp_log.h"

static const char *TAG = "BX_AP";

void bx_ap_start(void)
{
    wifi_mode_t mode;
    esp_wifi_get_mode(&mode);

    if (mode == WIFI_MODE_NULL) {

        wifi_config_t ap = {
            .ap = {
                .ssid = "ESP32-BOX-SETUP",
                .password = "12345678",
                .channel = 6,
                .max_connection = 4,
                .authmode = WIFI_AUTH_WPA_WPA2_PSK
            }
        };

        esp_wifi_set_mode(WIFI_MODE_AP);
        esp_wifi_set_config(WIFI_IF_AP, &ap);
        esp_wifi_start();

        ESP_LOGI(TAG, "Fallback AP started");
    }
}
EOF

# =====================================================
# MQTT MODULE
# =====================================================
      - name: Inject MQTT
        run: |
          cat > examples/factory_demo/main/custom/bx_mqtt.h << 'EOF'
#pragma once
#ifdef __cplusplus
extern "C" {
#endif
void bx_mqtt_start(void);
#ifdef __cplusplus
}
#endif
EOF

          cat > examples/factory_demo/main/custom/bx_mqtt.c << 'EOF'
#include "bx_mqtt.h"
#include "mqtt_client.h"
#include "esp_log.h"

static const char *TAG = "BX_MQTT";
static esp_mqtt_client_handle_t client;

void bx_mqtt_start(void)
{
    esp_mqtt_client_config_t cfg = {
        .broker.address.uri = "mqtt://broker.hivemq.com"
    };

    client = esp_mqtt_client_init(&cfg);
    esp_mqtt_client_start(client);

    ESP_LOGI(TAG, "MQTT started");
}
EOF

# =====================================================
# REGISTER MODULES IN CMAKE
# =====================================================
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i 's|SRCS "main.c"|SRCS "main.c" "custom/bx_web.c" "custom/bx_ap.c" "custom/bx_mqtt.c"|' $FILE

# =====================================================
# PATCH MAIN.C
# =====================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q bx_web.h $FILE || sed -i '/#include "app_rmaker.h"/a #include "custom/bx_web.h"' $FILE
          grep -q bx_ap.h $FILE || sed -i '/#include "app_rmaker.h"/a #include "custom/bx_ap.h"' $FILE
          grep -q bx_mqtt.h $FILE || sed -i '/#include "app_rmaker.h"/a #include "custom/bx_mqtt.h"' $FILE

          grep -q bx_web_start $FILE || sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(8000));\
          bx_web_start();\
          bx_ap_start();\
          bx_mqtt_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================
      - name: Merge BIN
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_production.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-final-production
          path: examples/factory_demo/build/factory_production.bin
