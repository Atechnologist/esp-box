name: ESP32-S3-BOX PRO FIXED BUILD (NO LINK ERRORS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE COMPONENTS
# =====================================================
      - name: Create components folder
        run: mkdir -p components/extensions

# =====================================================
# WEBUI
# =====================================================
      - name: WebUI
        run: |
          cat > components/extensions/webui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: AP fallback
        run: |
          cat > components/extensions/ap.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();
          }
          EOF

# =====================================================
# MQTT
# =====================================================
      - name: MQTT
        run: |
          cat > components/extensions/mqtt.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"

          static esp_mqtt_client_handle_t client;

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_start(client);
          }
          EOF

# =====================================================
# HEADER (FIX YOUR ERROR)
# =====================================================
      - name: Header fix
        run: |
          cat > components/extensions/extensions.h << 'EOF'
          #pragma once

          void web_ui_start(void);
          void ap_fallback_start(void);
          void mqtt_bridge_start(void);
          EOF

# =====================================================
# FIX CMAKE (CRITICAL PART)
# =====================================================
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/CMakeLists.txt

          grep -q "EXTRA_COMPONENT_DIRS" $FILE || \
          sed -i '1i set(EXTRA_COMPONENT_DIRS ../../components/extensions)' $FILE

# =====================================================
# PATCH MAIN
# =====================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/#include/a #include "extensions.h"' $FILE

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(8000));\
          web_ui_start();\
          ap_fallback_start();\
          mqtt_bridge_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# ARTIFACT (BIN ONLY)
# =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-fixed-pro
          path: examples/factory_demo/build/*.bin
