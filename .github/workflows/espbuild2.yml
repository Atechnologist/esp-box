name: ESP32-S3-BOX BOOT SAFE PRODUCTION BUILD

# =====================================================
# Keeps original factory_demo stable
# Adds:
# - WebUI
# - Local IP access
# - AP fallback
# - Delayed startup (prevents SR boot loop)
# - MQTT disabled by default (easy enable later)
# =====================================================

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe git directory
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean old build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE EXTENSIONS
# =====================================================
      - name: Create extension folder
        run: |
          mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEB UI
# =====================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;font-family:sans-serif;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Boot Safe Firmware</p>"
              "<button onclick=\"fetch('/ping')\">Ping</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t ping_handler(httpd_req_t *req)
          {
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_uri_t ping = {
                      .uri = "/ping",
                      .method = HTTP_GET,
                      .handler = ping_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &ping);

                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK (DELAYED SAFE)
# =====================================================
      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.h << 'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_mode_t mode;
              esp_wifi_get_mode(&mode);

              if (mode == WIFI_MODE_NULL || mode == WIFI_MODE_STA) {

                  wifi_config_t ap_config = {
                      .ap = {
                          .ssid = "ESP32-BOX-SETUP",
                          .password = "12345678",
                          .channel = 6,
                          .max_connection = 4,
                          .authmode = WIFI_AUTH_WPA_WPA2_PSK
                      }
                  };

                  esp_wifi_set_mode(WIFI_MODE_APSTA);
                  esp_wifi_set_config(WIFI_IF_AP, &ap_config);
                  esp_wifi_start();

                  ESP_LOGI(TAG, "Fallback AP started");
              }
          }
          EOF

# =====================================================
# MQTT PLACEHOLDER (DISABLED SAFE)
# =====================================================
      - name: Inject MQTT placeholder
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          #include "esp_log.h"

          void mqtt_bridge_start(void)
          {
              ESP_LOGI("MQTT", "Disabled in Boot Safe build");
          }
          EOF

# =====================================================
# PATCH main.c
# =====================================================
      - name: Patch main.c safely
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'extensions/web_ui.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/web_ui.h"' $FILE

          grep -q 'extensions/ap_hook.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/ap_hook.h"' $FILE

          grep -q 'extensions/mqtt_bridge.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/mqtt_bridge.h"' $FILE

          grep -q 'web_ui_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(12000));\
          web_ui_start();\
          vTaskDelay(pdMS_TO_TICKS(2000));\
          ap_fallback_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-boot-safe
          path: examples/factory_demo/build/factory_merged.bin
