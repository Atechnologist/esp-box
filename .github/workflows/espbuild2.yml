              if (strstr(buf, "on") != NULL) {
                  led_state = true;
                  app_pwm_led_set_power(true);
                  httpd_resp_send(req, "{\"led\":\"on\"}", HTTPD_RESP_USE_STRLEN);
              } else if (strstr(buf, "off") != NULL) {
                  led_state = false;
                  app_pwm_led_set_power(false);
                  httpd_resp_send(req, "{\"led\":\"off\"}", HTTPD_RESP_USE_STRLEN);
              } else {
                  httpd_resp_send(req, "{\"error\":\"invalid\"}", HTTPD_RESP_USE_STRLEN);
              }
              return ESP_OK;
          }
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<!DOCTYPE html>"
