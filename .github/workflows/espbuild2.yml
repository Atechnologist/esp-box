name: ESP32-S3-BOX FINAL BOOT SAFE LAYER 2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE EXTENSIONS
# =====================================================
      - name: Create extensions folder
        run: mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEB UI HEADER
# =====================================================
      - name: Create web_ui.h
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          void web_ui_start(void);
          #ifdef __cplusplus
          }
          #endif
          EOF

# =====================================================
# WEB UI SOURCE
# =====================================================
      - name: Create web_ui.c
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "web_ui.h"
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP-BOX</h1>"
              "<button onclick=\"fetch('/toggle')\">Light</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP HEADER
# =====================================================
      - name: Create ap_hook.h
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.h << 'EOF'
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          void ap_fallback_start(void);
          #ifdef __cplusplus
          }
          #endif
          EOF

# =====================================================
# AP SOURCE
# =====================================================
      - name: Create ap_hook.c
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "ap_hook.h"
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "Fallback AP started");
          }
          EOF

# =====================================================
# MQTT HEADER
# =====================================================
      - name: Create mqtt_bridge.h
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.h << 'EOF'
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          void mqtt_bridge_start(void);
          #ifdef __cplusplus
          }
          #endif
          EOF

# =====================================================
# MQTT SOURCE
# =====================================================
      - name: Create mqtt_bridge.c
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          static void mqtt_event(
              void *handler_args,
              esp_event_base_t base,
              int32_t event_id,
              void *event_data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {
                  ESP_LOGI(TAG, "MQTT connected");
                  esp_mqtt_client_publish(
                      client,
                      "espbox/status",
                      "online",
                      0,
                      1,
                      1
                  );
              }
          }

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);

              esp_mqtt_client_register_event(
                  client,
                  ESP_EVENT_ANY_ID,
                  mqtt_event,
                  NULL
              );

              esp_mqtt_client_start(client);
          }
          EOF

# =====================================================
# PATCH CMAKE
# =====================================================
      - name: Patch CMakeLists.txt
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i '/extensions\/web_ui.c/d' $FILE || true
          sed -i '/extensions\/ap_hook.c/d' $FILE || true
          sed -i '/extensions\/mqtt_bridge.c/d' $FILE || true

          sed -i 's/main.c/main.c extensions\/web_ui.c extensions\/ap_hook.c extensions\/mqtt_bridge.c/g' $FILE

# =====================================================
# PATCH main.c HEADERS
# =====================================================
      - name: Add headers to main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/web_ui.h"' $FILE

          grep -q ap_hook.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/ap_hook.h"' $FILE

          grep -q mqtt_bridge.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/mqtt_bridge.h"' $FILE

# =====================================================
# PATCH main.c BOOT ORDER
# =====================================================
      - name: Add startup calls
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui_start $FILE || \
          sed -i '/app_rmaker_start()/a web_ui_start();' $FILE

          grep -q ap_fallback_start $FILE || \
          sed -i '/web_ui_start();/a ap_fallback_start();' $FILE

          grep -q mqtt_bridge_start $FILE || \
          sed -i '/ap_fallback_start();/a vTaskDelay(pdMS_TO_TICKS(5000)); mqtt_bridge_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-final-bootsafe-layer2
          path: examples/factory_demo/build
