name: ESP32-S3-BOX FINAL STABLE BUILD (RainMaker + WebUI + MQTT + WiFi Recover)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

    # =====================================================
    # CHECKOUT
    # =====================================================
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - name: Safe git fix
      run: git config --global --add safe.directory '*'

    # =====================================================
    # CLEAN
    # =====================================================
    - name: Clean old build
      run: |
        rm -rf examples/factory_demo/build || true

    # =====================================================
    # CREATE WEB SERVER
    # =====================================================
    - name: Add WebUI
      run: |
        cat > examples/factory_demo/main/web_server.c << 'EOF'
        #include "esp_http_server.h"
        #include "esp_log.h"
        #include <stdbool.h>

        static const char *TAG = "WEB";
        extern void app_pwm_led_set_power(bool on);
        static bool led_state = false;

        static esp_err_t root_handler(httpd_req_t *req)
        {
            const char html[] =
            "<html><body style='text-align:center;font-family:sans-serif;'>"
            "<h1>ESP32-S3-BOX</h1>"
            "<button onclick=\"fetch('/toggle')\">Toggle LED</button>"
            "</body></html>";

            httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        static esp_err_t toggle_handler(httpd_req_t *req)
        {
            led_state = !led_state;
            app_pwm_led_set_power(led_state);
            httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        void web_server_start(void)
        {
            httpd_handle_t server = NULL;
            httpd_config_t config = HTTPD_DEFAULT_CONFIG();

            if (httpd_start(&server, &config) == ESP_OK) {

                httpd_uri_t root = {
                    .uri = "/",
                    .method = HTTP_GET,
                    .handler = root_handler
                };

                httpd_uri_t toggle = {
                    .uri = "/toggle",
                    .method = HTTP_GET,
                    .handler = toggle_handler
                };

                httpd_register_uri_handler(server, &root);
                httpd_register_uri_handler(server, &toggle);

                ESP_LOGI(TAG, "Web server started");
            }
        }
        EOF

    # =====================================================
    # CREATE MQTT
    # =====================================================
    - name: Add MQTT bridge
      run: |
        cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
        #include "mqtt_client.h"
        #include "esp_log.h"

        static const char *TAG = "MQTT";
        static esp_mqtt_client_handle_t client = NULL;

        static void mqtt_event_handler(void *handler_args,
                                      esp_event_base_t base,
                                      int32_t event_id,
                                      void *event_data)
        {
            switch ((esp_mqtt_event_id_t)event_id) {

                case MQTT_EVENT_CONNECTED:
                    ESP_LOGI(TAG, "MQTT CONNECTED");
                    break;

                case MQTT_EVENT_DISCONNECTED:
                    ESP_LOGI(TAG, "MQTT DISCONNECTED");
                    break;

                default:
                    break;
            }
        }

        void mqtt_bridge_start(void)
        {
            esp_mqtt_client_config_t cfg = {
                .broker.address.uri = "mqtt://broker.emqx.io"
            };

            client = esp_mqtt_client_init(&cfg);

            esp_mqtt_client_register_event(
                client,
                ESP_EVENT_ANY_ID,
                mqtt_event_handler,
                NULL
            );

            esp_mqtt_client_start(client);
            ESP_LOGI(TAG, "MQTT started");
        }
        EOF

    # =====================================================
    # HEADER FILE
    # =====================================================
    - name: Add header
      run: |
        cat > examples/factory_demo/main/custom_services.h << 'EOF'
        #pragma once
        void web_server_start(void);
        void mqtt_bridge_start(void);
        EOF

    # =====================================================
    # PATCH MAIN.C
    # =====================================================
    - name: Patch main.c safely
      run: |
        FILE=examples/factory_demo/main/main.c

        sed -i '/custom_services.h/d' $FILE || true
        sed -i '/web_server_start/d' $FILE || true
        sed -i '/mqtt_bridge_start/d' $FILE || true
        sed -i '/esp_wifi_set_ps/d' $FILE || true

        grep -q '#include "custom_services.h"' $FILE || \
        sed -i '/#include "app_rmaker.h"/a #include "custom_services.h"' $FILE

        grep -q '#include "esp_wifi.h"' $FILE || \
        sed -i '/#include "custom_services.h"/a #include "esp_wifi.h"' $FILE

        grep -q 'web_server_start();' $FILE || \
        sed -i '/app_rmaker_start()/a \
        esp_wifi_set_ps(WIFI_PS_NONE);\
        vTaskDelay(pdMS_TO_TICKS(8000));\
        web_server_start();\
        mqtt_bridge_start();' $FILE

    # =====================================================
    # BUILD
    # =====================================================
    - name: Build firmware
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo
        idf.py set-target esp32s3
        cp sdkconfig.ci.box sdkconfig
        idf.py fullclean
        idf.py reconfigure
        idf.py build

    # =====================================================
    # MERGE BIN
    # =====================================================
    - name: Merge firmware
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo/build

        python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_merged.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

    # =====================================================
    # UPLOAD
    # =====================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-box-final-stable
        path: examples/factory_demo/build/factory_merged.bin
