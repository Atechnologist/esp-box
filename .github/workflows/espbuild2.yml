name: ESP32-S3-BOX CLEAN STABLE BUILD (RainMaker + WebUI + AP fallback + MQTT)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN BUILD STATE (IMPORTANT FIX)
      # ---------------------------
      - name: Clean ESP-IDF build cache
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf build || true

      # ---------------------------
      # FIX COMPONENT MANAGER
      # ---------------------------
      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ---------------------------
      # REMOVE ANY BROKEN TOUCH/LCD PATCHES (SAFE)
      # ---------------------------
      - name: Fix component conflicts
        run: |
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/ili9341/d' {} \; || true

      # ---------------------------
      # CREATE AP FALLBACK (IMPROVED - WAITS FOR WIFI TIMEOUT)
      # ---------------------------
      - name: Add AP fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include "esp_event.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          
          static const char *TAG = "AP_FALLBACK";
          static uint8_t wifi_fail_count = 0;
          static const uint8_t WIFI_FAIL_THRESHOLD = 5;
          static bool ap_started = false;
          
          static void wifi_event_handler(void *arg, esp_event_base_t event_base,
                                        int32_t event_id, void *event_data)
          {
              if (event_base == WIFI_EVENT && event_id == WIFI_EVENT_STA_DISCONNECTED) {
                  wifi_fail_count++;
                  ESP_LOGI(TAG, "WiFi disconnected, attempt %d/%d", 
                          wifi_fail_count, WIFI_FAIL_THRESHOLD);
                  
                  if (wifi_fail_count >= WIFI_FAIL_THRESHOLD && !ap_started) {
                      start_ap_fallback();
                  }
              } else if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {
                  wifi_fail_count = 0;
                  ESP_LOGI(TAG, "WiFi connected, resetting fail counter");
              }
          }
          
          void ap_fallback_init(void)
          {
              esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, 
                                        wifi_event_handler, NULL);
              esp_event_handler_register(IP_EVENT, IP_EVENT_STA_GOT_IP, 
                                        wifi_event_handler, NULL);
          }
          
          void start_ap_fallback(void)
          {
              if (ap_started) {
                  return;
              }
              
              ap_started = true;
              ESP_LOGI(TAG, "Starting AP fallback mode");
              
              wifi_config_t ap_config = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };
              
              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP, &ap_config);
              esp_wifi_start();
              
              ESP_LOGI(TAG, "AP fallback started on SSID: ESP32-BOX-SETUP");
          }
          EOF

      # ---------------------------
      # CREATE WEB SERVER
      # ---------------------------
      - name: Add Web Server (SAFE)
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"
          
          static const char *TAG = "WEB";
          extern void app_pwm_led_set_power(bool on);
          
          static bool state = false;
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>WiFi: Connected</p>"
              "<button onclick=\"fetch('/toggle')\">Toggle LED</button>"
              "</body></html>";
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t toggle_handler(httpd_req_t *req)
          {
              state = !state;
              app_pwm_led_set_power(state);
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;
              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };
                  httpd_uri_t toggle = {
                      .uri = "/toggle",
                      .method = HTTP_GET,
                      .handler = toggle_handler
                  };
                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &toggle);
                  ESP_LOGI(TAG, "Web server started on port 80");
              }
          }
          EOF

      # ---------------------------
      # CREATE MQTT BRIDGE (IMPROVED - WAITS FOR WIFI)
      # ---------------------------
      - name: Add MQTT Bridge
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_event.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          
          static const char *TAG = "MQTT_BRIDGE";
          static esp_mqtt_client_handle_t mqtt_client = NULL;
          static bool mqtt_enabled = false;
          
          static void mqtt_event_handler(void *handler_args, esp_event_base_t base, 
                                        int32_t event_id, void *event_data)
          {
              esp_mqtt_event_handle_t event = event_data;
              switch (event->event_id) {
                  case MQTT_EVENT_CONNECTED:
                      ESP_LOGI(TAG, "MQTT connected, subscribing to topics");
                      esp_mqtt_client_subscribe(mqtt_client, "esp32/led", 0);
                      esp_mqtt_client_subscribe(mqtt_client, "esp32/cmd", 0);
                      break;
                  case MQTT_EVENT_DISCONNECTED:
                      ESP_LOGI(TAG, "MQTT disconnected");
                      break;
                  case MQTT_EVENT_DATA:
                      ESP_LOGI(TAG, "MQTT data received on topic: %.*s", 
                              event->topic_len, event->topic);
                      break;
                  case MQTT_EVENT_ERROR:
                      ESP_LOGE(TAG, "MQTT error: %d", event->error_handle->error_type);
                      break;
                  default:
                      break;
              }
          }
          
          static void mqtt_task(void *pvParameters)
          {
              vTaskDelay(pdMS_TO_TICKS(8000));
              
              ESP_LOGI(TAG, "Initializing MQTT client");
              
              esp_mqtt_client_config_t mqtt_cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com:1883",
                  .credentials.client_id = "esp32-box-client",
                  .network.reconnect_timeout_ms = 10000,
              };
              
              mqtt_client = esp_mqtt_client_init(&mqtt_cfg);
              
              if (mqtt_client) {
                  esp_mqtt_client_register_event(mqtt_client, ESP_EVENT_ANY_ID, 
                                                mqtt_event_handler, NULL);
                  esp_mqtt_client_start(mqtt_client);
                  ESP_LOGI(TAG, "MQTT bridge started");
              } else {
                  ESP_LOGE(TAG, "Failed to initialize MQTT client");
              }
              
              vTaskDelete(NULL);
          }
          
          void mqtt_bridge_start(void)
          {
              if (mqtt_enabled) {
                  return;
              }
              
              mqtt_enabled = true;
              xTaskCreatePinnedToCore(mqtt_task, "mqtt_task", 4096, NULL, 5, NULL, 1);
          }
          
          void mqtt_bridge_publish(const char *topic, const char *data)
          {
              if (mqtt_client != NULL) {
                  esp_mqtt_client_publish(mqtt_client, topic, data, 0, 1, 0);
              }
          }
          EOF

      # ---------------------------
      # CREATE HEADERS
      # ---------------------------
      - name: Add web_server.h
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void web_server_start(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      - name: Add ap_fallback.h
        run: |
          cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void ap_fallback_init(void);
          void start_ap_fallback(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      - name: Add mqtt_bridge.h
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void mqtt_bridge_start(void);
          void mqtt_bridge_publish(const char *topic, const char *data);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # PATCH CMakeLists.txt
      # ---------------------------
      - name: Patch CMakeLists.txt
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          
          if ! grep -q "ap_fallback.c" $FILE; then
            sed -i '/SRCS.*main\.c/s/.*/& ap_fallback.c web_server.c mqtt_bridge.c/' $FILE
          fi

      # ---------------------------
      # FIX main.c SAFELY
      # ---------------------------
      - name: Patch main.c safely - Add includes
        run: |
          FILE=examples/factory_demo/main/main.c
          
          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)
          
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/ap_fallback.h/d' $FILE || true
          sed -i '/mqtt_bridge.h/d' $FILE || true
          
          sed -i "${LAST_INCLUDE}a\\
          #include \"web_server.h\"\n#include \"ap_fallback.h\"\n#include \"mqtt_bridge.h\"" $FILE

      - name: Patch main.c safely - Add function calls
        run: |
          FILE=examples/factory_demo/main/main.c
          
          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/start_ap_fallback()/d' $FILE || true
          sed -i '/ap_fallback_init()/d' $FILE || true
          sed -i '/mqtt_bridge_start()/d' $FILE || true
          
          grep -q 'ap_fallback_init' $FILE || \
          sed -i '/app_rmaker_start()/i \
          ap_fallback_init();' $FILE
          
          grep -q 'web_server_start' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(4000));\
          web_server_start();\
          mqtt_bridge_start();' $FILE

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ---------------------------
      # ARTIFACT
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-mqtt-build
          path: examples/factory_demo/build/factory_merged.bin
