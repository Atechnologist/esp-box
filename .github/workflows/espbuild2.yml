name: ESP32-S3-BOX GOLDEN STABLE RESTORE (SR SAFE + WEBUI + MQTT)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN BUILD
# =====================================================
      - name: Clean build
        run: rm -rf examples/factory_demo/build

# =====================================================
# RESTORE CLEAN CMakeLists (CRITICAL FIX)
# =====================================================
      - name: Restore clean main CMakeLists
        run: |
          cat > examples/factory_demo/main/CMakeLists.txt << 'EOF'
          idf_component_register(
              SRCS
                  "main.c"
                  "extensions/web_ui.c"
                  "extensions/ap_hook.c"
                  "extensions/mqtt_bridge.c"
              INCLUDE_DIRS
                  "."
                  "extensions"
              REQUIRES
                  esp_http_server
                  esp_wifi
                  mqtt
                  esp_netif
          )
          EOF

# =====================================================
# EXTENSIONS STRUCTURE
# =====================================================
      - name: Create extensions folder
        run: mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEBUI
# =====================================================
      - name: WebUI
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          void web_ui_start(void);
          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "web_ui.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body><h1>ESP32 BOX</h1></body></html>";
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };
                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: AP fallback
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "AP started");
          }
          EOF

# =====================================================
# MQTT SAFE LAYER
# =====================================================
      - name: MQTT bridge
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

# =====================================================
# FIX MAIN.C (CRITICAL: REMOVE IMPLICIT ERRORS)
# =====================================================
      - name: Fix main includes
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui_start $FILE || \
          sed -i '/app_main/a void web_ui_start(void); void ap_fallback_start(void); void mqtt_bridge_start(void);' $FILE

# =====================================================
# BUILD SAFE MODE (SR BOOT FIX)
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo

          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# OUTPUT BIN ONLY
# =====================================================
      - name: Extract BIN only
        run: |
          mkdir -p output
          cp examples/factory_demo/build/*.bin output/ || true

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-golden-stable
          path: output
