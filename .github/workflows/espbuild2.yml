name: ESP32-S3-BOX BOOT SAFE LAYER 2 (STABLE SR + MQTT + WEBUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# EXTENSIONS DIR
# =====================================================
      - name: Create extensions
        run: mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEBUI (BOOT SAFE)
# =====================================================
      - name: WebUI
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          #ifdef __cplusplus
          extern "C" {
          #endif
          void web_ui_start(void);
          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP-BOX SAFE MODE</h1>"
              "<button onclick=\"fetch('/toggle')\">Toggle</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t r = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root
                  };

                  httpd_register_uri_handler(server, &r);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: AP fallback
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "AP fallback active");
          }
          EOF

# =====================================================
# MQTT SAFE (DEFERRED START)
# =====================================================
      - name: MQTT bridge
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          void mqtt_bridge_start(void);

          static void handler(void *arg, esp_event_base_t base,
                              int32_t event_id, void *event_data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {
                  ESP_LOGI(TAG, "MQTT connected");
                  esp_mqtt_client_publish(client, "espbox/status", "online", 0, 1, 1);
              }
          }

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(client, ESP_EVENT_ANY_ID, handler, NULL);
              esp_mqtt_client_start(client);
          }
          EOF

# =====================================================
# FIX CMAKE (CRITICAL FIX)
# =====================================================
      - name: Fix CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i '/extensions\/web_ui.c/d' $FILE || true
          sed -i '/extensions\/ap_hook.c/d' $FILE || true
          sed -i '/extensions\/mqtt_bridge.c/d' $FILE || true

          sed -i '/idf_component_register(/a \
          SRCS \
              "main.c" \
              "extensions/web_ui.c" \
              "extensions/ap_hook.c" \
              "extensions/mqtt_bridge.c"' $FILE

# =====================================================
# FIX main.c ORDER (BOOT SAFE CRITICAL)
# =====================================================
      - name: Patch main.c boot-safe order
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui_start $FILE || \
          sed -i '/app_rmaker_start()/a web_ui_start();' $FILE

          grep -q ap_fallback_start $FILE || \
          sed -i '/web_ui_start();/a ap_fallback_start();' $FILE

          # MQTT DELAY (CRITICAL FOR BOOT STABILITY)
          grep -q mqtt_bridge_start $FILE || \
          sed -i '/ap_fallback_start();/a vTaskDelay(pdMS_TO_TICKS(5000)); mqtt_bridge_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-boot-safe-layer2
          path: examples/factory_demo/build
