name: ESP32-S3-BOX BOOT SAFE SR FULL BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean old build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# WEB UI MODULE
# =====================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/web_ui.h <<'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/web_ui.c <<'EOF'
          #include "web_ui.h"
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Boot Safe SR Build</p>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t cfg = HTTPD_DEFAULT_CONFIG();

              cfg.stack_size = 4096;

              if (httpd_start(&server, &cfg) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK MODULE
# =====================================================
      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.h <<'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/ap_fallback.c <<'EOF'
          #include "ap_fallback.h"
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t cfg = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 1,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP, &cfg);
              esp_wifi_start();

              ESP_LOGI(TAG, "Fallback AP started");
          }
          EOF

# =====================================================
# DELAYED STARTUP
# =====================================================
      - name: Inject delayed services
        run: |
          cat > examples/factory_demo/main/late_start.h <<'EOF'
          #pragma once
          void late_services_start(void);
          EOF

          cat > examples/factory_demo/main/late_start.c <<'EOF'
          #include "late_start.h"
          #include "web_ui.h"
          #include "ap_fallback.h"

          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "esp_log.h"

          static const char *TAG = "LATE";

          static void late_task(void *arg)
          {
              ESP_LOGI(TAG, "Waiting for speech recognition init");

              vTaskDelay(pdMS_TO_TICKS(20000));

              web_ui_start();

              vTaskDelay(pdMS_TO_TICKS(5000));

              ap_fallback_start();

              ESP_LOGI(TAG, "Late services started");

              vTaskDelete(NULL);
          }

          void late_services_start(void)
          {
              xTaskCreate(
                  late_task,
                  "late_task",
                  4096,
                  NULL,
                  5,
                  NULL
              );
          }
          EOF

# =====================================================
# PATCH CMakeLists
# =====================================================
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i 's/main.c/main.c web_ui.c ap_fallback.c late_start.c/' $FILE

# =====================================================
# PATCH main.c
# =====================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'late_start.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "late_start.h"' $FILE

          grep -q 'late_services_start();' $FILE || \
          sed -i '/app_rmaker_start()/a\
              late_services_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig

          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================
      - name: Create merged BIN
        run: |
          . $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o esp32s3box_bootsafe_sr.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# =====================================================
# UPLOAD BIN
# =====================================================
      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-bootsafe-sr-bin
          path: examples/factory_demo/build/esp32s3box_bootsafe_sr.bin
