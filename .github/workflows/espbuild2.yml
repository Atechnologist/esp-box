name: ESP32-S3-BOX ENTERPRISE CONTROL PANEL V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================

      - name: Clean
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# COMPONENT MANAGER
# =====================================================

      - name: Enable manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

# =====================================================
# MQTT + WEB CONTROL SOURCE
# =====================================================

      - name: Add control_panel.c
        run: |
          cat > examples/factory_demo/main/control_panel.c << 'EOF'
          #include <string.h>
          #include "esp_log.h"
          #include "esp_system.h"
          #include "esp_http_server.h"
          #include "mqtt_client.h"
          #include "esp_event.h"

          extern void app_driver_light_set_power(bool power);

          static const char *TAG = "CTRL";
          static httpd_handle_t server = NULL;
          static esp_mqtt_client_handle_t client = NULL;
          static bool light_state = false;

          static void set_light(bool on)
          {
              light_state = on;
              app_driver_light_set_power(on);
              ESP_LOGI(TAG, "Light %s", on ? "ON" : "OFF");
          }

          static esp_err_t root_handler(httpd_req_t *req)
          {
              char html[4096];

              snprintf(html, sizeof(html),
              "<html><head>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<style>"
              "body{font-family:Arial;text-align:center;background:#111;color:#fff;padding:20px;}"
              "button{font-size:24px;padding:15px 25px;margin:10px;border:none;border-radius:12px;}"
              ".on{background:#00c853;color:white;}"
              ".off{background:#d50000;color:white;}"
              ".reboot{background:#2962ff;color:white;}"
              "</style></head><body>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Enterprise Control Panel</p>"
              "<p>Light: <b>%s</b></p>"
              "<button class='on' onclick=\"fetch('/on').then(()=>location.reload())\">LIGHT ON</button><br>"
              "<button class='off' onclick=\"fetch('/off').then(()=>location.reload())\">LIGHT OFF</button><br>"
              "<button class='reboot' onclick=\"fetch('/reboot')\">REBOOT</button>"
              "</body></html>",
              light_state ? "ON" : "OFF");

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t on_handler(httpd_req_t *req)
          {
              set_light(true);
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t off_handler(httpd_req_t *req)
          {
              set_light(false);
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t reboot_handler(httpd_req_t *req)
          {
              httpd_resp_send(req, "REBOOTING", HTTPD_RESP_USE_STRLEN);
              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          static void web_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {.uri="/", .method=HTTP_GET, .handler=root_handler};
                  httpd_uri_t on   = {.uri="/on", .method=HTTP_GET, .handler=on_handler};
                  httpd_uri_t off  = {.uri="/off", .method=HTTP_GET, .handler=off_handler};
                  httpd_uri_t reb  = {.uri="/reboot", .method=HTTP_GET, .handler=reboot_handler};

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &on);
                  httpd_register_uri_handler(server, &off);
                  httpd_register_uri_handler(server, &reb);

                  ESP_LOGI(TAG, "Web panel started");
              }
          }

          static void mqtt_event(void *arg, esp_event_base_t base,
                                 int32_t event_id, void *data)
          {
              esp_mqtt_event_handle_t event = data;

              if (event_id == MQTT_EVENT_CONNECTED) {
                  esp_mqtt_client_subscribe(client, "esp32/box/light", 0);
                  esp_mqtt_client_subscribe(client, "esp32/box/reboot", 0);
                  ESP_LOGI(TAG, "MQTT connected");
              }

              if (event_id == MQTT_EVENT_DATA) {

                  char topic[128];
                  char msg[128];

                  memset(topic,0,sizeof(topic));
                  memset(msg,0,sizeof(msg));

                  memcpy(topic,event->topic,event->topic_len);
                  memcpy(msg,event->data,event->data_len);

                  if (!strcmp(topic,"esp32/box/light")) {
                      if (!strcmp(msg,"on")) set_light(true);
                      if (!strcmp(msg,"off")) set_light(false);
                  }

                  if (!strcmp(topic,"esp32/box/reboot")) {
                      esp_restart();
                  }
              }
          }

          static void mqtt_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.emqx.io",
                  .credentials.client_id = "esp32-box-v2",
                  .network.reconnect_timeout_ms = 5000
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(client, ESP_EVENT_ANY_ID, mqtt_event, NULL);
              esp_mqtt_client_start(client);
          }

          void control_panel_start(void)
          {
              web_start();
              mqtt_start();
          }
          EOF

# =====================================================
# HEADER
# =====================================================

      - name: Add header
        run: |
          cat > examples/factory_demo/main/control_panel.h << 'EOF'
          #pragma once
          void control_panel_start(void);
          EOF

# =====================================================
# PATCH MAIN.C
# =====================================================

      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'control_panel.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "control_panel.h"' $FILE

          grep -q 'control_panel_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(8000));\
          control_panel_start();' $FILE

# =====================================================
# BUILD
# =====================================================

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================

      - name: Merge
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o control_panel_v2.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

# =====================================================
# UPLOAD
# =====================================================

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-control-panel-v2
          path: examples/factory_demo/build/control_panel_v2.bin
