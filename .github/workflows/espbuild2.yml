name: ESP32-S3-BOX FINAL FIXED YAML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

      # -------------------------------------------------
      # Clean previous build
      # -------------------------------------------------
      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true

      # -------------------------------------------------
      # Inject WebUI (SAFE)
      # -------------------------------------------------
      - name: Create WebUI files
        run: |
          mkdir -p examples/factory_demo/main

          cat > examples/factory_demo/main/web_ui.h <<'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/web_ui.c <<'EOF'
          #include "web_ui.h"
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char resp[] =
                  "<html><body style='text-align:center;'>"
                  "<h1>ESP-BOX</h1>"
                  "<p>WebUI Running</p>"
                  "</body></html>";

              httpd_resp_send(req, resp, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

      # -------------------------------------------------
      # Inject MQTT Layer 2 SAFE
      # -------------------------------------------------
      - name: Create MQTT files
        run: |
          cat > examples/factory_demo/main/mqtt_layer.h <<'EOF'
          #pragma once
          void mqtt_layer_start(void);
          EOF

          cat > examples/factory_demo/main/mqtt_layer.c <<'EOF'
          #include "mqtt_layer.h"
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";

          static void mqtt_event_handler(void *handler_args,
                                         esp_event_base_t base,
                                         int32_t event_id,
                                         void *event_data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {
                  ESP_LOGI(TAG, "MQTT Connected");
              }
          }

          void mqtt_layer_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              esp_mqtt_client_handle_t client =
                  esp_mqtt_client_init(&cfg);

              esp_mqtt_client_register_event(
                  client,
                  ESP_EVENT_ANY_ID,
                  mqtt_event_handler,
                  NULL);

              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

      # -------------------------------------------------
      # Register new source files
      # -------------------------------------------------
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          grep -q web_ui.c $FILE || \
          sed -i 's/main.c/main.c web_ui.c mqtt_layer.c/' $FILE

      # -------------------------------------------------
      # Patch main.c safely
      # -------------------------------------------------
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_ui.h"' $FILE

          grep -q mqtt_layer.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "mqtt_layer.h"' $FILE

          grep -q web_ui_start $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(5000));\
          web_ui_start();\
          mqtt_layer_start();' $FILE

      # -------------------------------------------------
      # Build
      # -------------------------------------------------
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

      # -------------------------------------------------
      # Merge BIN
      # -------------------------------------------------
      - name: Merge BIN
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o final_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # -------------------------------------------------
      # Upload Artifact
      # -------------------------------------------------
      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-final-bin
          path: examples/factory_demo/build/final_merged.bin
