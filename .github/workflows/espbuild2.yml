name: ESP32-S3-BOX PRODUCTION SR STABLE BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

      # =====================================================
      # CLEAN
      # =====================================================
      - name: Clean old build
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true

      # =====================================================
      # PATCH SDKCONFIG FOR PERMANENT SR STABILITY
      # =====================================================
      - name: Patch sdkconfig
        run: |
          FILE=examples/factory_demo/sdkconfig.ci.box

          echo "" >> $FILE
          echo "# ===== PRODUCTION SR SAFE =====" >> $FILE
          echo "CONFIG_ESP_SR_MODEL_WN9_HILEXIN=y" >> $FILE
          echo "# CONFIG_ESP_SR_MODEL_WN9_NIHAOXIAOZHI is not set" >> $FILE
          echo "# CONFIG_ESP_SR_MODEL_WN9_ALEXA is not set" >> $FILE
          echo "# CONFIG_ESP_SR_MODEL_WN9_CUSTOMIZED is not set" >> $FILE

          echo "CONFIG_ESP_SR_WN_WAKENET9=y" >> $FILE
          echo "CONFIG_ESP_SR_ENABLE_WAKENET=y" >> $FILE
          echo "# CONFIG_ESP_SR_ENABLE_MULTINET is not set" >> $FILE
          echo "# CONFIG_ESP_SR_ENABLE_COMMAND_DETECT is not set" >> $FILE

          echo "CONFIG_SPIRAM=y" >> $FILE
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> $FILE
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> $FILE
          echo "CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y" >> $FILE

          echo "CONFIG_FREERTOS_HZ=1000" >> $FILE
          echo "CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192" >> $FILE
          echo "CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096" >> $FILE

          echo "CONFIG_COMPILER_OPTIMIZATION_PERF=y" >> $FILE

      # =====================================================
      # REMOVE BOOT LOOP SOURCES
      # =====================================================
      - name: Patch main source
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/esp_restart()/d' $FILE || true
          sed -i '/abort()/d' $FILE || true

      # =====================================================
      # BUILD
      # =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # =====================================================
      # MERGE BIN
      # =====================================================
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o production_sr_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =====================================================
      # UPLOAD
      # =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-production-sr-stable
          path: examples/factory_demo/build/production_sr_stable.bin
