name: ESP32-S3-BOX STABLE FACTORY CLEAN (RainMaker SAFE + WebUI + MQTT)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT (OFFICIAL ESP-BOX ONLY)
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git Directory
        run: git config --global --add safe.directory '*'

# =====================================================
# SAFE CLEAN (DO NOT BREAK RAINMAKER)
# =====================================================

      - name: Clean build only
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf build || true
          find examples/factory_demo/main -name "*.o" -delete || true

# =====================================================
# DO NOT TOUCH managed_components ❌
# =====================================================

      - name: Preserve RainMaker integrity
        run: |
          echo "Keeping managed_components intact (IMPORTANT)"

# =====================================================
# ADD SAFE EXTENSIONS (NO ESP_RMAKER EDITS)
# =====================================================

      - name: Add factory extensions folder
        run: |
          mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEBUI (SAFE, NO GPIO)
# =====================================================

      - name: WebUI module
        run: |
          cat > examples/factory_demo/main/extensions/webui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;font-family:Arial'>"
              "<h2>ESP32-S3-BOX STABLE FACTORY</h2>"
              "<p>RainMaker Controlled System</p>"
              "<p>WebUI SAFE MODE</p>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void factory_webui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t u = {.uri="/", .method=HTTP_GET, .handler=root};
                  httpd_register_uri_handler(server, &u);
                  ESP_LOGI(TAG, "WebUI started SAFE");
              }
          }
          EOF

# =====================================================
# MQTT (TELEMETRY ONLY)
# =====================================================

      - name: MQTT module
        run: |
          cat > examples/factory_demo/main/extensions/mqtt.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          static void mqtt_event(void *arg, esp_event_base_t base,
                                 int32_t event_id, void *event_data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {
                  ESP_LOGI(TAG, "MQTT connected");
                  esp_mqtt_client_publish(client, "esp32/box/status", "online", 0, 1, 0);
              }
          }

          void factory_mqtt_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.emqx.io",
                  .credentials.client_id = "esp32-box-stable"
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(client, ESP_EVENT_ANY_ID, mqtt_event, NULL);
              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started SAFE");
          }
          EOF

# =====================================================
# CONTROL LAYER STARTER (SR SAFE DELAY)
# =====================================================

      - name: Control plane starter
        run: |
          cat > examples/factory_demo/main/extensions/control.c << 'EOF'
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "esp_log.h"

          extern void factory_webui_start(void);
          extern void factory_mqtt_start(void);

          static const char *TAG = "CTRL";

          static void delayed_start(void *arg)
          {
              vTaskDelay(pdMS_TO_TICKS(20000));

              ESP_LOGI(TAG, "Starting SAFE extensions...");

              factory_webui_start();
              factory_mqtt_start();

              ESP_LOGI(TAG, "All systems ONLINE SAFE");

              vTaskDelete(NULL);
          }

          void factory_control_start(void)
          {
              xTaskCreate(delayed_start, "ctrl", 8192, NULL, 5, NULL);
          }
          EOF

# =====================================================
# PATCH MAIN.C SAFELY
# =====================================================

      - name: Patch main.c safely
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'factory_control_start' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(15000));\
          factory_control_start();' $FILE

# =====================================================
# BUILD FIRMWARE
# =====================================================

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================

      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o STABLE_FACTORY.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# =====================================================
# UPLOAD ARTIFACT
# =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-stable-factory
          path: examples/factory_demo/build/STABLE_FACTORY.bin
