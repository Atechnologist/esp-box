name: ESP32-S3-BOX ULTIMATE BUILD (Voice + RainMaker + MQTT + WebUI + OTA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================

      - name: Clean build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# ENABLE COMPONENT MANAGER
# =====================================================

      - name: Enable manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

# =====================================================
# FIX COMPONENT CONFLICTS
# =====================================================

      - name: Fix dependencies
        run: |
          find . -name "idf_component.yml" -exec sed -i '/ili9341/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true

# =====================================================
# AP + STA WIFI MODE
# =====================================================

      - name: Add APSTA fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "WIFI";

          void start_ap_fallback(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "APSTA mode started");
          }
          EOF

# =====================================================
# WEB UI
# =====================================================

      - name: Add WebUI
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEB";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='font-family:sans-serif;text-align:center;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Ultimate Firmware Running</p>"
              "<button onclick=\"fetch('/ping')\">PING</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t ping_handler(httpd_req_t *req)
          {
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_uri_t ping = {
                      .uri = "/ping",
                      .method = HTTP_GET,
                      .handler = ping_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &ping);

                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# MQTT
# =====================================================

      - name: Add MQTT
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_event.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client = NULL;

          static void mqtt_event(void *handler_args,
                                 esp_event_base_t base,
                                 int32_t event_id,
                                 void *event_data)
          {
              switch(event_id) {
                  case MQTT_EVENT_CONNECTED:
                      ESP_LOGI(TAG, "Connected");
                      esp_mqtt_client_subscribe(client, "esp32/box/cmd", 0);
                      break;

                  case MQTT_EVENT_DATA:
                      ESP_LOGI(TAG, "Message received");
                      break;

                  default:
                      break;
              }
          }

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.emqx.io",
                  .credentials.client_id = "esp32s3-box"
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(client, ESP_EVENT_ANY_ID, mqtt_event, NULL);
              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

# =====================================================
# HEADERS
# =====================================================

      - name: Create headers
        run: |

          cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
          #pragma once
          void start_ap_fallback(void);
          EOF

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

# =====================================================
# PATCH MAIN.C
# =====================================================

      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/web_server.c/d' $FILE || true
          sed -i '/mqtt_bridge.c/d' $FILE || true
          sed -i '/ap_fallback.c/d' $FILE || true

          grep -q 'web_server.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_server.h"' $FILE

          grep -q 'mqtt_bridge.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "mqtt_bridge.h"' $FILE

          grep -q 'ap_fallback.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "ap_fallback.h"' $FILE

          grep -q 'web_server_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(8000));\
          start_ap_fallback();\
          web_server_start();\
          mqtt_bridge_start();' $FILE

# =====================================================
# BUILD
# =====================================================

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================

      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o ultimate_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# =====================================================
# UPLOAD
# =====================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-ultimate
          path: examples/factory_demo/build/ultimate_box.bin
