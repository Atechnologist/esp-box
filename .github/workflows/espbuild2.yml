name: ESP32-S3-BOX BOOT SAFE PRODUCTION BUILD FIXED LINKER

# =====================================================
# FIXES:
# Your functions compile but were not linked.
# Reason: ESP-IDF main component only compiles sources
# listed in main/CMakeLists.txt
#
# This version auto-registers:
#   extensions/web_ui.c
#   extensions/ap_hook.c
#   extensions/mqtt_bridge.c
# =====================================================

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================
      - name: Clean
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE EXTENSIONS
# =====================================================
      - name: Create extensions
        run: mkdir -p examples/factory_demo/main/extensions

# =====================================================
# WEB UI
# =====================================================
      - name: Add WebUI
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "esp_http_server.h"

          static esp_err_t root(httpd_req_t *req)
          {
              httpd_resp_send(req,
              "<html><body><h1>ESP-BOX</h1></body></html>",
              HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t s=NULL;
              httpd_config_t c=HTTPD_DEFAULT_CONFIG();

              if(httpd_start(&s,&c)==ESP_OK){
                  httpd_uri_t u={
                      .uri="/",
                      .method=HTTP_GET,
                      .handler=root
                  };
                  httpd_register_uri_handler(s,&u);
              }
          }
          EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: Add AP fallback
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.h << 'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "esp_wifi.h"

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                .ap = {
                  .ssid="ESP32-BOX-SETUP",
                  .password="12345678",
                  .channel=6,
                  .max_connection=4,
                  .authmode=WIFI_AUTH_WPA_WPA2_PSK
                }
              };

              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP,&ap);
              esp_wifi_start();
          }
          EOF

# =====================================================
# MQTT PLACEHOLDER
# =====================================================
      - name: Add MQTT placeholder
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          void mqtt_bridge_start(void) {}
          EOF

# =====================================================
# IMPORTANT FIX: REGISTER FILES IN CMAKE
# =====================================================
      - name: Patch CMakeLists.txt
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i 's|SRCS "|SRCS "extensions/web_ui.c" "extensions/ap_hook.c" "extensions/mqtt_bridge.c" "|' $FILE

# =====================================================
# PATCH main.c
# =====================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_ui.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/web_ui.h"' $FILE

          grep -q ap_hook.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/ap_hook.h"' $FILE

          grep -q web_ui_start $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(12000));\
          web_ui_start();\
          ap_fallback_start();' $FILE

# =====================================================
# BUILD
# =====================================================
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE
# =====================================================
      - name: Merge BIN
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_merged.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-fixed-linker
          path: examples/factory_demo/build/factory_merged.bin
