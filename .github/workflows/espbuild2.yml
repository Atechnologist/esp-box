name: ESP32-S3-BOX SR SAFE FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================

      - name: Clean Build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# COMPONENT MANAGER
# =====================================================

      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

# =====================================================
# LIGHTWEIGHT WEBUI (SAFE)
# =====================================================

      - name: Add Safe WebUI
        run: |
          cat > examples/factory_demo/main/web_safe.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEB";

          static bool light_state = false;

          static esp_err_t root(httpd_req_t *req)
          {
              const char *html =
              "<html><body style='font-family:Arial;text-align:center;'>"
              "<h2>ESP32-S3-BOX</h2>"
              "<p>SR SAFE BUILD</p>"
              "<button onclick=\"fetch('/on')\">ON</button>"
              "<button onclick=\"fetch('/off')\">OFF</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t on(httpd_req_t *req)
          {
              light_state = true;
              ESP_LOGI(TAG,"LIGHT ON");
              httpd_resp_send(req,"OK",HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t off(httpd_req_t *req)
          {
              light_state = false;
              ESP_LOGI(TAG,"LIGHT OFF");
              httpd_resp_send(req,"OK",HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_safe_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server,&config) == ESP_OK) {

                  httpd_uri_t u0 = {
                      .uri="/",
                      .method=HTTP_GET,
                      .handler=root
                  };

                  httpd_uri_t u1 = {
                      .uri="/on",
                      .method=HTTP_GET,
                      .handler=on
                  };

                  httpd_uri_t u2 = {
                      .uri="/off",
                      .method=HTTP_GET,
                      .handler=off
                  };

                  httpd_register_uri_handler(server,&u0);
                  httpd_register_uri_handler(server,&u1);
                  httpd_register_uri_handler(server,&u2);

                  ESP_LOGI(TAG,"SAFE WEB STARTED");
              }
          }
          EOF

# =====================================================
# SAFE MQTT
# =====================================================

      - name: Add Safe MQTT
        run: |
          cat > examples/factory_demo/main/mqtt_safe.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_event.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client = NULL;

          static void event_handler(void *arg,
                                    esp_event_base_t base,
                                    int32_t event_id,
                                    void *data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {
                  ESP_LOGI(TAG,"CONNECTED");
                  esp_mqtt_client_subscribe(client,"esp32/box/cmd",0);
              }

              if (event_id == MQTT_EVENT_DATA) {
                  ESP_LOGI(TAG,"DATA RX");
              }
          }

          void mqtt_safe_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.emqx.io",
                  .credentials.client_id = "esp32-safe",
                  .network.reconnect_timeout_ms = 5000
              };

              client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(client,
                                             ESP_EVENT_ANY_ID,
                                             event_handler,
                                             NULL);
              esp_mqtt_client_start(client);
          }
          EOF

# =====================================================
# HEADERS
# =====================================================

      - name: Add Headers
        run: |
          cat > examples/factory_demo/main/web_safe.h << 'EOF'
          #pragma once
          void web_safe_start(void);
          EOF

          cat > examples/factory_demo/main/mqtt_safe.h << 'EOF'
          #pragma once
          void mqtt_safe_start(void);
          EOF

# =====================================================
# PATCH MAIN.C
# =====================================================

      - name: Patch Main Safely
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'web_safe.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_safe.h"' $FILE

          grep -q 'mqtt_safe.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "mqtt_safe.h"' $FILE

          grep -q 'web_safe_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(15000));\
          web_safe_start();\
          mqtt_safe_start();' $FILE

# =====================================================
# BUILD
# =====================================================

      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================

      - name: Merge Firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o sr_safe_final.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

# =====================================================
# UPLOAD
# =====================================================

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-sr-safe-final
          path: examples/factory_demo/build/sr_safe_final.bin
