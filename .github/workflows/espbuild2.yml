name: ESP32-S3-BOX FULL LAYER 2 SAFE BUILD

# ==========================================================
# Keeps your latest WORKING firmware:
# - WebUI
# - Same local IP access when internet is down
# - AP fallback
# - RainMaker
# - Factory demo core
#
# Adds:
# - MQTT Layer 2 bridge (safe)
# ==========================================================

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# ==========================================================
# CHECKOUT
# ==========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

# ==========================================================
# CLEAN BUILD CACHE
# ==========================================================
      - name: Clean build cache
        run: |
          rm -rf examples/factory_demo/build || true

# ==========================================================
# CREATE EXTENSIONS FOLDER
# ==========================================================
      - name: Create extensions folder
        run: |
          mkdir -p examples/factory_demo/main/extensions

# ==========================================================
# WEB UI MODULE
# ==========================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/extensions/web_ui.h << 'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/web_ui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEB_UI";

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP-BOX CONTROL</h1>"
              "<button onclick=\"fetch('/toggle')\">Toggle</button>"
              "<br><br>"
              "<button onclick=\"fetch('/mqttstatus')\">MQTT Status</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t toggle_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "Toggle pressed");
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t mqtt_handler(httpd_req_t *req)
          {
              httpd_resp_send(req, "MQTT Layer Enabled", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_uri_t toggle = {
                      .uri = "/toggle",
                      .method = HTTP_GET,
                      .handler = toggle_handler
                  };

                  httpd_uri_t mqtt = {
                      .uri = "/mqttstatus",
                      .method = HTTP_GET,
                      .handler = mqtt_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &toggle);
                  httpd_register_uri_handler(server, &mqtt);

                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# ==========================================================
# AP FALLBACK
# ==========================================================
      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/extensions/ap_hook.h << 'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/ap_hook.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP_FALLBACK";

          void ap_fallback_start(void)
          {
              wifi_mode_t mode;
              esp_wifi_get_mode(&mode);

              if (mode == WIFI_MODE_NULL || mode == WIFI_MODE_STA) {

                  wifi_config_t ap_config = {
                      .ap = {
                          .ssid = "ESP32-BOX-SETUP",
                          .password = "12345678",
                          .channel = 6,
                          .max_connection = 4,
                          .authmode = WIFI_AUTH_WPA_WPA2_PSK
                      }
                  };

                  esp_wifi_set_mode(WIFI_MODE_AP);
                  esp_wifi_set_config(WIFI_IF_AP, &ap_config);
                  esp_wifi_start();

                  ESP_LOGI(TAG, "Fallback AP started");
              }
          }
          EOF

# ==========================================================
# MQTT LAYER
# ==========================================================
      - name: Inject MQTT Layer
        run: |
          cat > examples/factory_demo/main/extensions/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

          cat > examples/factory_demo/main/extensions/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_system.h"
          #include <string.h>

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          static void process_cmd(const char *topic)
          {
              ESP_LOGI(TAG, "RX %s", topic);

              if (strcmp(topic, "espbox/cmd/reboot") == 0) {
                  esp_restart();
              }
          }

          static void mqtt_event_handler(void *handler_args,
                                         esp_event_base_t base,
                                         int32_t event_id,
                                         void *event_data)
          {
              esp_mqtt_event_handle_t event = event_data;

              switch (event_id) {

                  case MQTT_EVENT_CONNECTED:
                      ESP_LOGI(TAG, "Connected");

                      esp_mqtt_client_subscribe(client,
                                                "espbox/cmd/#",
                                                1);

                      esp_mqtt_client_publish(client,
                                              "espbox/status",
                                              "online",
                                              0,
                                              1,
                                              1);
                      break;

                  case MQTT_EVENT_DATA: {
                      char topic[128] = {0};

                      memcpy(topic,
                             event->topic,
                             event->topic_len);

                      process_cmd(topic);
                      break;
                  }

                  default:
                      break;
              }
          }

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);

              esp_mqtt_client_register_event(
                  client,
                  ESP_EVENT_ANY_ID,
                  mqtt_event_handler,
                  NULL
              );

              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

# ==========================================================
# PATCH MAIN.C
# ==========================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'extensions/web_ui.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/web_ui.h"' $FILE

          grep -q 'extensions/ap_hook.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/ap_hook.h"' $FILE

          grep -q 'extensions/mqtt_bridge.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "extensions/mqtt_bridge.h"' $FILE

          grep -q 'web_ui_start();' $FILE || \
          sed -i '/app_rmaker_start()/a web_ui_start();' $FILE

          grep -q 'ap_fallback_start();' $FILE || \
          sed -i '/web_ui_start();/a ap_fallback_start();' $FILE

          grep -q 'mqtt_bridge_start();' $FILE || \
          sed -i '/ap_fallback_start();/a mqtt_bridge_start();' $FILE

# ==========================================================
# BUILD
# ==========================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py reconfigure
          idf.py build

# ==========================================================
# MERGE BIN
# ==========================================================
      - name: Merge BIN
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o esp32s3-box-layer2.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# ==========================================================
# UPLOAD
# ==========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-layer2-safe
          path: examples/factory_demo/build/esp32s3-box-layer2.bin
