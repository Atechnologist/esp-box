name: ESP32-S3-BOX FINAL PRODUCTION BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

      # ==================================================
      # CLEAN
      # ==================================================
      - name: Clean build cache
        run: |
          rm -rf examples/factory_demo/build || true

      # ==================================================
      # CREATE EXTENSION FILES DIRECTLY IN main/
      # avoids CMake linker errors
      # ==================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/web_ui.h <<'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/web_ui.c <<'EOF'
          #include "web_ui.h"
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_get(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Production Build</p>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_get
                  };
                  httpd_register_uri_handler(server, &root);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.h <<'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/ap_fallback.c <<'EOF'
          #include "ap_fallback.h"
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t ap_cfg = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 1,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP, &ap_cfg);
              esp_wifi_start();

              ESP_LOGI(TAG, "Fallback AP enabled");
          }
          EOF

      # ==================================================
      # PATCH main.c
      # ==================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'web_ui.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_ui.h"' $FILE

          grep -q 'ap_fallback.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "ap_fallback.h"' $FILE

          grep -q 'web_ui_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
              vTaskDelay(pdMS_TO_TICKS(5000));\
              web_ui_start();\
              ap_fallback_start();' $FILE

      # ==================================================
      # BUILD
      # ==================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.defaults sdkconfig || true
          idf.py reconfigure
          idf.py build

      # ==================================================
      # MERGED BIN
      # ==================================================
      - name: Merge binary
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o final-production.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ==================================================
      # ARTIFACT
      # ==================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-final-production
          path: examples/factory_demo/build/final-production.bin
