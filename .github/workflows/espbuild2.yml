name: ESP32-S3-BOX ENTERPRISE FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN
# =====================================================

      - name: Clean Build
        run: |
          rm -rf examples/factory_demo/build || true

# =====================================================
# ENABLE COMPONENT MANAGER
# =====================================================

      - name: Enable Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

# =====================================================
# FIX DEPENDENCIES
# =====================================================

      - name: Fix Components
        run: |
          find . -name "idf_component.yml" -exec sed -i '/ili9341/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true

# =====================================================
# WIFI APSTA + MQTT EVENT START
# =====================================================

      - name: Add Enterprise Network Core
        run: |
          cat > examples/factory_demo/main/enterprise_net.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "esp_log.h"
          #include "mqtt_bridge.h"

          static const char *TAG = "NET";

          static void net_event(void *arg,
                                esp_event_base_t event_base,
                                int32_t event_id,
                                void *event_data)
          {
              if (event_base == IP_EVENT &&
                  event_id == IP_EVENT_STA_GOT_IP) {

                  ESP_LOGI(TAG, "STA GOT IP -> Start MQTT");
                  mqtt_bridge_start();
              }
          }

          void enterprise_network_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_event_handler_register(IP_EVENT,
                                         IP_EVENT_STA_GOT_IP,
                                         &net_event,
                                         NULL);

              esp_wifi_set_mode(WIFI_MODE_APSTA);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "APSTA started");
          }
          EOF

# =====================================================
# WEB UI
# =====================================================

      - name: Add WebUI
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEB";

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;font-family:sans-serif;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<p>Enterprise Firmware Online</p>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t uri = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root
                  };

                  httpd_register_uri_handler(server, &uri);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# MQTT PRO
# =====================================================

      - name: Add MQTT Pro
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_event.h"

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client = NULL;

          static void mqtt_event(void *arg,
                                 esp_event_base_t base,
                                 int32_t event_id,
                                 void *data)
          {
              switch(event_id) {

                  case MQTT_EVENT_CONNECTED:
                      ESP_LOGI(TAG, "CONNECTED");
                      esp_mqtt_client_subscribe(client,
                                                "esp32/box/cmd",
                                                0);
                      break;

                  case MQTT_EVENT_DISCONNECTED:
                      ESP_LOGI(TAG, "DISCONNECTED");
                      break;

                  case MQTT_EVENT_DATA:
                      ESP_LOGI(TAG, "DATA RX");
                      break;

                  default:
                      break;
              }
          }

          void mqtt_bridge_start(void)
          {
              if (client != NULL) return;

              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.emqx.io",
                  .credentials.client_id = "esp32s3-enterprise",
                  .network.reconnect_timeout_ms = 5000
              };

              client = esp_mqtt_client_init(&cfg);

              esp_mqtt_client_register_event(client,
                                             ESP_EVENT_ANY_ID,
                                             mqtt_event,
                                             NULL);

              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

# =====================================================
# HEADERS
# =====================================================

      - name: Headers
        run: |

          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

          cat > examples/factory_demo/main/enterprise_net.h << 'EOF'
          #pragma once
          void enterprise_network_start(void);
          EOF

# =====================================================
# PATCH MAIN.C
# =====================================================

      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'enterprise_net.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "enterprise_net.h"' $FILE

          grep -q 'web_server.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_server.h"' $FILE

          grep -q 'enterprise_network_start();' $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(5000));\
          enterprise_network_start();\
          web_server_start();' $FILE

# =====================================================
# BUILD
# =====================================================

      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# =====================================================
# MERGE BIN
# =====================================================

      - name: Merge Binary
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o enterprise_final.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

# =====================================================
# UPLOAD
# =====================================================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-enterprise-final
          path: examples/factory_demo/build/enterprise_final.bin
