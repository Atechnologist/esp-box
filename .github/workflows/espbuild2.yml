name: ESP32-S3-BOX FULL FIXED YAML
# Stable build keeps:
# - Factory Demo / RainMaker
# - Working WebUI
# - Local IP access
# - AP fallback
# Adds:
# - MQTT Layer 2 safe bridge
# FIXED:
# - No subfolder linker issue
# - All custom files placed in /main/

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# ==================================================
# CHECKOUT
# ==================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory
        run: git config --global --add safe.directory '*'

# ==================================================
# CLEAN
# ==================================================
      - name: Clean previous build
        run: |
          rm -rf examples/factory_demo/build || true

# ==================================================
# WEB UI MODULE
# ==================================================
      - name: Inject WebUI
        run: |
          cat > examples/factory_demo/main/web_ui.h << 'EOF'
          #pragma once
          void web_ui_start(void);
          EOF

          cat > examples/factory_demo/main/web_ui.c << 'EOF'
          #include "web_ui.h"
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root_get(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;font-family:sans-serif;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<button onclick=\"fetch('/toggle')\">Toggle</button><br><br>"
              "<button onclick=\"fetch('/mqtt')\">MQTT</button>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t toggle_get(httpd_req_t *req)
          {
              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t mqtt_get(httpd_req_t *req)
          {
              httpd_resp_send(req, "MQTT READY", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {
                      .uri="/",
                      .method=HTTP_GET,
                      .handler=root_get
                  };

                  httpd_uri_t toggle = {
                      .uri="/toggle",
                      .method=HTTP_GET,
                      .handler=toggle_get
                  };

                  httpd_uri_t mqtt = {
                      .uri="/mqtt",
                      .method=HTTP_GET,
                      .handler=mqtt_get
                  };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &toggle);
                  httpd_register_uri_handler(server, &mqtt);

                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# ==================================================
# AP FALLBACK
# ==================================================
      - name: Inject AP fallback
        run: |
          cat > examples/factory_demo/main/ap_hook.h << 'EOF'
          #pragma once
          void ap_fallback_start(void);
          EOF

          cat > examples/factory_demo/main/ap_hook.c << 'EOF'
          #include "ap_hook.h"
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_mode_t mode;
              esp_wifi_get_mode(&mode);

              if (mode == WIFI_MODE_NULL || mode == WIFI_MODE_STA) {

                  wifi_config_t ap_config = {
                      .ap = {
                          .ssid = "ESP32-BOX-SETUP",
                          .password = "12345678",
                          .channel = 6,
                          .max_connection = 4,
                          .authmode = WIFI_AUTH_WPA_WPA2_PSK
                      }
                  };

                  esp_wifi_set_mode(WIFI_MODE_APSTA);
                  esp_wifi_set_config(WIFI_IF_AP, &ap_config);
                  esp_wifi_start();

                  ESP_LOGI(TAG, "Fallback AP started");
              }
          }
          EOF

# ==================================================
# MQTT BRIDGE
# ==================================================
      - name: Inject MQTT
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          EOF

          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include "esp_system.h"
          #include <string.h>

          static const char *TAG = "MQTT";
          static esp_mqtt_client_handle_t client;

          static void mqtt_event(void *args,
                                 esp_event_base_t base,
                                 int32_t event_id,
                                 void *event_data)
          {
              if (event_id == MQTT_EVENT_CONNECTED) {

                  esp_mqtt_client_publish(
                      client,
                      "espbox/status",
                      "online",
                      0,1,1
                  );

                  esp_mqtt_client_subscribe(
                      client,
                      "espbox/cmd/#",
                      1
                  );

                  ESP_LOGI(TAG, "Connected");
              }
          }

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              client = esp_mqtt_client_init(&cfg);

              esp_mqtt_client_register_event(
                  client,
                  ESP_EVENT_ANY_ID,
                  mqtt_event,
                  NULL
              );

              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started");
          }
          EOF

# ==================================================
# PATCH main.c
# ==================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q 'web_ui.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_ui.h"' $FILE

          grep -q 'ap_hook.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "ap_hook.h"' $FILE

          grep -q 'mqtt_bridge.h' $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "mqtt_bridge.h"' $FILE

          grep -q 'web_ui_start();' $FILE || \
          sed -i '/app_rmaker_start()/a web_ui_start();' $FILE

          grep -q 'ap_fallback_start();' $FILE || \
          sed -i '/web_ui_start();/a ap_fallback_start();' $FILE

          grep -q 'mqtt_bridge_start();' $FILE || \
          sed -i '/ap_fallback_start();/a mqtt_bridge_start();' $FILE

# ==================================================
# BUILD
# ==================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

# ==================================================
# MERGE BIN
# ==================================================
      - name: Merge BIN
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_full_fixed.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

# ==================================================
# ARTIFACT
# ==================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-full-fixed
          path: examples/factory_demo/build/factory_full_fixed.bin
