name: ESP32-S3-BOX PRODUCTION SR STABLE BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:

# =====================================================
# CHECKOUT
# =====================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory
        run: git config --global --add safe.directory '*'

# =====================================================
# CLEAN BUILD
# =====================================================
      - name: Clean
        run: rm -rf examples/factory_demo/build || true

# =====================================================
# CREATE PROPER COMPONENT STRUCTURE
# =====================================================
      - name: Create components
        run: |
          mkdir -p components/extensions/include

# =====================================================
# HEADER (CRITICAL FIX)
# =====================================================
      - name: Extensions header
        run: |
          cat > components/extensions/include/extensions.h << 'EOF'
          #pragma once

          void web_ui_start(void);
          void ap_fallback_start(void);
          void mqtt_bridge_start(void);
          void esp_sr_start(void);
          EOF

# =====================================================
# WEBUI COMPONENT
# =====================================================
      - name: WebUI
        run: |
          cat > components/extensions/webui.c << 'EOF'
          #include "esp_http_server.h"
          #include "esp_log.h"

          static const char *TAG = "WEBUI";

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] = "<html><body><h1>ESP32-S3-BOX PRO</h1></body></html>";
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_ui_start(void)
          {
              httpd_handle_t server = NULL;
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();

              if (httpd_start(&server, &config) == ESP_OK) {
                  httpd_uri_t uri = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root
                  };

                  httpd_register_uri_handler(server, &uri);
                  ESP_LOGI(TAG, "WebUI started");
              }
          }
          EOF

# =====================================================
# AP FALLBACK
# =====================================================
      - name: AP fallback
        run: |
          cat > components/extensions/ap.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"

          static const char *TAG = "AP";

          void ap_fallback_start(void)
          {
              wifi_config_t ap = {
                  .ap = {
                      .ssid = "ESP32-BOX-SETUP",
                      .password = "12345678",
                      .channel = 6,
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  }
              };

              esp_wifi_set_mode(WIFI_MODE_AP);
              esp_wifi_set_config(WIFI_IF_AP, &ap);
              esp_wifi_start();

              ESP_LOGI(TAG, "AP fallback started");
          }
          EOF

# =====================================================
# MQTT SAFE BRIDGE
# =====================================================
      - name: MQTT bridge
        run: |
          cat > components/extensions/mqtt.c << 'EOF'
          #include "mqtt_client.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";

          void mqtt_bridge_start(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = "mqtt://broker.hivemq.com"
              };

              esp_mqtt_client_handle_t client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_start(client);

              ESP_LOGI(TAG, "MQTT started safely");
          }
          EOF

# =====================================================
# COMPONENT CMake (FIX LINKING)
# =====================================================
      - name: CMake component
        run: |
          cat > components/extensions/CMakeLists.txt << 'EOF'
          idf_component_register(
              SRCS "webui.c" "ap.c" "mqtt.c"
              INCLUDE_DIRS "include"
          )
          EOF

# =====================================================
# PATCH MAIN.C (CRITICAL BOOT FIX)
# =====================================================
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/extensions.h/d' $FILE || true

          grep -q "extensions.h" $FILE || \
          sed -i '/#include/a #include "extensions/extensions.h"' $FILE

          grep -q "BOOT_SEQUENCE" $FILE || \
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(8000));\
          web_ui_start();\
          vTaskDelay(pdMS_TO_TICKS(2000));\
          ap_fallback_start();\
          vTaskDelay(pdMS_TO_TICKS(2000));\
          mqtt_bridge_start();' $FILE

# =====================================================
# BUILD SYSTEM
# =====================================================
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py reconfigure
          idf.py build

# =====================================================
# OUTPUT BIN ONLY
# =====================================================
      - name: Collect firmware
        run: |
          mkdir -p output
          cp examples/factory_demo/build/*.bin output/ || true

# =====================================================
# ARTIFACT
# =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-production-sr-stable
          path: output/
