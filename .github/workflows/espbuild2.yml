name: ESP32-S3-BOX PRODUCTION BUILD (RainMaker + WebUI + AP + MQTT + SYSTEM)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
    # ---------------------------
    # CHECKOUT
    # ---------------------------
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - run: git config --global --add safe.directory '*'

    # ---------------------------
    # CLEAN
    # ---------------------------
    - run: |
        rm -rf examples/factory_demo/build || true
        rm -rf build || true

    - run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

    # ---------------------------
    # FIX COMPONENTS
    # ---------------------------
    - run: |
        find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
        find . -name "idf_component.yml" -exec sed -i '/ili9341/d' {} \; || true

    # ---------------------------
    # SYSTEM STATE (FIXED)
    # ---------------------------
    - name: Add system_state
      run: |
        cat > examples/factory_demo/main/system_state.c << 'EOF'
        #include <stdbool.h>
        #include "esp_log.h"
        #include "system_state.h"

        static bool started = false;

        bool system_is_started(void)
        {
            return started;
        }

        void system_start_services(void)
        {
            started = true;
            ESP_LOGI("SYSTEM", "System services started");
        }
        EOF

        cat > examples/factory_demo/main/system_state.h << 'EOF'
        #pragma once
        #include <stdbool.h>

        bool system_is_started(void);
        void system_start_services(void);
        EOF

    # ---------------------------
    # AP FALLBACK
    # ---------------------------
    - name: Add AP fallback
      run: |
        cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
        #include "esp_wifi.h"
        #include "esp_log.h"
        #include "esp_event.h"
        #include <stdbool.h>

        static const char *TAG = "AP_FALLBACK";
        static uint8_t fail = 0;

        static void handler(void *arg, esp_event_base_t base, int32_t id, void *data)
        {
            if (base == WIFI_EVENT && id == WIFI_EVENT_STA_DISCONNECTED) {
                fail++;
                if (fail >= 5) {
                    wifi_config_t cfg = {
                        .ap = {
                            .ssid = "ESP32-BOX-SETUP",
                            .password = "12345678",
                            .authmode = WIFI_AUTH_WPA_WPA2_PSK
                        }
                    };
                    esp_wifi_set_mode(WIFI_MODE_APSTA);
                    esp_wifi_set_config(WIFI_IF_AP, &cfg);
                    esp_wifi_start();
                    ESP_LOGI(TAG, "AP fallback started");
                }
            }
        }

        void ap_fallback_init(void)
        {
            esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, handler, NULL);
        }
        EOF

        cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
        #pragma once
        void ap_fallback_init(void);
        EOF

    # ---------------------------
    # WEB SERVER
    # ---------------------------
    - name: Add Web Server
      run: |
        cat > examples/factory_demo/main/web_server.c << 'EOF'
        #include "esp_http_server.h"
        #include "app_led.h"

        static httpd_handle_t server = NULL;

        static esp_err_t root(httpd_req_t *req)
        {
            const char *html = "<h1>ESP32 BOX OK</h1>";
            httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        void web_server_start(void)
        {
            httpd_config_t config = HTTPD_DEFAULT_CONFIG();

            if (httpd_start(&server, &config) == ESP_OK) {
                httpd_uri_t uri = {
                    .uri = "/",
                    .method = HTTP_GET,
                    .handler = root
                };
                httpd_register_uri_handler(server, &uri);
            }
        }
        EOF

        cat > examples/factory_demo/main/web_server.h << 'EOF'
        #pragma once
        void web_server_start(void);
        EOF

    # ---------------------------
    # MQTT
    # ---------------------------
    - name: Add MQTT
      run: |
        cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
        #include "mqtt_client.h"
        #include "esp_log.h"

        static void task(void *p)
        {
            vTaskDelay(pdMS_TO_TICKS(8000));

            esp_mqtt_client_config_t cfg = {
                .broker.address.uri = "mqtt://broker.hivemq.com"
            };

            esp_mqtt_client_handle_t c = esp_mqtt_client_init(&cfg);
            esp_mqtt_client_start(c);

            ESP_LOGI("MQTT", "Started");
            vTaskDelete(NULL);
        }

        void mqtt_bridge_start(void)
        {
            xTaskCreate(task, "mqtt", 4096, NULL, 5, NULL);
        }
        EOF

        cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
        #pragma once
        void mqtt_bridge_start(void);
        EOF

    # ---------------------------
    # PATCH CMAKE
    # ---------------------------
    - name: Patch CMakeLists
      run: |
        sed -i 's/main.c/main.c system_state.c ap_fallback.c web_server.c mqtt_bridge.c/' \
        examples/factory_demo/main/CMakeLists.txt

    # ---------------------------
    # PATCH MAIN
    # ---------------------------
    - name: Patch main
      run: |
        FILE=examples/factory_demo/main/main.c

        sed -i '/#include "app_main.h"/a \
        #include "system_state.h"\n#include "web_server.h"\n#include "mqtt_bridge.h"\n#include "ap_fallback.h"' $FILE

        sed -i '/app_rmaker_start()/a \
        ap_fallback_init();\
        system_start_services();\
        vTaskDelay(pdMS_TO_TICKS(4000));\
        web_server_start();\
        mqtt_bridge_start();' $FILE

    # ---------------------------
    # BUILD
    # ---------------------------
    - name: Build
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo
        idf.py set-target esp32s3
        cp sdkconfig.ci.box sdkconfig
        idf.py fullclean
        idf.py build

    # ---------------------------
    # MERGE BIN
    # ---------------------------
    - name: Merge
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo/build
        python $IDF_PATH/components/esptool_py/esptool/esptool.py \
        --chip esp32s3 merge_bin \
        -o factory_merged.bin \
        --flash_mode dio \
        --flash_size 16MB \
        $(cat flash_args)

    # ---------------------------
    # UPLOAD
    # ---------------------------
    - uses: actions/upload-artifact@v4
      with:
        name: esp32s3-box-final
        path: examples/factory_demo/build/factory_merged.bin
