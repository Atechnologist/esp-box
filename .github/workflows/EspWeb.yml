name: ESP32-S3-BOX FINAL (Event Driven Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive

      - name: Fix Git
        run: git config --global --add safe.directory '*'

      - name: Enable component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ----------------------------
      # Fix dependencies
      # ----------------------------
      - name: Patch dependencies
        run: |
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \; || true

      # ----------------------------
      # Fix WiFi retry loop
      # ----------------------------
      - name: Fix WiFi reconnect loop
        run: |
          FILE=examples/factory_demo/main/app/app_wifi.c

          grep -q MAX_RETRY $FILE || sed -i '1i #define MAX_RETRY 5\nstatic int retry_count = 0;' $FILE

          sed -i 's/esp_wifi_connect();/\
          if (retry_count < MAX_RETRY) {\
              retry_count++;\
              esp_wifi_connect();\
          } else {\
              ESP_LOGI("WIFI", "Max retries reached → AP mode");\
          }/' $FILE

      # ----------------------------
      # Add Web Server (EVENT DRIVEN)
      # ----------------------------
      - name: Add Web UI
        run: |
          cd examples/factory_demo/main

          cat > web_server.h << 'EOF'
          #pragma once
          void web_task_start(void);
          EOF

          cat > web_server.c << 'EOF'
          #include "web_server.h"

          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "esp_event.h"
          #include "esp_wifi.h"

          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include "freertos/event_groups.h"

          #include "esp_rmaker_core.h"
          #include "esp_rmaker_standard_params.h"
          #include "app_led.h"

          static const char *TAG = "WEB";

          static EventGroupHandle_t wifi_event_group;
          #define WIFI_READY_BIT BIT0

          static esp_rmaker_device_t *light_device = NULL;

          // -----------------------------
          // WiFi Event Handler
          // -----------------------------
          static void wifi_event_handler(void* arg, esp_event_base_t event_base,
                                         int32_t event_id, void* event_data)
          {
              if (event_base == IP_EVENT && event_id == IP_EVENT_STA_GOT_IP) {
                  ESP_LOGI(TAG, "STA Got IP");
                  xEventGroupSetBits(wifi_event_group, WIFI_READY_BIT);
              }

              if (event_base == WIFI_EVENT && event_id == WIFI_EVENT_AP_START) {
                  ESP_LOGI(TAG, "AP Started");
                  xEventGroupSetBits(wifi_event_group, WIFI_READY_BIT);
              }
          }

          // -----------------------------
          // RainMaker helpers
          // -----------------------------
          static esp_rmaker_param_t* get_power_param()
          {
              if (!light_device) {
                  const esp_rmaker_node_t *node = esp_rmaker_get_node();
                  if (!node) return NULL;

                  light_device = esp_rmaker_node_get_device_by_name(
                      (esp_rmaker_node_t *)node,
                      "Light"
                  );
              }

              return esp_rmaker_device_get_param_by_name(
                  light_device,
                  ESP_RMAKER_DEF_POWER_NAME
              );
          }

          static bool get_light_state()
          {
              esp_rmaker_param_t *param = get_power_param();
              if (!param) return false;

              const esp_rmaker_param_val_t *val =
                  esp_rmaker_param_get_val(param);

              return val ? val->val.b : false;
          }

          // -----------------------------
          // HTTP
          // -----------------------------
          static esp_err_t status_handler(httpd_req_t *req)
          {
              char resp[64];
              snprintf(resp, sizeof(resp),
                       "{\"power\":%s}",
                       get_light_state() ? "true" : "false");

              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, resp, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t toggle_handler(httpd_req_t *req)
          {
              esp_rmaker_param_t *param = get_power_param();

              if (param) {
                  bool new_state = !get_light_state();

                  app_pwm_led_set_power(new_state);

                  esp_rmaker_param_update_and_report(
                      param,
                      esp_rmaker_bool(new_state)
                  );
              }

              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='font-family:sans-serif;text-align:center;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<h2 id='state'>Loading...</h2>"
              "<button onclick='toggle()'>Toggle</button>"
              "<script>"
              "async function update(){"
              " try { let r=await fetch('/status'); let j=await r.json();"
              " document.getElementById('state').innerText = j.power ? 'ON':'OFF';"
              " } catch(e){} }"
              "async function toggle(){ await fetch('/toggle'); }"
              "setInterval(update,500); update();"
              "</script></body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = { .uri="/", .method=HTTP_GET, .handler=root_handler };
                  httpd_uri_t toggle = { .uri="/toggle", .method=HTTP_GET, .handler=toggle_handler };
                  httpd_uri_t status = { .uri="/status", .method=HTTP_GET, .handler=status_handler };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &toggle);
                  httpd_register_uri_handler(server, &status);

                  ESP_LOGI(TAG, "Web UI started");
              }
          }

          // -----------------------------
          // Task
          // -----------------------------
          static void web_task(void *arg)
          {
              wifi_event_group = xEventGroupCreate();

              esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, &wifi_event_handler, NULL);
              esp_event_handler_register(IP_EVENT, IP_EVENT_STA_GOT_IP, &wifi_event_handler, NULL);

              ESP_LOGI(TAG, "Waiting for network...");

              xEventGroupWaitBits(wifi_event_group,
                                  WIFI_READY_BIT,
                                  pdFALSE,
                                  pdFALSE,
                                  portMAX_DELAY);

              ESP_LOGI(TAG, "Network ready → start Web UI");

              web_server_start();

              vTaskDelay(pdMS_TO_TICKS(5000));

              extern void app_sr_init(void);
              app_sr_init();

              vTaskDelete(NULL);
          }

          void web_task_start(void)
          {
              xTaskCreate(web_task, "web_task", 4096, NULL, 5, NULL);
          }
          EOF

      # ----------------------------
      # Hook into main
      # ----------------------------
      - name: Hook Web Task
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_server.h $FILE || sed -i '/#include "app_rmaker.h"/a #include "web_server.h"' $FILE
          sed -i '/app_wifi_start()/a web_task_start();' $FILE

      # ----------------------------
      # Patch CMake
      # ----------------------------
      - name: Patch CMake
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          grep -q web_server.c $FILE || sed -i 's/"main.c"/"main.c" "web_server.c"/' $FILE
          grep -q esp_http_server $FILE || sed -i 's/REQUIRES /REQUIRES esp_http_server /' $FILE

      # ----------------------------
      # Build
      # ----------------------------
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

      # ----------------------------
      # Merge
      # ----------------------------
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ----------------------------
      # Upload
      # ----------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-final
          path: examples/factory_demo/build/factory_merged.bin
