name: ESP32-S3-BOX Dual Mode Stable (STA + AP + WebUI + RainMaker)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - name: Fix Git safe directory
      run: git config --global --add safe.directory '*'

    # ----------------------------
    # WEB UI MODULE (STABLE CORE)
    # ----------------------------
    - name: Inject Web UI (Dual Mode Safe)
      run: |
        cd examples/factory_demo/main

        cat > web_server.h << 'EOF'
        #pragma once
        void web_server_start(void);
        void web_server_start_ap_mode(void);
        EOF

        cat > web_server.c << 'EOF'
        #include "web_server.h"
        #include "esp_http_server.h"
        #include "esp_log.h"
        #include "esp_wifi.h"
        #include "app_led.h"

        static const char *TAG = "WEB";

        static bool g_power = false;

        // -----------------------
        // STATUS
        // -----------------------
        static esp_err_t status_handler(httpd_req_t *req)
        {
            char resp[64];
            snprintf(resp, sizeof(resp),
                "{\"power\":%s}", g_power ? "true" : "false");

            httpd_resp_set_type(req, "application/json");
            httpd_resp_send(req, resp, HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        // -----------------------
        // TOGGLE (HARDWARE SAFE)
        // -----------------------
        static esp_err_t toggle_handler(httpd_req_t *req)
        {
            g_power = !g_power;

            // DIRECT GPIO CONTROL (your ESP-BOX light pins)
            app_pwm_led_set_power(g_power);

            ESP_LOGI(TAG, "Web toggle -> %d", g_power);

            httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        // -----------------------
        // UI PAGE
        // -----------------------
        static esp_err_t root_handler(httpd_req_t *req)
        {
            const char html[] =
            "<html><body style='font-family:sans-serif;text-align:center;'>"
            "<h1>ESP32-S3-BOX Dual Mode</h1>"
            "<h2 id='state'>Loading...</h2>"
            "<button onclick='toggle()'>Toggle Light</button>"
            "<script>"
            "async function update(){"
            " let r=await fetch('/status');"
            " let j=await r.json();"
            " document.getElementById('state').innerText = j.power ? 'ON':'OFF';"
            "}"
            "async function toggle(){ await fetch('/toggle'); update(); }"
            "setInterval(update,500); update();"
            "</script></body></html>";

            httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
            return ESP_OK;
        }

        // -----------------------
        // STA MODE WEB SERVER
        // -----------------------
        void web_server_start(void)
        {
            httpd_config_t config = HTTPD_DEFAULT_CONFIG();
            httpd_handle_t server = NULL;

            if (httpd_start(&server, &config) == ESP_OK) {

                httpd_uri_t root = {.uri="/", .method=HTTP_GET, .handler=root_handler};
                httpd_uri_t status = {.uri="/status", .method=HTTP_GET, .handler=status_handler};
                httpd_uri_t toggle = {.uri="/toggle", .method=HTTP_GET, .handler=toggle_handler};

                httpd_register_uri_handler(server, &root);
                httpd_register_uri_handler(server, &status);
                httpd_register_uri_handler(server, &toggle);

                ESP_LOGI(TAG, "WebUI STA mode started");
            }
        }

        // -----------------------
        // AP MODE (OFFLINE SAFE)
        // -----------------------
        void web_server_start_ap_mode(void)
        {
            httpd_config_t config = HTTPD_DEFAULT_CONFIG();
            httpd_handle_t server = NULL;

            if (httpd_start(&server, &config) == ESP_OK) {

                httpd_uri_t root = {.uri="/", .method=HTTP_GET, .handler=root_handler};
                httpd_uri_t status = {.uri="/status", .method=HTTP_GET, .handler=status_handler};
                httpd_uri_t toggle = {.uri="/toggle", .method=HTTP_GET, .handler=toggle_handler};

                httpd_register_uri_handler(server, &root);
                httpd_register_uri_handler(server, &status);
                httpd_register_uri_handler(server, &toggle);

                ESP_LOGW(TAG, "WebUI AP MODE (offline fallback) started");
            }
        }
        EOF

    # ----------------------------
    # MAIN BOOT FIX (STATE MACHINE)
    # ----------------------------
    - name: Patch main boot logic (STA + AP fallback)
      run: |
        FILE=examples/factory_demo/main/main.c

        grep -q web_server.h $FILE || sed -i '/#include "app_rmaker.h"/a #include "web_server.h"' $FILE

        cat >> $FILE << 'EOF'

// -------------------------
// SIMPLE NETWORK STATE LOGIC
// -------------------------
static void start_dual_mode_system(void)
{
    int retry = 0;

    while (retry < 10) {
        if (esp_wifi_connect() == ESP_OK) {
            web_server_start();   // STA mode web UI
            return;
        }
        vTaskDelay(pdMS_TO_TICKS(2000));
        retry++;
    }

    // fallback AP mode
    web_server_start_ap_mode();
}

EOF

        sed -i '/app_rmaker_start()/a \
        start_dual_mode_system();' $FILE

    # ----------------------------
    # BUILD
    # ----------------------------
    - name: Build firmware
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo
        idf.py set-target esp32s3
        cp sdkconfig.ci.box sdkconfig
        idf.py reconfigure
        idf.py build

    # ----------------------------
    # MERGE BIN
    # ----------------------------
    - name: Merge firmware
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo/build

        python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_dual_mode.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

    # ----------------------------
    # UPLOAD
    # ----------------------------
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-box-dual-mode
        path: examples/factory_demo/build/factory_dual_mode.bin
