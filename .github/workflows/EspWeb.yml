name: ESP32-S3-BOX Final Production

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Fix Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ----------------------------
      # PATCH DEPENDENCIES (stable)
      # ----------------------------
      - name: Patch dependencies
        run: |
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \; || true

      # ----------------------------
      # WEB SERVER (SAFE)
      # ----------------------------
      - name: Add Web UI
        run: |
          cd examples/factory_demo/main

          cat > web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

          cat > web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "app_led.h"   // ✅ CORRECT HEADER

          static const char *TAG = "WEB";

          static bool led_state = false;

          static esp_err_t status_handler(httpd_req_t *req)
          {
              char resp[64];
              snprintf(resp, sizeof(resp),
                       "{\"power\":%s}",
                       led_state ? "true" : "false");

              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, resp, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t toggle_handler(httpd_req_t *req)
          {
              led_state = !led_state;

              // ✅ SAFE FUNCTION (exists in factory_demo)
              app_led_set_power(led_state);

              ESP_LOGI(TAG, "LED: %d", led_state);

              httpd_resp_send(req, "OK", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body style='text-align:center;font-family:sans-serif;'>"
              "<h1>ESP32-S3-BOX</h1>"
              "<h2 id='state'>Loading...</h2>"
              "<button onclick='toggle()' style='font-size:20px;'>Toggle</button>"
              "<script>"
              "async function update(){"
              " let r=await fetch('/status');"
              " let j=await r.json();"
              " document.getElementById('state').innerText=j.power?'ON':'OFF';"
              "}"
              "async function toggle(){await fetch('/toggle');}"
              "setInterval(update,500);update();"
              "</script>"
              "</body></html>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_handle_t server = NULL;

              if (httpd_start(&server, &config) == ESP_OK) {

                  httpd_uri_t root = {
                      .uri = "/",
                      .method = HTTP_GET,
                      .handler = root_handler
                  };

                  httpd_uri_t toggle = {
                      .uri = "/toggle",
                      .method = HTTP_GET,
                      .handler = toggle_handler
                  };

                  httpd_uri_t status = {
                      .uri = "/status",
                      .method = HTTP_GET,
                      .handler = status_handler
                  };

                  httpd_register_uri_handler(server, &root);
                  httpd_register_uri_handler(server, &toggle);
                  httpd_register_uri_handler(server, &status);

                  ESP_LOGI(TAG, "Web UI started");
              }
          }
          EOF

      # ----------------------------
      # AP FALLBACK (MINIMAL SAFE)
      # ----------------------------
      - name: Add AP fallback
        run: |
          cd examples/factory_demo/main

          cat > ap_fallback.c << 'EOF'
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include "esp_event.h"
          #include "nvs_flash.h"

          static const char *TAG = "AP";

          void start_ap_fallback(void)
          {
              wifi_init_config_t cfg = WIFI_INIT_CONFIG_DEFAULT();
              esp_wifi_init(&cfg);

              esp_wifi_set_mode(WIFI_MODE_AP);

              wifi_config_t ap_config = {
                  .ap = {
                      .ssid = "ESP32-BOX",
                      .ssid_len = 0,
                      .channel = 1,
                      .password = "12345678",
                      .max_connection = 4,
                      .authmode = WIFI_AUTH_WPA_WPA2_PSK
                  },
              };

              esp_wifi_set_config(WIFI_IF_AP, &ap_config);
              esp_wifi_start();

              ESP_LOGI(TAG, "AP started: ESP32-BOX");
          }
          EOF

      # ----------------------------
      # PATCH MAIN
      # ----------------------------
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          grep -q web_server.h $FILE || \
          sed -i '/#include "app_rmaker.h"/a #include "web_server.h"' $FILE

          grep -q start_ap_fallback $FILE || \
          sed -i '/#include "web_server.h"/a void start_ap_fallback(void);' $FILE

          sed -i '/web_server_start/d' $FILE

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(4000));\
          web_server_start();\
          start_ap_fallback();' $FILE

      # ----------------------------
      # PATCH CMAKE
      # ----------------------------
      - name: Patch CMake
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          grep -q web_server.c $FILE || \
          sed -i 's/"main.c"/"main.c" "web_server.c" "ap_fallback.c"/' $FILE

          grep -q esp_http_server $FILE || \
          sed -i 's/REQUIRES /REQUIRES esp_http_server /' $FILE

      # ----------------------------
      # BUILD
      # ----------------------------
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py reconfigure
          idf.py build

      # ----------------------------
      # MERGE
      # ----------------------------
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ----------------------------
      # UPLOAD
      # ----------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-production
          path: examples/factory_demo/build/factory_merged.bin
