name: ESP32-S3-BOX AI VOICE ROUTER STABLE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean previous build
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =========================================================
      # RESTORE ORIGINAL FILES
      # =========================================================
      - name: Restore original files
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml || true
          git checkout main/CMakeLists.txt || true
          git checkout main/main.c || true
          git checkout main/app/app_sr_handler.c || true

      # =========================================================
      # ENABLE COMPONENT MANAGER
      # =========================================================
      - name: Enable component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =========================================================
      # AI VOICE ROUTER
      # =========================================================
      - name: Add AI voice router
        run: |
          cat > examples/factory_demo/main/ai_voice_router.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void ai_voice_process(const char *text);
          void ai_voice_init(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/ai_voice_router.c << 'EOF'
          #include "ai_voice_router.h"
          #include "command_router.h"
          #include "esp_log.h"
          #include <stdio.h>
          #include <string.h>
          #include <ctype.h>
          
          static const char *TAG = "AI_VOICE";
          
          static int contains(const char *text, const char *word)
          {
              if (!text || !word) return 0;
              return strstr(text, word) != NULL;
          }
          
          /* Check for whole-word match to avoid "on" matching inside "control",
             "done", "stone", etc.  Also catches "on." "on!" etc. */
          static int contains_word(const char *text, const char *word)
          {
              if (!text || !word) return 0;
              const char *p = text;
              size_t wlen = strlen(word);
              while ((p = strstr(p, word)) != NULL) {
                  /* char before must be start-of-string or non-alpha */
                  int pre_ok  = (p == text) || !isalpha((unsigned char)*(p - 1));
                  /* char after must be end-of-string or non-alpha */
                  int post_ok = !isalpha((unsigned char)*(p + wlen));
                  if (pre_ok && post_ok) return 1;
                  p += wlen;
              }
              return 0;
          }
          
          void ai_voice_process(const char *text)
          {
              if (!text || strlen(text) == 0) return;
          
              ESP_LOGI(TAG, "Voice: %s", text);
          
              if (contains(text, "light") || contains(text, "led")) {
                  /* IMPORTANT: check "off" BEFORE "on" so that the word
                     "off" is never accidentally caught by the "on" branch. */
                  if (contains_word(text, "off")) {
                      ESP_LOGI(TAG, "Command: LED OFF");
                      command_router_execute("LED_OFF");
                  } else if (contains_word(text, "on")) {
                      ESP_LOGI(TAG, "Command: LED ON");
                      command_router_execute("LED_ON");
                  }
              }
          }
          
          void ai_voice_init(void)
          {
              ESP_LOGI(TAG, "AI Voice Router initialized");
          }
          EOF
          
          cat > examples/factory_demo/main/ai_voice_router.c << 'EOF'
          #include "ai_voice_router.h"
          #include "command_router.h"
          #include "esp_log.h"
          #include <stdio.h>
          #include <string.h>
          
          static const char *TAG = "AI_VOICE";
          
          static int contains(const char *text, const char *word)
          {
              if (!text || !word) {
                  return 0;
              }
              
              return strstr(text, word) != NULL;
          }
          
          void ai_voice_process(const char *text)
          {
              if (!text || strlen(text) == 0) {
                  return;
              }
              
              ESP_LOGI(TAG, "Voice: %s", text);
              
              if (contains(text, "light") || contains(text, "led")) {
                  if (contains(text, "on")) {
                      ESP_LOGI(TAG, "Command: LED ON");
                      command_router_execute("LED_ON");
                  }
                  else if (contains(text, "off")) {
                      ESP_LOGI(TAG, "Command: LED OFF");
                      command_router_execute("LED_OFF");
                  }
              }
          }
          
          void ai_voice_init(void)
          {
              ESP_LOGI(TAG, "AI Voice Router initialized");
          }
          EOF

      # =========================================================
      # COMMAND ROUTER
      # =========================================================
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void command_router_execute(const char *cmd);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include <stdbool.h>
          #include <string.h>
          
          static const char *TAG = "CMD_ROUTER";
          
          void command_router_execute(const char *cmd)
          {
              if (!cmd || strlen(cmd) == 0) {
                  return;
              }
              
              ESP_LOGI(TAG, "Cmd: %s", cmd);
              
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
                  ESP_LOGI(TAG, "LED ON");
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
                  ESP_LOGI(TAG, "LED OFF");
              }
          }
          EOF

      # =========================================================
      # WEB SERVER
      # =========================================================
      - name: Add web server
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void web_server_start(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "app_led.h"
          #include "esp_log.h"
          
          static const char *TAG = "WEB_SERVER";
          static httpd_handle_t server = NULL;
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
                  "<!DOCTYPE html>"
                  "<html><head><title>ESP32-S3-BOX</title>"
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                  "<style>"
                  "body{font-family:Arial;margin:20px;}"
                  ".btn{padding:10px 20px;margin:5px;cursor:pointer;border:none;border-radius:4px;}"
                  ".on{background:#4CAF50;color:white;}"
                  ".off{background:#f44336;color:white;}"
                  "</style></head>"
                  "<body>"
                  "<h1>ESP32-S3-BOX</h1>"
                  "<p>AI Voice + Web Control</p>"
                  "<button class='btn on' onclick=\"fetch('/on')\">LED ON</button>"
                  "<button class='btn off' onclick=\"fetch('/off')\">LED OFF</button>"
                  "</body></html>";
              
              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t on_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED ON via web");
              app_pwm_led_set_power(true);
              httpd_resp_send(req, "ON", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t off_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED OFF via web");
              app_pwm_led_set_power(false);
              httpd_resp_send(req, "OFF", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          void web_server_start(void)
          {
              if (server != NULL) {
                  return;
              }
              
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              config.stack_size = 8192;
              
              if (httpd_start(&server, &config) != ESP_OK) {
                  ESP_LOGE(TAG, "Failed to start");
                  return;
              }
              
              httpd_uri_t root = {.uri = "/", .method = HTTP_GET, .handler = root_handler};
              httpd_uri_t on = {.uri = "/on", .method = HTTP_GET, .handler = on_handler};
              httpd_uri_t off = {.uri = "/off", .method = HTTP_GET, .handler = off_handler};
              
              httpd_register_uri_handler(server, &root);
              httpd_register_uri_handler(server, &on);
              httpd_register_uri_handler(server, &off);
              
              ESP_LOGI(TAG, "Started on port 80");
          }
          EOF

      # =========================================================
      # VOICE HOOK WRAPPER
      # =========================================================
      - name: Add voice hook wrapper
        run: |
          cat > examples/factory_demo/main/voice_hook.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void voice_hook_init(void);
          void voice_hook_process(const char *phrase);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/voice_hook.c << 'EOF'
          #include "voice_hook.h"
          #include "ai_voice_router.h"
          #include "esp_log.h"
          
          static const char *TAG = "VOICE_HOOK";
          
          void voice_hook_init(void)
          {
              ESP_LOGI(TAG, "Voice hook initialized");
              ai_voice_init();
          }
          
          void voice_hook_process(const char *phrase)
          {
              if (!phrase) {
                  return;
              }
              
              ESP_LOGI(TAG, "Processing: %s", phrase);
              ai_voice_process(phrase);
          }
          EOF

      # =========================================================
      # PATCH CMakeLists.txt
      # =========================================================
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          
          if ! grep -q "ai_voice_router.c" $FILE; then
            sed -i '/SRCS.*main\.c/s/.*/& ai_voice_router.c command_router.c web_server.c voice_hook.c/' $FILE
          fi

      # =========================================================
      # PATCH main.c
      # =========================================================
      - name: Patch main.c includes
        run: |
          FILE=examples/factory_demo/main/main.c
          
          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)
          
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/voice_hook.h/d' $FILE || true
          
          sed -i "${LAST_INCLUDE}a\\
          #include \"web_server.h\"\n#include \"voice_hook.h\"" $FILE

      - name: Patch main.c calls
        run: |
          FILE=examples/factory_demo/main/main.c
          
          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/voice_hook_init()/d' $FILE || true
          
          sed -i '/app_rmaker_start()/a \
          voice_hook_init();\
          web_server_start();' $FILE

      # =========================================================
      # PATCH app_sr_handler.c (SAFE - callback style)
      # =========================================================
      - name: Patch app_sr_handler for voice routing
        run: |
          FILE=$(find examples/factory_demo -name "app_sr_handler.c" -type f | head -1)
          
          if [ -z "$FILE" ]; then
            echo "app_sr_handler.c not found, skipping"
            exit 0
          fi
          
          echo "Patching: $FILE"
          
          # Add include at top
          if ! grep -q "voice_hook.h" "$FILE"; then
            sed -i '1s/^/#include "voice_hook.h"\n/' "$FILE"
            echo "Added include"
          fi
          
          # Find the logging line with phrase and add voice processing after it
          if ! grep -q "voice_hook_process" "$FILE"; then
            # Look for any line logging the phrase result
            sed -i '/ESP_LOGI.*\(TAG.*phrase\|phrase.*\)/a \            voice_hook_process(result->phrase);' "$FILE"
            echo "Added voice hook call"
          else
            echo "Voice hook already present"
          fi

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-ai-voice-router
          path: examples/factory_demo/build/factory.bin
