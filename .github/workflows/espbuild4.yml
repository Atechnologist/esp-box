name: ESP32-S3-BOX AI VOICE + ESP-NOW NODE REGISTRY V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe dir
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =========================================================
      # RESTORE ORIGINAL MANIFEST
      # =========================================================
      - name: Restore manifest
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml || true

      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =========================================================
      # VOICE HOOK
      # =========================================================
      - name: Add voice hook
        run: |
          cat > examples/factory_demo/main/voice_hook.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void voice_hook_init(void);
          void voice_hook_process(const char *phrase);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/voice_hook.c << 'EOF'
          #include "voice_hook.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include "espnow_relay.h"
          #include "mqtt_client_app.h"
          #include <string.h>
          #include <stdbool.h>

          static const char *TAG = "VOICE_HOOK";

          static char last_device[32] = "light";
          static bool last_state = false;

          static bool contains(const char *a, const char *b)
          {
              if (!a || !b) return false;
              return strstr(a, b) != NULL;
          }

          void voice_hook_init(void)
          {
              ESP_LOGI(TAG, "Voice hook initialized");
          }

          void voice_hook_process(const char *phrase)
          {
              if (!phrase) return;

              ESP_LOGI(TAG, "VOICE CMD: %s", phrase);

              if (contains(phrase, "light") || contains(phrase, "led"))
              {
                  strcpy(last_device, "light");

                  if (contains(phrase, "on"))
                  {
                      app_pwm_led_set_power(true);
                      last_state = true;
                      espnow_relay_broadcast("LIGHT:ON");
                      mqtt_client_app_publish("/box/voice", "LIGHT:ON");
                      ESP_LOGI(TAG, "Light ON");
                  }
                  else if (contains(phrase, "off"))
                  {
                      app_pwm_led_set_power(false);
                      last_state = false;
                      espnow_relay_broadcast("LIGHT:OFF");
                      mqtt_client_app_publish("/box/voice", "LIGHT:OFF");
                      ESP_LOGI(TAG, "Light OFF");
                  }
              }
              else if (contains(phrase, "turn it on"))
              {
                  if (strcmp(last_device, "light") == 0)
                  {
                      app_pwm_led_set_power(true);
                      last_state = true;
                      espnow_relay_broadcast("LIGHT:ON");
                      mqtt_client_app_publish("/box/voice", "LIGHT:ON");
                  }
              }
              else if (contains(phrase, "turn it off"))
              {
                  if (strcmp(last_device, "light") == 0)
                  {
                      app_pwm_led_set_power(false);
                      last_state = false;
                      espnow_relay_broadcast("LIGHT:OFF");
                      mqtt_client_app_publish("/box/voice", "LIGHT:OFF");
                  }
              }
          }
          EOF

      # =========================================================
      # WEB SERVER (RICH DASHBOARD + OTA)
      # =========================================================
      - name: Add web server with dashboard
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          void web_server_log_voice(const char *msg);
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "app_led.h"
          #include "node_registry.h"
          #include "esp_log.h"
          #include "esp_ota_ops.h"
          #include "esp_app_desc.h"
          #include <stdio.h>
          #include <string.h>

          static const char *TAG = "WEB";
          static httpd_handle_t server = NULL;

          #define LOG_BUF_SIZE 1024
          static char voice_log[LOG_BUF_SIZE] = "No commands yet.\n";

          void web_server_log_voice(const char *msg)
          {
              size_t cur    = strlen(voice_log);
              size_t msglen = strlen(msg);
              if (cur + msglen + 2 > LOG_BUF_SIZE) {
                  memmove(voice_log, voice_log + msglen + 2, LOG_BUF_SIZE - msglen - 2);
                  cur = strlen(voice_log);
              }
              strncat(voice_log, msg, LOG_BUF_SIZE - cur - 2);
              strcat(voice_log, "\n");
          }

          static esp_err_t root_handler(httpd_req_t *req)
          {
              char buf[4096];
              char node_rows[1024] = "";
              int count = 0;
              const char **nodes = node_registry_get_all(&count);

              for (int i = 0; i < count; i++) {
                  char row[128];
                  snprintf(row, sizeof(row),
                      "<tr><td>%d</td><td>%s</td><td>Online</td></tr>", i + 1, nodes[i]);
                  strncat(node_rows, row, sizeof(node_rows) - strlen(node_rows) - 1);
              }

              const esp_app_desc_t *desc = esp_app_get_description();

              snprintf(buf, sizeof(buf),
                  "<!DOCTYPE html><html><head><meta charset='utf-8'>"
                  "<title>ESP32-BOX AI</title>"
                  "<style>"
                  "body{font-family:sans-serif;background:#1a1a2e;color:#eee;padding:20px}"
                  "h1{color:#e94560}table{width:100%%;border-collapse:collapse;margin-top:20px}"
                  "th,td{border:1px solid #444;padding:8px;text-align:left}"
                  "th{background:#16213e}.btn{padding:10px 20px;margin:5px;border:none;"
                  "border-radius:6px;cursor:pointer;font-size:16px}"
                  ".on{background:#27ae60;color:#fff}.off{background:#e74c3c;color:#fff}"
                  ".ota{background:#2980b9;color:#fff}"
                  "</style></head><body>"
                  "<h1>&#x1F4E6; ESP32-S3-BOX AI Dashboard</h1>"
                  "<p>Firmware: <b>%s</b> | Built: %s %s</p>"
                  "<button class='btn on'  onclick=\"fetch('/on')\">&#x1F4A1; Light ON</button>"
                  "<button class='btn off' onclick=\"fetch('/off')\">&#x1F4A1; Light OFF</button>"
                  "<button class='btn ota' onclick=\"location.href='/ota'\">&#x1F504; OTA Update</button>"
                  "<h2>Registered Nodes (%d)</h2>"
                  "<table><tr><th>#</th><th>Node ID / MAC</th><th>Status</th></tr>"
                  "%s"
                  "</table>"
                  "<h2>Voice Log</h2>"
                  "<div id='log' style='background:#0f3460;padding:10px;height:120px;overflow-y:auto'></div>"
                  "<script>"
                  "setInterval(()=>fetch('/log').then(r=>r.text()).then(t=>{"
                  "document.getElementById('log').innerText=t}),2000);"
                  "</script>"
                  "</body></html>",
                  desc->version, desc->date, desc->time, count, node_rows);

              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, buf, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t on_handler(httpd_req_t *req)
          {
              app_pwm_led_set_power(true);
              httpd_resp_send(req, "ON", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t off_handler(httpd_req_t *req)
          {
              app_pwm_led_set_power(false);
              httpd_resp_send(req, "OFF", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t log_handler(httpd_req_t *req)
          {
              httpd_resp_send(req, voice_log, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t ota_get_handler(httpd_req_t *req)
          {
              const char html[] =
                  "<!DOCTYPE html><html><body style='font-family:sans-serif;"
                  "background:#1a1a2e;color:#eee;padding:20px'>"
                  "<h1>OTA Firmware Update</h1>"
                  "<form method='POST' action='/ota/upload' enctype='multipart/form-data'>"
                  "<input type='file' name='firmware' accept='.bin'><br><br>"
                  "<input type='submit' value='Flash Firmware' style='padding:10px 20px;"
                  "background:#2980b9;color:#fff;border:none;border-radius:6px;cursor:pointer'>"
                  "</form></body></html>";
              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t ota_post_handler(httpd_req_t *req)
          {
              esp_ota_handle_t ota_handle;
              const esp_partition_t *update_partition = esp_ota_get_next_update_partition(NULL);

              if (!update_partition) {
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR, "No OTA partition");
                  return ESP_FAIL;
              }

              if (esp_ota_begin(update_partition, OTA_WITH_SEQUENTIAL_WRITES, &ota_handle) != ESP_OK) {
                  httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR, "OTA begin failed");
                  return ESP_FAIL;
              }

              char buf[1024];
              int remaining = req->content_len;

              while (remaining > 0) {
                  int to_read = (remaining < (int)sizeof(buf)) ? remaining : (int)sizeof(buf);
                  int ret = httpd_req_recv(req, buf, to_read);
                  if (ret <= 0) {
                      esp_ota_abort(ota_handle);
                      httpd_resp_send_err(req, HTTPD_500_INTERNAL_SERVER_ERROR, "Receive failed");
                      return ESP_FAIL;
                  }
                  esp_ota_write(ota_handle, buf, ret);
                  remaining -= ret;
              }

              esp_ota_end(ota_handle);
              esp_ota_set_boot_partition(update_partition);

              httpd_resp_send(req,
                  "<html><body><h2>Update OK! Rebooting...</h2></body></html>",
                  HTTPD_RESP_USE_STRLEN);

              vTaskDelay(pdMS_TO_TICKS(1000));
              esp_restart();
              return ESP_OK;
          }

          void web_server_start(void)
          {
              if (server) return;

              httpd_config_t config  = HTTPD_DEFAULT_CONFIG();
              config.stack_size      = 8192;
              config.max_uri_handlers = 10;

              if (httpd_start(&server, &config) != ESP_OK) {
                  ESP_LOGE(TAG, "Failed to start web server");
                  return;
              }

              httpd_uri_t uris[] = {
                  { .uri = "/",           .method = HTTP_GET,  .handler = root_handler     },
                  { .uri = "/on",         .method = HTTP_GET,  .handler = on_handler       },
                  { .uri = "/off",        .method = HTTP_GET,  .handler = off_handler      },
                  { .uri = "/log",        .method = HTTP_GET,  .handler = log_handler      },
                  { .uri = "/ota",        .method = HTTP_GET,  .handler = ota_get_handler  },
                  { .uri = "/ota/upload", .method = HTTP_POST, .handler = ota_post_handler },
              };

              for (int i = 0; i < (int)(sizeof(uris) / sizeof(uris[0])); i++) {
                  httpd_register_uri_handler(server, &uris[i]);
              }

              ESP_LOGI(TAG, "Web dashboard started");
          }
          EOF

      # =========================================================
      # ESP-NOW RELAY V2 (REAL PEER MESSAGING + MAC REGISTRY)
      # =========================================================
      - name: Add espnow relay v2
        run: |
          cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
          #pragma once
          #include <stdint.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          void espnow_relay_init(void);
          void espnow_relay_send(const uint8_t mac[6], const char *cmd);
          void espnow_relay_broadcast(const char *cmd);
          void espnow_relay_add_peer(const uint8_t mac[6]);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
          #include "espnow_relay.h"
          #include "node_registry.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "ESPNOW_RELAY";

          #define MAX_PEERS 10

          static uint8_t peer_macs[MAX_PEERS][6];
          static int     peer_count = 0;

          static const uint8_t BROADCAST_MAC[6] = {0xFF,0xFF,0xFF,0xFF,0xFF,0xFF};

          static void on_data_recv(const esp_now_recv_info_t *info,
                                   const uint8_t *data, int len)
          {
              char buf[128] = {0};
              int  n = (len < (int)sizeof(buf) - 1) ? len : (int)sizeof(buf) - 1;
              memcpy(buf, data, n);

              char mac_str[18];
              snprintf(mac_str, sizeof(mac_str), "%02X:%02X:%02X:%02X:%02X:%02X",
                       info->src_addr[0], info->src_addr[1], info->src_addr[2],
                       info->src_addr[3], info->src_addr[4], info->src_addr[5]);

              ESP_LOGI(TAG, "RX from %s: %s", mac_str, buf);

              node_registry_add(mac_str);
              espnow_relay_add_peer(info->src_addr);
          }

          static void on_data_sent(const uint8_t *mac, esp_now_send_status_t status)
          {
              ESP_LOGI(TAG, "TX %02X:%02X:%02X:%02X:%02X:%02X -> %s",
                       mac[0], mac[1], mac[2], mac[3], mac[4], mac[5],
                       status == ESP_NOW_SEND_SUCCESS ? "OK" : "FAIL");
          }

          void espnow_relay_init(void)
          {
              ESP_ERROR_CHECK(esp_now_init());
              ESP_ERROR_CHECK(esp_now_register_recv_cb(on_data_recv));
              ESP_ERROR_CHECK(esp_now_register_send_cb(on_data_sent));

              esp_now_peer_info_t bcast = {0};
              memcpy(bcast.peer_addr, BROADCAST_MAC, 6);
              bcast.channel = 0;
              bcast.encrypt = false;
              esp_now_add_peer(&bcast);

              ESP_LOGI(TAG, "ESP-NOW relay initialized");
          }

          void espnow_relay_add_peer(const uint8_t mac[6])
          {
              for (int i = 0; i < peer_count; i++)
                  if (memcmp(peer_macs[i], mac, 6) == 0) return;

              if (peer_count >= MAX_PEERS) {
                  ESP_LOGW(TAG, "Peer table full");
                  return;
              }

              memcpy(peer_macs[peer_count++], mac, 6);

              if (!esp_now_is_peer_exist(mac)) {
                  esp_now_peer_info_t p = {0};
                  memcpy(p.peer_addr, mac, 6);
                  p.channel = 0;
                  p.encrypt = false;
                  esp_now_add_peer(&p);
              }

              ESP_LOGI(TAG, "Peer added: %02X:%02X:%02X:%02X:%02X:%02X",
                       mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
          }

          void espnow_relay_send(const uint8_t mac[6], const char *cmd)
          {
              if (!cmd) return;
              esp_err_t e = esp_now_send(mac, (const uint8_t *)cmd, strlen(cmd) + 1);
              if (e != ESP_OK)
                  ESP_LOGE(TAG, "esp_now_send: %s", esp_err_to_name(e));
          }

          void espnow_relay_broadcast(const char *cmd)
          {
              espnow_relay_send(BROADCAST_MAC, cmd);
          }
          EOF

      # =========================================================
      # NODE REGISTRY V2
      # =========================================================
      - name: Add node registry v2
        run: |
          cat > examples/factory_demo/main/node_registry.h << 'EOF'
          #pragma once
          #include <stdint.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          void         node_registry_init(void);
          void         node_registry_add(const char *node);
          const char **node_registry_get_all(int *out_count);
          int          node_registry_count(void);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/node_registry.c << 'EOF'
          #include "node_registry.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "NODE_REGISTRY";

          #define MAX_NODES 20

          static char        nodes[MAX_NODES][32];
          static const char *node_ptrs[MAX_NODES];
          static int         node_count = 0;

          void node_registry_init(void)
          {
              node_count = 0;
              memset(nodes, 0, sizeof(nodes));
              ESP_LOGI(TAG, "Registry initialized");
          }

          void node_registry_add(const char *node)
          {
              if (!node) return;

              for (int i = 0; i < node_count; i++)
                  if (strncmp(nodes[i], node, sizeof(nodes[i])) == 0) return;

              if (node_count >= MAX_NODES) {
                  ESP_LOGW(TAG, "Node table full");
                  return;
              }

              strncpy(nodes[node_count], node, sizeof(nodes[node_count]) - 1);
              node_ptrs[node_count] = nodes[node_count];
              node_count++;

              ESP_LOGI(TAG, "Node added: %s (total: %d)", node, node_count);
          }

          const char **node_registry_get_all(int *out_count)
          {
              if (out_count) *out_count = node_count;
              return node_ptrs;
          }

          int node_registry_count(void)
          {
              return node_count;
          }
          EOF

      # =========================================================
      # MQTT CLIENT
      # =========================================================
      - name: Add MQTT client
        run: |
          cat > examples/factory_demo/main/mqtt_client_app.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void mqtt_client_app_init(void);
          void mqtt_client_app_publish(const char *topic, const char *data);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/mqtt_client_app.c << 'EOF'
          #include "mqtt_client_app.h"
          #include "mqtt_client.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "MQTT_APP";
          static esp_mqtt_client_handle_t mqtt_client = NULL;

          #define MQTT_BROKER_URI CONFIG_MQTT_BROKER_URI

          static void mqtt_event_handler(void *arg, esp_event_base_t base,
                                         int32_t event_id, void *event_data)
          {
              esp_mqtt_event_handle_t event = event_data;

              switch ((esp_mqtt_event_id_t)event_id) {
                  case MQTT_EVENT_CONNECTED:
                      ESP_LOGI(TAG, "Connected to broker");
                      esp_mqtt_client_subscribe(mqtt_client, "/box/cmd", 1);
                      break;

                  case MQTT_EVENT_DISCONNECTED:
                      ESP_LOGW(TAG, "Disconnected from broker");
                      break;

                  case MQTT_EVENT_DATA: {
                      char topic[64] = {0}, data[128] = {0};
                      int tl = (event->topic_len < 63) ? event->topic_len : 63;
                      int dl = (event->data_len  < 127) ? event->data_len  : 127;
                      memcpy(topic, event->topic, tl);
                      memcpy(data,  event->data,  dl);
                      ESP_LOGI(TAG, "MSG [%s]: %s", topic, data);
                      break;
                  }

                  case MQTT_EVENT_ERROR:
                      ESP_LOGE(TAG, "MQTT error");
                      break;

                  default:
                      break;
              }
          }

          void mqtt_client_app_init(void)
          {
              esp_mqtt_client_config_t cfg = {
                  .broker.address.uri = MQTT_BROKER_URI,
              };

              mqtt_client = esp_mqtt_client_init(&cfg);
              esp_mqtt_client_register_event(mqtt_client, ESP_EVENT_ANY_ID,
                                             mqtt_event_handler, NULL);
              esp_mqtt_client_start(mqtt_client);
              ESP_LOGI(TAG, "MQTT client started -> %s", MQTT_BROKER_URI);
          }

          void mqtt_client_app_publish(const char *topic, const char *data)
          {
              if (!mqtt_client || !topic || !data) return;
              esp_mqtt_client_publish(mqtt_client, topic, data, 0, 1, 0);
          }
          EOF

      # =========================================================
      # WIFI PROVISIONING (SmartConfig + NVS)
      # =========================================================
      - name: Add WiFi provisioning
        run: |
          cat > examples/factory_demo/main/wifi_prov_app.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void wifi_prov_app_start(void);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/wifi_prov_app.c << 'EOF'
          #include "wifi_prov_app.h"
          #include "esp_smartconfig.h"
          #include "esp_wifi.h"
          #include "esp_event.h"
          #include "esp_log.h"
          #include "nvs_flash.h"
          #include "nvs.h"
          #include "freertos/event_groups.h"
          #include <string.h>
          #include <stdbool.h>

          static const char *TAG      = "WIFI_PROV";
          static const char *NVS_NS   = "wifi_cfg";
          static const char *NVS_SSID = "ssid";
          static const char *NVS_PASS = "pass";

          static EventGroupHandle_t s_evt_group;
          #define CONNECTED_BIT BIT0
          #define SC_DONE_BIT   BIT1

          static bool load_credentials(char *ssid, size_t slen,
                                       char *pass, size_t plen)
          {
              nvs_handle_t h;
              if (nvs_open(NVS_NS, NVS_READONLY, &h) != ESP_OK) return false;
              bool ok = (nvs_get_str(h, NVS_SSID, ssid, &slen) == ESP_OK &&
                         nvs_get_str(h, NVS_PASS, pass, &plen) == ESP_OK);
              nvs_close(h);
              return ok;
          }

          static void save_credentials(const char *ssid, const char *pass)
          {
              nvs_handle_t h;
              if (nvs_open(NVS_NS, NVS_READWRITE, &h) != ESP_OK) return;
              nvs_set_str(h, NVS_SSID, ssid);
              nvs_set_str(h, NVS_PASS, pass);
              nvs_commit(h);
              nvs_close(h);
              ESP_LOGI(TAG, "Credentials saved to NVS");
          }

          static void wifi_event_handler(void *arg, esp_event_base_t base,
                                         int32_t id, void *data)
          {
              if (base == WIFI_EVENT && id == WIFI_EVENT_STA_DISCONNECTED) {
                  esp_wifi_connect();
              } else if (base == IP_EVENT && id == IP_EVENT_STA_GOT_IP) {
                  xEventGroupSetBits(s_evt_group, CONNECTED_BIT);
              }
          }

          static void sc_event_handler(void *arg, esp_event_base_t base,
                                       int32_t id, void *data)
          {
              if (id == SC_EVENT_GOT_SSID_PSWD) {
                  smartconfig_event_got_ssid_pswd_t *evt = data;

                  wifi_config_t cfg = {0};
                  memcpy(cfg.sta.ssid,     evt->ssid,     sizeof(cfg.sta.ssid));
                  memcpy(cfg.sta.password, evt->password, sizeof(cfg.sta.password));

                  save_credentials((char *)evt->ssid, (char *)evt->password);

                  esp_wifi_disconnect();
                  esp_wifi_set_config(WIFI_IF_STA, &cfg);
                  esp_wifi_connect();

              } else if (id == SC_EVENT_SEND_ACK_DONE) {
                  xEventGroupSetBits(s_evt_group, SC_DONE_BIT);
                  esp_smartconfig_stop();
              }
          }

          void wifi_prov_app_start(void)
          {
              s_evt_group = xEventGroupCreate();

              esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, wifi_event_handler, NULL);
              esp_event_handler_register(IP_EVENT,   IP_EVENT_STA_GOT_IP, wifi_event_handler, NULL);
              esp_event_handler_register(SC_EVENT,   ESP_EVENT_ANY_ID, sc_event_handler, NULL);

              char ssid[64] = {0}, pass[64] = {0};
              if (load_credentials(ssid, sizeof(ssid), pass, sizeof(pass))) {
                  ESP_LOGI(TAG, "Using stored SSID: %s", ssid);

                  wifi_config_t cfg = {0};
                  memcpy(cfg.sta.ssid,     ssid, strlen(ssid));
                  memcpy(cfg.sta.password, pass, strlen(pass));

                  esp_wifi_set_mode(WIFI_MODE_STA);
                  esp_wifi_set_config(WIFI_IF_STA, &cfg);
                  esp_wifi_start();
                  esp_wifi_connect();
              } else {
                  ESP_LOGI(TAG, "No credentials found — starting SmartConfig");
                  esp_wifi_set_mode(WIFI_MODE_STA);
                  esp_wifi_start();
                  esp_smartconfig_set_type(SC_TYPE_ESPTOUCH);
                  smartconfig_start_config_t sc_cfg = SMARTCONFIG_START_CONFIG_DEFAULT();
                  esp_smartconfig_start(&sc_cfg);
              }

              EventBits_t bits = xEventGroupWaitBits(s_evt_group,
                  CONNECTED_BIT | SC_DONE_BIT, true, false, pdMS_TO_TICKS(60000));

              if (bits & CONNECTED_BIT) {
                  ESP_LOGI(TAG, "WiFi connected successfully");
              } else {
                  ESP_LOGW(TAG, "WiFi connect timed out after 60 s");
              }
          }
          EOF

      # =========================================================
      # PATCH CMAKE
      # =========================================================
      - name: Patch CMake
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          if ! grep -q "voice_hook.c" "$FILE"; then
            sed -i '/SRCS/s/main.c/main.c voice_hook.c web_server.c espnow_relay.c node_registry.c mqtt_client_app.c wifi_prov_app.c/' "$FILE"
          fi

      # =========================================================
      # PATCH MAIN INCLUDES
      # =========================================================
      - name: Patch main includes
        run: |
          FILE=examples/factory_demo/main/main.c

          LAST_INCLUDE=$(grep -n "#include" "$FILE" | tail -1 | cut -d: -f1)

          for H in web_server.h voice_hook.h espnow_relay.h node_registry.h mqtt_client_app.h wifi_prov_app.h; do
            sed -i "/${H}/d" "$FILE" || true
          done

          sed -i "${LAST_INCLUDE}a\\
          #include \"web_server.h\"\n#include \"voice_hook.h\"\n#include \"espnow_relay.h\"\n#include \"node_registry.h\"\n#include \"mqtt_client_app.h\"\n#include \"wifi_prov_app.h\"" "$FILE"

      # =========================================================
      # PATCH MAIN CALLS
      # =========================================================
      - name: Patch main calls
        run: |
          FILE=examples/factory_demo/main/main.c

          for FN in wifi_prov_app_start voice_hook_init node_registry_init espnow_relay_init mqtt_client_app_init web_server_start; do
            sed -i "/${FN}()/d" "$FILE" || true
          done

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(1000));\
          wifi_prov_app_start();\
          vTaskDelay(pdMS_TO_TICKS(2000));\
          voice_hook_init();\
          node_registry_init();\
          espnow_relay_init();\
          mqtt_client_app_init();\
          web_server_start();' "$FILE"

      # =========================================================
      # PATCH app_sr_handler FOR VOICE ROUTING
      # =========================================================
      - name: Patch app_sr_handler for voice routing
        run: |
          FILE=$(find examples/factory_demo -name "app_sr_handler.c" -type f | head -1)

          if [ -z "$FILE" ]; then
            echo "app_sr_handler.c not found — skipping"
            exit 0
          fi

          echo "Patching: $FILE"

          if ! grep -q "voice_hook.h" "$FILE"; then
            sed -i '1s/^/#include "voice_hook.h"\n/' "$FILE"
          fi

          if ! grep -q "voice_hook_process" "$FILE"; then
            sed -i '/ESP_LOGI.*phrase/a \            voice_hook_process(result->phrase);' "$FILE"
          fi

      # =========================================================
      # SDKCONFIG — MQTT BROKER + WATCHDOG OFF
      # =========================================================
      - name: Patch sdkconfig
        run: |
          cd examples/factory_demo
          echo 'CONFIG_MQTT_BROKER_URI="mqtt://broker.hivemq.com"' >> sdkconfig.ci.box
          echo 'CONFIG_ESP_TASK_WDT=n'                              >> sdkconfig.ci.box

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # =========================================================
      # MERGE BIN  (single flashable image)
      # =========================================================
      - name: Merge firmware into single factory.bin
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

          echo "=== Merged binary info ==="
          ls -lh factory.bin
          sha256sum factory.bin

      # =========================================================
      # UPLOAD — merged .bin as downloadable artifact
      # =========================================================
      - name: Upload factory.bin
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-ai-v2-factory
          path: examples/factory_demo/build/factory.bin
          retention-days: 30
