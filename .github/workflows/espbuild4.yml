name: ESP32-S3-BOX AI VOICE ROUTER + ESPNOW RELAY V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean previous build
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true
          rm -rf examples/factory_demo/.idf_component_cache || true

      # =========================================================
      # RESTORE
      # =========================================================
      - name: Restore original manifest
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml 2>/dev/null || true

      - name: Enable component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =========================================================
      # VOICE HOOK
      # =========================================================
      - name: Add voice hook
        run: |

          cat > examples/factory_demo/main/voice_hook.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void voice_hook_init(void);
          void voice_hook_process(const char *phrase);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/voice_hook.c << 'EOF'
          #include "voice_hook.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include "relay_protocol.h"

          #include <string.h>
          #include <stdbool.h>

          static const char *TAG = "VOICE";

          static bool last_light_state = false;

          static bool contains_word(const char *text, const char *word)
          {
              if (!text || !word) return false;
              return strstr(text, word) != NULL;
          }

          void voice_hook_init(void)
          {
              ESP_LOGI(TAG, "Voice router initialized");
          }

          void voice_hook_process(const char *phrase)
          {
              if (!phrase) return;

              ESP_LOGI(TAG, "VOICE CMD: %s", phrase);

              if (contains_word(phrase, "light") ||
                  contains_word(phrase, "led"))
              {
                  if (contains_word(phrase, "on"))
                  {
                      app_pwm_led_set_power(true);
                      relay_send_command("LED_ON");
                      last_light_state = true;

                      ESP_LOGI(TAG, "Light ON");
                  }
                  else if (contains_word(phrase, "off"))
                  {
                      app_pwm_led_set_power(false);
                      relay_send_command("LED_OFF");
                      last_light_state = false;

                      ESP_LOGI(TAG, "Light OFF");
                  }
              }
              else if (contains_word(phrase, "repeat"))
              {
                  if (last_light_state)
                  {
                      app_pwm_led_set_power(true);
                      relay_send_command("LED_ON");
                  }
                  else
                  {
                      app_pwm_led_set_power(false);
                      relay_send_command("LED_OFF");
                  }

                  ESP_LOGI(TAG, "Repeated previous action");
              }
              else if (contains_word(phrase, "relay"))
              {
                  relay_send_command("PING");
                  ESP_LOGI(TAG, "Relay ping");
              }
          }
          EOF

      # =========================================================
      # ESPNOW RELAY PROTOCOL
      # =========================================================
      - name: Add relay protocol
        run: |

          cat > examples/factory_demo/main/relay_protocol.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void relay_protocol_init(void);
          void relay_send_command(const char *cmd);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/relay_protocol.c << 'EOF'
          #include "relay_protocol.h"

          #include "esp_log.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "nvs_flash.h"

          #include <string.h>

          static const char *TAG = "RELAY";

          static uint8_t broadcast_mac[] =
          {
              0xFF,0xFF,0xFF,0xFF,0xFF,0xFF
          };

          typedef struct
          {
              char cmd[32];
          } relay_packet_t;

          static void send_cb(const uint8_t *mac_addr,
                              esp_now_send_status_t status)
          {
              ESP_LOGI(TAG, "ESP-NOW send status: %d", status);
          }

          static void recv_cb(const esp_now_recv_info_t *info,
                              const uint8_t *data,
                              int len)
          {
              if (len <= 0) return;

              relay_packet_t pkt;
              memset(&pkt, 0, sizeof(pkt));

              memcpy(&pkt, data,
                     len > sizeof(pkt) ? sizeof(pkt) : len);

              ESP_LOGI(TAG, "RX relay cmd: %s", pkt.cmd);
          }

          void relay_protocol_init(void)
          {
              ESP_LOGI(TAG, "Init relay protocol");

              esp_now_init();

              esp_now_register_send_cb(send_cb);
              esp_now_register_recv_cb(recv_cb);

              esp_now_peer_info_t peer = {0};

              memcpy(peer.peer_addr, broadcast_mac, 6);

              peer.channel = 0;
              peer.encrypt = false;

              esp_now_add_peer(&peer);
          }

          void relay_send_command(const char *cmd)
          {
              if (!cmd) return;

              relay_packet_t pkt;
              memset(&pkt, 0, sizeof(pkt));

              strncpy(pkt.cmd, cmd, sizeof(pkt.cmd) - 1);

              esp_now_send(broadcast_mac,
                           (uint8_t *)&pkt,
                           sizeof(pkt));

              ESP_LOGI(TAG, "Relay send: %s", pkt.cmd);
          }
          EOF

      # =========================================================
      # WEB SERVER
      # =========================================================
      - name: Add web server
        run: |

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once

          #ifdef __cplusplus
          extern "C" {
          #endif

          void web_server_start(void);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"

          #include "esp_http_server.h"
          #include "app_led.h"
          #include "relay_protocol.h"

          static httpd_handle_t server = NULL;

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
              "<html><body>"
              "<h1>ESP32 AI Voice Router</h1>"
              "<button onclick=\"fetch('/on')\">LED ON</button>"
              "<button onclick=\"fetch('/off')\">LED OFF</button>"
              "<button onclick=\"fetch('/relay')\">PING RELAY</button>"
              "</body></html>";

              httpd_resp_send(req,
                              html,
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t on_handler(httpd_req_t *req)
          {
              app_pwm_led_set_power(true);
              relay_send_command("LED_ON");

              httpd_resp_send(req,
                              "ON",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t off_handler(httpd_req_t *req)
          {
              app_pwm_led_set_power(false);
              relay_send_command("LED_OFF");

              httpd_resp_send(req,
                              "OFF",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t relay_handler(httpd_req_t *req)
          {
              relay_send_command("PING");

              httpd_resp_send(req,
                              "PING",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          void web_server_start(void)
          {
              if (server) return;

              httpd_config_t config =
                  HTTPD_DEFAULT_CONFIG();

              httpd_start(&server, &config);

              httpd_uri_t root = {
                  .uri="/",
                  .method=HTTP_GET,
                  .handler=root_handler
              };

              httpd_uri_t on = {
                  .uri="/on",
                  .method=HTTP_GET,
                  .handler=on_handler
              };

              httpd_uri_t off = {
                  .uri="/off",
                  .method=HTTP_GET,
                  .handler=off_handler
              };

              httpd_uri_t relay = {
                  .uri="/relay",
                  .method=HTTP_GET,
                  .handler=relay_handler
              };

              httpd_register_uri_handler(server, &root);
              httpd_register_uri_handler(server, &on);
              httpd_register_uri_handler(server, &off);
              httpd_register_uri_handler(server, &relay);
          }
          EOF

      # =========================================================
      # PATCH CMAKE
      # =========================================================
      - name: Patch CMakeLists
        run: |

          FILE=examples/factory_demo/main/CMakeLists.txt

          if ! grep -q "voice_hook.c" $FILE; then
            sed -i '/SRCS.*main\.c/s/.*/& voice_hook.c web_server.c relay_protocol.c/' $FILE
          fi

      # =========================================================
      # PATCH MAIN INCLUDES
      # =========================================================
      - name: Patch main.c includes
        run: |

          FILE=examples/factory_demo/main/main.c

          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)

          sed -i '/web_server.h/d' $FILE || true
          sed -i '/voice_hook.h/d' $FILE || true
          sed -i '/relay_protocol.h/d' $FILE || true

          sed -i "${LAST_INCLUDE}a\\
          #include \"web_server.h\"\n#include \"voice_hook.h\"\n#include \"relay_protocol.h\"" $FILE

      # =========================================================
      # PATCH MAIN CALLS
      # =========================================================
      - name: Patch main.c calls
        run: |

          FILE=examples/factory_demo/main/main.c

          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/voice_hook_init()/d' $FILE || true
          sed -i '/relay_protocol_init()/d' $FILE || true

          sed -i '/app_rmaker_start()/a \
          relay_protocol_init();\
          voice_hook_init();\
          web_server_start();' $FILE

      # =========================================================
      # PATCH SR HANDLER SAFE
      # =========================================================
      - name: Patch app_sr_handler
        run: |

          FILE=$(find examples/factory_demo -name "app_sr_handler.c" -type f | head -1)

          if [ -z "$FILE" ]; then
            echo "app_sr_handler.c not found"
            exit 0
          fi

          echo "Patching: $FILE"

          if ! grep -q "voice_hook.h" "$FILE"; then
            sed -i '1s/^/#include "voice_hook.h"\n/' "$FILE"
          fi

          if ! grep -q "voice_hook_process" "$FILE"; then
            sed -i '/ESP_LOGI.*\(TAG.*phrase\|phrase.*\)/a \            voice_hook_process(result->phrase);' "$FILE"
          fi

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean

          idf.py reconfigure

          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-ai-relay-v2
          path: examples/factory_demo/build/factory.bin
