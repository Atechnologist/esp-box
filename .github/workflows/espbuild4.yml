name: ESP32-S3-BOX AI VOICE ROUTER STABLE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe Git
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean previous build
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =========================================================
      # RESTORE ORIGINAL FILES
      # =========================================================
      - name: Restore original files
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml || true
          git checkout main/CMakeLists.txt || true
          git checkout main/main.c || true

      # =========================================================
      # ENABLE COMPONENT MANAGER
      # =========================================================
      - name: Enable component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =========================================================
      # AI VOICE ROUTER
      # =========================================================
      - name: Add AI voice router
        run: |
          cat > examples/factory_demo/main/ai_voice_router.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void ai_voice_process(const char *text);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/ai_voice_router.c << 'EOF'
          #include "ai_voice_router.h"
          #include "command_router.h"
          #include "esp_log.h"
          #include <stdio.h>
          #include <string.h>
          
          static const char *TAG = "AI_VOICE";
          
          static int contains(const char *text, const char *word)
          {
              if (!text || !word) {
                  return 0;
              }
              
              return strstr(text, word) != NULL;
          }
          
          void ai_voice_process(const char *text)
          {
              if (!text) {
                  return;
              }
              
              ESP_LOGI(TAG, "Voice input: %s", text);
              
              if (contains(text, "light") || contains(text, "led")) {
                  if (contains(text, "on")) {
                      command_router_execute("LED_ON");
                  }
                  else if (contains(text, "off")) {
                      command_router_execute("LED_OFF");
                  }
              }
          }
          EOF

      # =========================================================
      # COMMAND ROUTER
      # =========================================================
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void command_router_execute(const char *cmd);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include <stdbool.h>
          #include <stdio.h>
          #include <string.h>
          
          static const char *TAG = "CMD_ROUTER";
          
          void command_router_execute(const char *cmd)
          {
              if (!cmd) {
                  return;
              }
              
              ESP_LOGI(TAG, "Executing: %s", cmd);
              
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
                  ESP_LOGI(TAG, "LED turned ON");
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
                  ESP_LOGI(TAG, "LED turned OFF");
              }
          }
          EOF

      # =========================================================
      # WEB SERVER
      # =========================================================
      - name: Add web server
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void web_server_start(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF
          
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include <stdbool.h>
          
          static const char *TAG = "WEB_SERVER";
          static httpd_handle_t server = NULL;
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] =
                  "<!DOCTYPE html>"
                  "<html>"
                  "<head>"
                  "<title>ESP32-S3-BOX AI Voice</title>"
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                  "<style>"
                  "body{font-family:Arial;margin:20px;}"
                  ".btn{padding:10px 20px;margin:5px;cursor:pointer;}"
                  ".on{background:#4CAF50;color:white;}"
                  ".off{background:#f44336;color:white;}"
                  "</style>"
                  "</head>"
                  "<body>"
                  "<h1>ESP32-S3-BOX AI Voice Router</h1>"
                  "<p>Control LED via Voice or Web</p>"
                  "<button class='btn on' onclick=\"fetch('/on')\">LED ON</button>"
                  "<button class='btn off' onclick=\"fetch('/off')\">LED OFF</button>"
                  "</body>"
                  "</html>";
              
              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              
              return ESP_OK;
          }
          
          static esp_err_t on_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED ON requested via web");
              app_pwm_led_set_power(true);
              
              httpd_resp_send(req, "LED_ON", HTTPD_RESP_USE_STRLEN);
              
              return ESP_OK;
          }
          
          static esp_err_t off_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED OFF requested via web");
              app_pwm_led_set_power(false);
              
              httpd_resp_send(req, "LED_OFF", HTTPD_RESP_USE_STRLEN);
              
              return ESP_OK;
          }
          
          void web_server_start(void)
          {
              if (server != NULL) {
                  return;
              }
              
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              config.stack_size = 8192;
              
              if (httpd_start(&server, &config) != ESP_OK) {
                  ESP_LOGE(TAG, "Failed to start web server");
                  return;
              }
              
              httpd_uri_t root = {
                  .uri = "/",
                  .method = HTTP_GET,
                  .handler = root_handler,
                  .user_ctx = NULL
              };
              
              httpd_uri_t on = {
                  .uri = "/on",
                  .method = HTTP_GET,
                  .handler = on_handler,
                  .user_ctx = NULL
              };
              
              httpd_uri_t off = {
                  .uri = "/off",
                  .method = HTTP_GET,
                  .handler = off_handler,
                  .user_ctx = NULL
              };
              
              httpd_register_uri_handler(server, &root);
              httpd_register_uri_handler(server, &on);
              httpd_register_uri_handler(server, &off);
              
              ESP_LOGI(TAG, "Web server started on port 80");
          }
          EOF

      # =========================================================
      # PATCH CMakeLists.txt
      # =========================================================
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          
          if ! grep -q "ai_voice_router.c" $FILE; then
            sed -i '/SRCS.*main\.c/s/.*/& ai_voice_router.c command_router.c web_server.c/' $FILE
          fi

      # =========================================================
      # PATCH main.c
      # =========================================================
      - name: Patch main.c includes
        run: |
          FILE=examples/factory_demo/main/main.c
          
          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)
          
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/ai_voice_router.h/d' $FILE || true
          
          sed -i "${LAST_INCLUDE}a\\
          #include \"web_server.h\"\n#include \"ai_voice_router.h\"" $FILE

      - name: Patch main.c calls
        run: |
          FILE=examples/factory_demo/main/main.c
          
          sed -i '/web_server_start()/d' $FILE || true
          
          sed -i '/app_rmaker_start()/a \
          web_server_start();' $FILE

      # =========================================================
      # PATCH SPEECH RECOGNITION HANDLER
      # =========================================================
      - name: Inject AI voice pipeline
        run: |
          FILE=$(find examples/factory_demo -name "app_sr_handler.c" | head -1)
          
          if [ -z "$FILE" ]; then
            echo "app_sr_handler.c not found, skipping voice injection"
            exit 0
          fi
          
          if ! grep -q "ai_voice_router.h" $FILE; then
            sed -i '1s/^/#include "ai_voice_router.h"\n/' $FILE
          fi
          
          if ! grep -q "ai_voice_process" $FILE; then
            sed -i '/ESP_LOGI.*phrase/a \
            if (result && result->phrase) ai_voice_process(result->phrase);' $FILE
          fi

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-ai-voice-router
          path: examples/factory_demo/build/factory.bin
