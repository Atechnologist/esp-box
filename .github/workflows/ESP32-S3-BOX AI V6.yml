name: ESP32-S3-BOX INDUSTRIAL RELAY HUB v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

    # =========================
    # CHECKOUT
    # =========================
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - name: Safe dir
      run: git config --global --add safe.directory '*'

    # =========================
    # CLEAN
    # =========================
    - name: Clean
      run: |
        rm -rf examples/factory_demo/build || true
        rm -rf examples/factory_demo/managed_components || true

    # =========================
    # FORCE TARGET
    # =========================
    - name: Force ESP32-S3
      run: |
        cd examples/factory_demo
        echo "CONFIG_ESP_BOX_3=n" >> sdkconfig.ci.box

    # =========================
    # CONTROL BUS (NEW CORE)
    # =========================
    - name: Add control bus
      run: |
        cat > examples/factory_demo/main/control_bus.h << 'EOF'
        #pragma once
        void control_bus_send(const char *cmd);
        EOF

        cat > examples/factory_demo/main/control_bus.c << 'EOF'
        #include "control_bus.h"
        #include "espnow_relay.h"
        #include "app_led.h"
        #include "esp_log.h"
        #include <string.h>

        static const char *TAG = "BUS";

        void control_bus_send(const char *cmd)
        {
            ESP_LOGI(TAG, "CMD: %s", cmd);

            if (!cmd) return;

            if (strcmp(cmd, "LIGHT:ON") == 0)
                app_pwm_led_set_power(true);

            if (strcmp(cmd, "LIGHT:OFF") == 0)
                app_pwm_led_set_power(false);

            espnow_relay_broadcast(cmd);
        }
        EOF

    # =========================
    # VOICE HOOK FIX
    # =========================
    - name: Add voice hook
      run: |
        cat > examples/factory_demo/main/voice_hook.h << 'EOF'
        #pragma once
        void voice_hook_init(void);
        void voice_hook_process(const char *phrase);
        EOF

        cat > examples/factory_demo/main/voice_hook.c << 'EOF'
        #include "voice_hook.h"
        #include "control_bus.h"
        #include "esp_log.h"
        #include <string.h>

        static const char *TAG = "VOICE";

        static int has(const char *a, const char *b)
        {
            return a && b && strstr(a,b);
        }

        void voice_hook_init(void)
        {
            ESP_LOGI(TAG, "voice ready");
        }

        void voice_hook_process(const char *p)
        {
            if (!p) return;

            if (has(p,"light") && has(p,"on"))
                control_bus_send("LIGHT:ON");

            if (has(p,"light") && has(p,"off"))
                control_bus_send("LIGHT:OFF");

            if (has(p,"relay") && has(p,"on"))
                control_bus_send("RELAY:ON");

            if (has(p,"relay") && has(p,"off"))
                control_bus_send("RELAY:OFF");

            if (has(p,"relay") && has(p,"toggle"))
                control_bus_send("RELAY:TOGGLE");
        }
        EOF

    # =========================
    # ESPNOW RELAY (FIXED CHANNEL LOCK)
    # =========================
    - name: Add espnow relay
      run: |
        cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
        #include "espnow_relay.h"
        #include "esp_now.h"
        #include "esp_wifi.h"
        #include "esp_log.h"
        #include "freertos/FreeRTOS.h"
        #include "freertos/task.h"
        #include <string.h>

        static const char *TAG="ESPNOW";
        static bool ready=false;

        static const uint8_t BCAST[6]={0xff,0xff,0xff,0xff,0xff,0xff};

        static void recv_cb(const esp_now_recv_info_t *info,
                            const uint8_t *data,int len)
        {
            char msg[128]={0};
            memcpy(msg,data,len<127?len:127);

            ESP_LOGI(TAG,"RX:%s",msg);
        }

        static void task(void *arg)
        {
            esp_wifi_set_channel(1, WIFI_SECOND_CHAN_NONE); // 🔥 FIXED LOCK

            esp_now_init();
            esp_now_register_recv_cb(recv_cb);

            esp_now_peer_info_t peer={0};
            memcpy(peer.peer_addr,BCAST,6);
            peer.channel=0;
            esp_now_add_peer(&peer);

            ready=true;

            while(1)
            {
                vTaskDelay(pdMS_TO_TICKS(5000));
            }
        }

        void espnow_relay_init()
        {
            xTaskCreate(task,"espnow",4096,NULL,5,NULL);
        }

        void espnow_relay_broadcast(const char *msg)
        {
            if(!ready||!msg) return;
            esp_now_send(BCAST,(uint8_t*)msg,strlen(msg)+1);
        }
        EOF

    # =========================
    # WEB SERVER FIX (USES BUS)
    # =========================
    - name: Add web server
      run: |
        cat > examples/factory_demo/main/web_server.c << 'EOF'
        #include "esp_http_server.h"
        #include "control_bus.h"

        static esp_err_t relay_on(httpd_req_t *r)
        {
            control_bus_send("RELAY:ON");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        static esp_err_t relay_off(httpd_req_t *r)
        {
            control_bus_send("RELAY:OFF");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        static esp_err_t relay_toggle(httpd_req_t *r)
        {
            control_bus_send("RELAY:TOGGLE");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        void web_server_start()
        {
            httpd_handle_t s=NULL;
            httpd_config_t c=HTTPD_DEFAULT_CONFIG();
            httpd_start(&s,&c);

            httpd_uri_t a={"/relay/on",HTTP_GET,relay_on};
            httpd_uri_t b={"/relay/off",HTTP_GET,relay_off};
            httpd_uri_t c2={"/relay/toggle",HTTP_GET,relay_toggle};

            httpd_register_uri_handler(s,&a);
            httpd_register_uri_handler(s,&b);
            httpd_register_uri_handler(s,&c2);
        }
        EOF

    # =========================
    # PATCH MAIN CLEANLY
    # =========================
    - name: Patch main
      run: |
        FILE=examples/factory_demo/main/main.c

        echo '#include "control_bus.h"' >> $FILE

        sed -i '/app_rmaker_start/a \
        vTaskDelay(pdMS_TO_TICKS(1000));\
        espnow_relay_init();' $FILE

    # =========================
    # BUILD
    # =========================
    - name: Build
      run: |
        . $IDF_PATH/export.sh
        cd examples/factory_demo

        idf.py set-target esp32s3
        idf.py build

    # =========================
    # ARTIFACT
    # =========================
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-industrial-v2
        path: examples/factory_demo/build/*.bin
