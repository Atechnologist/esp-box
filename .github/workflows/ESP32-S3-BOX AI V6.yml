name: ESP32-S3-BOX AI VOICE + ESP-NOW INDUSTRIAL BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

    # =========================================================
    # CHECKOUT
    # =========================================================
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - name: Safe directory
      run: git config --global --add safe.directory '*'

    # =========================================================
    # CLEAN
    # =========================================================
    - name: Clean build
      run: |
        rm -rf examples/factory_demo/build || true
        rm -rf examples/factory_demo/sdkconfig || true
        rm -rf examples/factory_demo/managed_components || true

    # =========================================================
    # FORCE TARGET STABILITY
    # =========================================================
    - name: Force ESP32-S3 target
      run: |
        cd examples/factory_demo
        echo "CONFIG_ESP_BOX_3=n" >> sdkconfig.ci.box || true

    # =========================================================
    # VOICE HOOK (SAFE)
    # =========================================================
    - name: Add voice hook
      run: |
        mkdir -p examples/factory_demo/main

        cat > examples/factory_demo/main/voice_hook.h << 'EOF'
        #pragma once
        void voice_hook_init(void);
        void voice_hook_process(const char *phrase);
        EOF

        cat > examples/factory_demo/main/voice_hook.c << 'EOF'
        #include "voice_hook.h"
        #include "esp_log.h"
        #include "espnow_relay.h"
        #include "app_led.h"
        #include <string.h>

        static const char *TAG = "VOICE";

        static int has(const char *a, const char *b) {
            return a && b && strstr(a,b);
        }

        void voice_hook_init(void) {
            ESP_LOGI(TAG, "Voice ready");
        }

        void voice_hook_process(const char *p) {
            if (!p) return;

            ESP_LOGI(TAG, "VOICE: %s", p);

            if (has(p,"light")) {
                if (has(p,"on")) {
                    app_pwm_led_set_power(true);
                    espnow_relay_broadcast("LIGHT:ON");
                }
                if (has(p,"off")) {
                    app_pwm_led_set_power(false);
                    espnow_relay_broadcast("LIGHT:OFF");
                }
            }

            if (has(p,"relay")) {
                if (has(p,"on")) espnow_relay_broadcast("RELAY:ON");
                if (has(p,"off")) espnow_relay_broadcast("RELAY:OFF");
                if (has(p,"toggle")) espnow_relay_broadcast("RELAY:TOGGLE");
            }
        }
        EOF

    # =========================================================
    # ESP-NOW RELAY (FIXED + STABLE)
    # =========================================================
    - name: Add ESP-NOW relay
      run: |
        cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
        #pragma once
        void espnow_relay_init(void);
        void espnow_relay_broadcast(const char *msg);
        EOF

        cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
        #include "espnow_relay.h"
        #include "esp_log.h"
        #include "esp_now.h"
        #include "esp_wifi.h"
        #include <string.h>

        static const char *TAG = "ESPNOW";

        static const uint8_t BCAST[6] = {0xff,0xff,0xff,0xff,0xff,0xff};
        static bool ready = false;

        static void recv_cb(const esp_now_recv_info_t *info,
                            const uint8_t *data, int len)
        {
            char msg[128] = {0};
            memcpy(msg, data, len > 127 ? 127 : len);

            ESP_LOGI(TAG, "RX: %s", msg);
        }

        void espnow_relay_init(void)
        {
            ESP_LOGI(TAG, "ESP-NOW init");

            esp_now_init();
            esp_now_register_recv_cb(recv_cb);

            esp_now_peer_info_t peer = {0};
            memcpy(peer.peer_addr, BCAST, 6);
            peer.channel = 0;
            peer.encrypt = false;

            esp_now_add_peer(&peer);

            ready = true;
        }

        void espnow_relay_broadcast(const char *msg)
        {
            if (!ready || !msg) return;

            esp_now_send(BCAST,
                         (const uint8_t*)msg,
                         strlen(msg)+1);

            ESP_LOGI(TAG, "TX: %s", msg);
        }
        EOF

    # =========================================================
    # WEB SERVER (SAFE + NO CRASH)
    # =========================================================
    - name: Add web server
      run: |
        cat > examples/factory_demo/main/web_server.c << 'EOF'
        #include "esp_http_server.h"
        #include "esp_log.h"
        #include "espnow_relay.h"
        #include "app_led.h"

        static httpd_handle_t server = NULL;

        static esp_err_t relay_on(httpd_req_t *r){
            espnow_relay_broadcast("RELAY:ON");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        static esp_err_t relay_off(httpd_req_t *r){
            espnow_relay_broadcast("RELAY:OFF");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        static esp_err_t relay_toggle(httpd_req_t *r){
            espnow_relay_broadcast("RELAY:TOGGLE");
            httpd_resp_send(r,"OK",2);
            return ESP_OK;
        }

        void web_server_start(void)
        {
            httpd_config_t cfg = HTTPD_DEFAULT_CONFIG();
            httpd_start(&server, &cfg);

            httpd_uri_t uris[] = {
                {"/relay/on", HTTP_GET, relay_on},
                {"/relay/off", HTTP_GET, relay_off},
                {"/relay/toggle", HTTP_GET, relay_toggle},
            };

            for(int i=0;i<3;i++)
                httpd_register_uri_handler(server,&uris[i]);
        }
        EOF

    # =========================================================
    # PATCH MAIN (SAFE INSERT)
    # =========================================================
    - name: Patch main
      run: |
        FILE=examples/factory_demo/main/main.c

        sed -i '/voice_hook.h/d' $FILE || true
        sed -i '/espnow_relay.h/d' $FILE || true
        sed -i '/web_server.h/d' $FILE || true

        sed -i '1i #include "voice_hook.h"\n#include "espnow_relay.h"\n#include "web_server.h"' $FILE

    # =========================================================
    # BUILD (FIXED SOURCE ERROR)
    # =========================================================
    - name: Build firmware
      shell: bash
      run: |
        source $IDF_PATH/export.sh

        cd examples/factory_demo

        idf.py set-target esp32s3
        idf.py reconfigure
        idf.py build

    # =========================================================
    # MERGE BIN
    # =========================================================
    - name: Merge firmware
      shell: bash
      run: |
        source $IDF_PATH/export.sh

        cd examples/factory_demo/build

        python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory.bin \
          --flash_mode dio \
          --flash_size 16MB \
          $(cat flash_args)

    # =========================================================
    # ARTIFACT
    # =========================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-box-industrial
        path: examples/factory_demo/build/factory.bin
        retention-days: 30
