name: Build ESP32-S3-BOX Factory Demo + Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo
        uses: actions/checkout@v4

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Disable Component Manager
        run: echo IDF_COMPONENT_MANAGER=0 >> $GITHUB_ENV

      # ✅ ONLY add files (DO NOT overwrite main)
      - name: Inject Web Server Files
        run: |
          set -e
          cp custom/main/web_server.c esp-box/examples/factory_demo/main/
          cp custom/main/web_server.h esp-box/examples/factory_demo/main/

      # ✅ Patch original main.c safely
      - name: Patch main.c
        run: |
          set -e

          FILE=esp-box/examples/factory_demo/main/main.c

          # Add include
          sed -i '/ui_sensor_monitor.h/a #include "web_server.h"' $FILE

          # Add task function at top
          sed -i '1i \
void start_web_task(void *arg) {\n\
    vTaskDelay(pdMS_TO_TICKS(8000));\n\
    web_server_start();\n\
    vTaskDelete(NULL);\n\
}\n' $FILE

          # Start web server after RainMaker
          sed -i '/app_rmaker_start();/a \
    xTaskCreate(start_web_task, "web_task", 4096, NULL, 5, NULL);' $FILE

      - name: Build
        run: |
          set -e
          . $IDF_PATH/export.sh
          cd esp-box/examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean build
          cd build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)
          - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: factory-demo-web
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
