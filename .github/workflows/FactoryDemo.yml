name: ESP32-S3-BOX Clean Build (Stable Fix)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout user repo
        uses: actions/checkout@v4

      - name: Clone ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git esp-box

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Build firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          # ✅ ONLY add your files (DO NOT replace main.c)
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # ✅ Modify CMakeLists SAFELY (append instead of overwrite)
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # ✅ Use stable config
          cp sdkconfig.ci.box sdkconfig

          idf.py set-target esp32s3
          idf.py fullclean || true

          idf.py build

      - name: Merge firmware
        run: |
          cd esp-box/examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
