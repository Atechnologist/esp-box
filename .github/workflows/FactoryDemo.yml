name: ESP32-S3-BOX Factory Demo (Stable + Custom)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout ESP-BOX repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject Custom Code
        run: |
          cp custom/main/main.c examples/factory_demo/main/main.c
          cp custom/main/web_server.c examples/factory_demo/main/web_server.c
          cp custom/main/web_server.h examples/factory_demo/main/web_server.h

      - name: Fix CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py build

      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: examples/factory_demo/build/factory_demo_box.bin
