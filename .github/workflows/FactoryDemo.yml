name: Build ESP32-S3-BOX Factory Demo (Merged)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ----------------------------
      # Checkout ESP-BOX repo
      # ----------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      # ----------------------------
      # Fix Git issue
      # ----------------------------
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # ----------------------------
      # Enable component manager
      # ----------------------------
      - name: Enable ESP-IDF Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ----------------------------
      # Patch broken dependencies
      # ----------------------------
      - name: Patch dependencies
        run: |
          set -e
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \; || true

      # ----------------------------
      # Build firmware
      # ----------------------------
      - name: Build Factory Demo
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig

          idf.py reconfigure
          idf.py build

      # ----------------------------
      # Merge into SINGLE BIN (SAFE)
      # ----------------------------
      - name: Create merged firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ----------------------------
      # Package full firmware
      # ----------------------------
      - name: Package firmware
        run: |
          cd examples/factory_demo/build

          zip firmware.zip \
            bootloader/bootloader.bin \
            partition_table/partition-table.bin \
            ota_data_initial.bin \
            factory_demo.bin \
            storage.bin \
            srmodels/srmodels.bin

      # ----------------------------
      # Upload artifacts
      # ----------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-firmware
          path: |
            examples/factory_demo/build/firmware.zip
            examples/factory_demo/build/factory_merged.bin
