name: ESP-BOX-S3 Custom Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util

      - name: Clone ESP-IDF
        run: |
          git clone -b v5.2.2 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf

      - name: Install ESP-IDF
        run: |
          cd $HOME/esp-idf
          ./install.sh

      - name: Export ESP-IDF environment
        run: |
          echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV

      - name: Build Project
        shell: bash
        run: |
          . $HOME/esp-idf/export.sh

          # 🔥 Clean everything (prevents your previous errors)
          idf.py fullclean || true
          rm -f sdkconfig
          rm -f dependencies.lock

          # ✅ Set correct target
          idf.py set-target esp32s3

          # ✅ Resolve dependencies cleanly
          idf.py reconfigure

          # ✅ Build
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-s3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
