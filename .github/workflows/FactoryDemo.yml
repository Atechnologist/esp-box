name: ESP32-S3-BOX Stable Factory Build (Hard Isolated)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ 1. Checkout your repo (for custom files only)
      - name: Checkout user repo
        uses: actions/checkout@v4

      # 🚀 2. CREATE CLEAN WORKSPACE (KEY FIX)
      - name: Create clean workspace
        run: |
          mkdir -p /tmp/work
          cd /tmp/work

      # ✅ 3. Clone ESP-BOX INSIDE clean workspace
      - name: Clone ESP-BOX clean
        run: |
          cd /tmp/work
          git clone --recursive https://github.com/espressif/esp-box.git

      # 🚀 4. Build in FULLY ISOLATED PATH
      - name: Build firmware (true isolation)
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd /tmp/work/esp-box/examples/factory_demo

          # 🔥 Inject your custom files FROM original repo
          cp $GITHUB_WORKSPACE/custom/main/main.c main/main.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # 🔥 Ensure web server compiled
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # 🔥 Disable SR (prevents crash)
          sed -i 's/CONFIG_SR_ENABLED=y/CONFIG_SR_ENABLED=n/' sdkconfig.ci.box || true

          # 🔥 Use correct config
          cp sdkconfig.ci.box sdkconfig

          # 🔥 HARD CLEAN
          rm -rf build sdkconfig.old

          idf.py set-target esp32s3
          idf.py fullclean || true

          # 🚀 BUILD
          idf.py build

      # 📦 5. Merge firmware
      - name: Merge firmware
        shell: bash
        run: |
          cd /tmp/work/esp-box/examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 6. Upload firmware
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-web-stable
          path: /tmp/work/esp-box/examples/factory_demo/build/factory_demo_box.bin
