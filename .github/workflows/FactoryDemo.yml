name: ESP32-S3-BOX Factory + Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # 1️⃣ Checkout YOUR repo (contains custom/)
      - name: Checkout YOUR repo
        uses: actions/checkout@v4
        with:
          path: esp-box

      # 2️⃣ Checkout ESP-BOX separately
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          path: esp-box

      # 3️⃣ Fix git safe dir
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 4️⃣ Inject files (NOW PATH IS CORRECT)
      - name: Inject Custom Code
        run: |
          set -e

          echo "🔥 Removing original main..."
          rm -rf esp-box/examples/factory_demo/main/*

          echo "📦 Copying custom files..."
          cp -v esp-box/custom/main/* esp-box/examples/factory_demo/main/

          echo "📁 Final main folder:"
          ls -l esp-box/examples/factory_demo/main/

      # 5️⃣ Build
      - name: Build Firmware
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean build

      # 6️⃣ Merge firmware
      - name: Merge Firmware
        run: |
          set -e

          cd esp-box/examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_web.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 7️⃣ Upload
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Web
          path: esp-box/examples/factory_demo/build/factory_demo_web.bin
