name: ESP32-S3-BOX Web + RainMaker (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo
        uses: actions/checkout@v4

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # ✅ Copy ONLY our custom files
      - name: Inject Custom Files
        shell: bash
        run: |
          set -e
          cp custom/main/main.c esp-box/examples/factory_demo/main/main.c
          cp custom/main/web_server.c esp-box/examples/factory_demo/main/web_server.c
          cp custom/main/web_server.h esp-box/examples/factory_demo/main/web_server.h

      # ✅ Ensure web_server.c is compiled
      - name: Fix CMakeLists
        shell: bash
        run: |
          FILE=esp-box/examples/factory_demo/main/CMakeLists.txt
          grep -q web_server.c $FILE || sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

      # ✅ Disable SR (prevents crash)
      - name: Disable Speech Recognition
        shell: bash
        run: |
          sed -i 's/CONFIG_SR_ENABLED=y/CONFIG_SR_ENABLED=n/' esp-box/examples/factory_demo/sdkconfig.ci.box || true

      # ✅ Build clean
      - name: Build Firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh
          cd esp-box/examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          rm -rf build
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o factory_demo_box.bin --flash_mode dio --flash_size 16MB $(cat flash_args)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-web-stable
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
