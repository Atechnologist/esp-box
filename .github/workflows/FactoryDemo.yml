name: Build ESP-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container: espressif/idf:release-v5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Safe directory
        run: git config --global --add safe.directory '*'

      - name: Export ESP-IDF
        run: |
          . $IDF_PATH/export.sh

      # ✅ CRITICAL: preload component registry
      - name: Pre-fetch Components
        run: |
          . $IDF_PATH/export.sh
          idf.py update-components

      # ✅ Install dependencies explicitly
      - name: Install Dependencies
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py install-dependencies

      # ✅ FORCE dependency resolution BEFORE build
      - name: Resolve Dependencies
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py reconfigure

      # ✅ Build
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py build

      # ✅ Merge firmware
      - name: Merge binaries
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ✅ Upload artifact
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-firmware
          path: examples/factory_demo/build/factory_demo.bin
