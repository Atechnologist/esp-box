name: Build ESP32-S3-BOX WiFi Web Firmware

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Fix Git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔐 Inject WiFi credentials
      - name: Inject WiFi credentials
        run: |
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🔥 FIX dependencies + BSP (WITH ENV LOADED)
      - name: Fix dependencies and force BSP
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          # Remove problematic external drivers
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \;
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \;

          # Force correct BSP
          idf.py remove-dependency espressif/esp-box-3 || true
          idf.py add-dependency espressif/esp-box-s3

      # 🛠 Build firmware
      - name: Build Firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          rm -rf managed_components
          idf.py reconfigure

          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

          cd build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_wifi.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📦 Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-WiFi-Web
          path: examples/factory_demo/build/factory_demo_box_s3_wifi.bin
