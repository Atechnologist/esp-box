name: ESP32-S3-BOX Factory Demo Stable (Clean Build)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Fix Git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔐 Inject WiFi credentials (SAFE)
      - name: Inject WiFi config
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🧹 RESTORE CRITICAL FILES (FIX YOUR ERROR)
      - name: Restore factory demo build files
        run: |
          # Restore CLEAN CMakeLists.txt (fixes your crash)
          cat <<EOF > examples/factory_demo/main/CMakeLists.txt
          idf_component_register(
              SRCS "app_main.c"
              INCLUDE_DIRS "."
          )
          EOF

      # 🧹 SAFE CLEAN (NO BSP TOUCHING)
      - name: Clean build artifacts safely
        run: |
          . $IDF_PATH/export.sh

          rm -rf build
          rm -rf managed_components

      # 🛠 Build firmware
      - name: Build Factory Demo
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use official working config for ESP32-S3-BOX
          cp sdkconfig.ci.box sdkconfig

          # Clean rebuild
          idf.py fullclean
          idf.py reconfigure

          # Optional safe HTTP tuning
          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

      # 📦 Merge firmware binary
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Stable
          path: examples/factory_demo/build/factory_demo_box_s3_stable.bin
