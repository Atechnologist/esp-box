name: ESP32-S3-BOX Factory Demo (FINAL WORKING - NO KCONFIG)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ Checkout your repo (custom files only)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🔐 Fix Git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 📦 Clone ESP-BOX (clean source)
      - name: Clone ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git esp-box

      # 🔥 FIX dependencies (THIS IS THE REAL FIX)
      - name: Patch broken dependencies
        run: |
          cd esp-box
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \;
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \;

      # 🚀 Build firmware
      - name: Build Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          # ✅ Inject custom files ONLY
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # ✅ Extend CMake safely
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # ✅ Use correct config
          cp sdkconfig.ci.box sdkconfig

          # 🚀 Build
          idf.py set-target esp32s3
          idf.py fullclean || true
          idf.py build

      # 📦 Merge firmware (FIXED ENV)
      - name: Merge Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo/build

          python -m esptool --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Firmware
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
