name: Build ESP32-S3-BOX Factory Demo + Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo (with custom files)
        uses: actions/checkout@v4

      - name: Checkout Official ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Disable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=0" >> $GITHUB_ENV

      # ✅ Copy your custom files into factory demo
      - name: Inject Custom Files
        run: |
          set -e
          cp -r custom/main/* esp-box/examples/factory_demo/main/

          echo "=== FILE CHECK ==="
          ls -l esp-box/examples/factory_demo/main/

      - name: Build Factory Demo
        run: |
          set -e
          . $IDF_PATH/export.sh
          cd esp-box/examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean build
          cd build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: factory-demo-web
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
