name: Build ESP32-S3-BOX Factory Demo + Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo
        uses: actions/checkout@v4

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # ✅ FORCE BASH (CRITICAL FIX)
      - name: Setup ESP-IDF
        shell: bash
        run: |
          . $IDF_PATH/export.sh

      # ✅ ONLY copy web files (safe)
      - name: Inject Web Files
        shell: bash
        run: |
          set -e
          cp custom/main/web_server.c esp-box/examples/factory_demo/main/
          cp custom/main/web_server.h esp-box/examples/factory_demo/main/

      # ✅ Patch WITHOUT breaking structure
      - name: Patch main.c safely
        shell: bash
        run: |
          FILE=esp-box/examples/factory_demo/main/main.c

          # Add include
          grep -q web_server.h $FILE || sed -i '/ui_sensor_monitor.h/a #include "web_server.h"' $FILE

          # Add function (only if not exists)
          grep -q start_web_task $FILE || sed -i '1i \
void start_web_task(void *arg) {\
    vTaskDelay(pdMS_TO_TICKS(8000));\
    web_server_start();\
    vTaskDelete(NULL);\
}\
' $FILE

          # Start task (only if not exists)
          grep -q web_task $FILE || sed -i '/app_rmaker_start();/a \
    xTaskCreate(start_web_task, "web_task", 4096, NULL, 5, NULL);' $FILE

      - name: Build
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh
          cd esp-box/examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean build
          cd build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: factory-demo-web
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
