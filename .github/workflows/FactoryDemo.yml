name: ESP32-S3-BOX Factory Demo (FINAL - BOX S3 FIXED)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ 1. Checkout your repo (custom files only)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🔐 2. Fix Git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 📦 3. Clone official ESP-BOX
      - name: Clone ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git esp-box

      # 🚀 4. Build firmware
      - name: Build Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          # =====================================
          # 🔥 FORCE CORRECT BOARD (REAL FIX)
          # =====================================
          sed -i 's/default BSP_BOARD_ESP32_S3_BOX_3/default BSP_BOARD_ESP32_S3_BOX/' main/Kconfig.projbuild

          # =====================================
          # ✅ Inject custom files
          # =====================================
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # =====================================
          # ✅ Extend CMakeLists safely
          # =====================================
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # =====================================
          # ✅ Use stable config
          # =====================================
          cp sdkconfig.ci.box sdkconfig

          # 🔥 HARD FORCE BOARD AGAIN
          echo "CONFIG_BSP_BOARD_ESP32_S3_BOX=y" >> sdkconfig
          sed -i '/ESP32_S3_BOX_3/d' sdkconfig

          # =====================================
          # 🚀 Build
          # =====================================
          idf.py set-target esp32s3
          idf.py fullclean || true
          idf.py build

      # 📦 5. Merge firmware (FIXED ENV)
      - name: Merge Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo/build

          python -m esptool --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 6. Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Firmware
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
