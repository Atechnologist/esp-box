name: Build ESP-BOX Voice Assistant

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout esp-box repo
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        path: esp-box

    - name: Setup ESP-IDF (NO AUTO BUILD)
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.2
        target: esp32s3
        command: ""   # 🔥 THIS LINE FIXES YOUR ERROR

    - name: Build Voice Assistant (correct folder)
      run: |
        cd esp-box/examples/voice_assistant
        idf.py set-target esp32s3
        idf.py fullclean
        idf.py build

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: espbox-voice-firmware
        path: |
          esp-box/examples/voice_assistant/build/*.bin
