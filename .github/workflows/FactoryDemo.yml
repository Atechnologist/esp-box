name: ESP32-S3-BOX Factory Demo (Correct Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ 1. Checkout YOUR repo (only for custom files)
      - name: Checkout user repo
        uses: actions/checkout@v4

      # 🔥 2. Clone REAL ESP-BOX (THIS FIXES YOUR ERROR)
      - name: Clone official ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git /tmp/esp-box

      # 🚀 3. Build
      - name: Build firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd /tmp/esp-box/examples/factory_demo

          # Inject your custom files
          cp $GITHUB_WORKSPACE/custom/main/main.c main/main.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # Ensure web_server compiled
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # Use correct config
          cp sdkconfig.ci.box sdkconfig

          idf.py set-target esp32s3
          idf.py fullclean || true

          idf.py build

      # 📦 Merge firmware
      - name: Merge firmware
        run: |
          cd /tmp/esp-box/examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o firmware.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /tmp/esp-box/examples/factory_demo/build/firmware.bin
