name: ESP32-S3-BOX Factory Demo (Final Stable - BOX S3)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ 1. Checkout your repo (only custom files)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🔐 2. Fix Git safe directory issue
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 📦 3. Clone clean ESP-BOX source
      - name: Clone ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git esp-box

      # 🚀 4. Build firmware
      - name: Build Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          # ================================
          # ✅ Inject your custom files
          # ================================
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # ================================
          # ✅ Safely extend CMakeLists
          # ================================
          FILE=main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

          # ================================
          # ✅ Use official config
          # ================================
          cp sdkconfig.ci.box sdkconfig

          # ================================
          # 🔥 FORCE ESP32-S3-BOX (NOT BOX-3)
          # ================================
          sed -i 's/CONFIG_BSP_BOARD_ESP32_S3_BOX_3=y/# CONFIG_BSP_BOARD_ESP32_S3_BOX_3 is not set/' sdkconfig || true
          sed -i 's/# CONFIG_BSP_BOARD_ESP32_S3_BOX=y/CONFIG_BSP_BOARD_ESP32_S3_BOX=y/' sdkconfig || true

          # ================================
          # ✅ Build
          # ================================
          idf.py set-target esp32s3
          idf.py fullclean || true
          idf.py build

      # 📦 5. Merge firmware (fixed environment)
      - name: Merge Firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo/build

          python -m esptool --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 6. Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Firmware
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
