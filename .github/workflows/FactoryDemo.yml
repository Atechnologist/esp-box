name: ESP32-S3-BOX Factory + Web (Stable)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ FORCE disable component manager (KEY FIX)
      - name: Disable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=0" >> $GITHUB_ENV

      # 4️⃣ Inject your custom main
      - name: Inject Custom Code
        run: |
          set -e

          if [ -d "custom/main" ]; then
            SRC="custom/main"
          elif [ -d "esp-box/custom/main" ]; then
            SRC="esp-box/custom/main"
          else
            echo "❌ custom/main not found"
            exit 1
          fi

          rm -rf examples/factory_demo/main/*
          cp -v $SRC/* examples/factory_demo/main/

      # 5️⃣ FIX missing BSP (CRITICAL)
      - name: Ensure BSP is available
        run: |
          set -e

          # Clone esp-box BSP manually
          mkdir -p components
          git clone --depth=1 https://github.com/espressif/esp-box.git components/esp-box

      # 6️⃣ Build firmware
      - name: Build Firmware
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean build

      # 7️⃣ Merge firmware
      - name: Merge Firmware
        run: |
          set -e

          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_web.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 8️⃣ Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Web
          path: examples/factory_demo/build/factory_demo_web.bin
