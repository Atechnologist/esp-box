name: ESP32-S3-BOX Factory Build (Custom Main)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ Debug structure (optional but useful)
      - name: Debug Repo
        run: |
          ls -R

      # 4️⃣ Build factory demo (NO file replacement)
      - name: Build Factory Demo
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean build

      # 5️⃣ Merge firmware
      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_custom.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 6️⃣ Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: factory-demo-custom
          path: examples/factory_demo/build/factory_demo_custom.bin
