name: ESP32-S3-BOX Factory Demo (FINAL STABLE NO AHT20)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Git safety
      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      # 🧹 CLEAN BUILD ONLY
      - name: Clean environment
        run: |
          rm -rf build
          rm -rf managed_components

      # 🚨 HARD FIX: REMOVE esp-box-3 + AHT20 FROM COMPONENT GRAPH
      - name: Force remove problematic dependency chain
        run: |
          set -e

          echo "Disabling esp-box-3 dependency chain..."

          # Remove esp-box-3 usage from all component manifests safely
          find . -name "idf_component.yml" -exec sed -i '/esp-box-3/d' {} \;
          find . -name "idf_component.yml" -exec sed -i '/aht20/d' {} \;

          # Remove dependency lock so ESP-IDF re-solves cleanly
          find . -name "dependencies.lock" -delete

      # 🔐 WiFi injection (SAFE ONLY)
      - name: Inject WiFi config
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🛠 Build firmware
      - name: Build ESP32-S3-BOX firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use stable BOX config (NOT BOX-3 chain)
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # 📦 Merge binaries
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_final.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-FINAL
          path: examples/factory_demo/build/factory_demo_box_s3_final.bin
