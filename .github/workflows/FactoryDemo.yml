name: Build ESP32-S3-BOX Factory Demo + Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo
        uses: actions/checkout@v4

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Disable Component Manager
        run: echo IDF_COMPONENT_MANAGER=0 >> $GITHUB_ENV

      - name: Inject Custom Files
        run: |
          set -e
          mkdir -p esp-box/examples/factory_demo/main
          cp custom/main/main.c esp-box/examples/factory_demo/main/
          cp custom/main/web_server.c esp-box/examples/factory_demo/main/
          cp custom/main/web_server.h esp-box/examples/factory_demo/main/
          cp custom/main/CMakeLists.txt esp-box/examples/factory_demo/main/
          ls -l esp-box/examples/factory_demo/main

      - name: Build
        run: |
          set -e
          . $IDF_PATH/export.sh
          cd esp-box/examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean build
          cd build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: factory-demo-web
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
