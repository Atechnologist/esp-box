name: ESP32-S3-BOX Factory Demo (Stable Final)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ 1. Checkout FULL repo (with components)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🔍 2. Verify structure (DEBUG — very important)
      - name: Verify repo structure
        run: |
          echo "Checking components..."
          ls -la components || (echo "❌ components missing" && exit 1)

          echo "Checking factory_demo..."
          ls -la examples/factory_demo || (echo "❌ factory_demo missing" && exit 1)

      # 🔥 3. Inject your custom code
      - name: Inject Custom Code
        run: |
          cp custom/main/main.c examples/factory_demo/main/main.c
          cp custom/main/web_server.c examples/factory_demo/main/web_server.c
          cp custom/main/web_server.h examples/factory_demo/main/web_server.h

      # 🔧 4. Ensure web_server is compiled
      - name: Fix CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          grep -q web_server.c $FILE || \
            sed -i 's/SRCS "main.c"/SRCS "main.c" "web_server.c"/' $FILE

      # 🚀 5. Build firmware
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          # Clean environment
          idf.py fullclean || true
          rm -rf build sdkconfig

          # Set target
          idf.py set-target esp32s3

          # Use correct config
          cp sdkconfig.ci.box sdkconfig

          # Build
          idf.py build

      # 📦 6. Merge firmware
      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 7. Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-firmware
          path: examples/factory_demo/build/factory_demo_box.bin
