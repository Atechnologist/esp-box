name: ESP32-S3-BOX Factory Demo (Stable WiFi Web Build)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Git safe directory fix
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔐 Inject WiFi credentials (NO HARDCODE)
      - name: Inject WiFi credentials
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🧹 CLEAN BSP CONFLICTS (IMPORTANT FIX)
      - name: Remove broken BSP dependencies
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          # Remove ONLY known problematic drivers
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \;
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \;
          find . -name "idf_component.yml" -exec sed -i '/esp-box-lite/d' {} \;

          # IMPORTANT: do NOT use add-dependency for BSP
          echo "Using factory_demo BSP from sdkconfig only"

          rm -rf managed_components

      # 🛠 BUILD STEP
      - name: Build Factory Demo
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use correct BOX-S3 config (critical)
          cp sdkconfig.ci.box sdkconfig

          # Clean rebuild (avoid cached dependency bugs)
          idf.py fullclean
          rm -rf managed_components
          idf.py reconfigure

          # Optional HTTP server tuning
          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

      # 📦 Merge firmware
      - name: Merge Firmware
        shell: bash
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Stable-Firmware
          path: examples/factory_demo/build/factory_demo_box_s3_stable.bin
