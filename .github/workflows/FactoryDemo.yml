name: Build ESP-BOX Voice Assistant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      - name: Checkout esp-box repo
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box

      - name: Build firmware
        run: |
          cd esp-box/examples/voice_assistant
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: espbox-voice
          path: esp-box/examples/voice_assistant/build/*.bin
