name: ESP32-S3-BOX Factory + Web

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # 1️⃣ Checkout repo (with submodules)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ Debug repo structure (IMPORTANT for path validation)
      - name: Debug Repo Structure
        run: |
          echo "===== ROOT ====="
          ls -l
          echo "===== FULL TREE ====="
          ls -R

      # 4️⃣ Inject custom files (AUTO-DETECT PATH)
      - name: Inject Custom Code
        run: |
          set -e

          echo "🔍 Detecting custom folder..."

          if [ -d "custom/main" ]; then
            SRC="custom/main"
          elif [ -d "esp-box/custom/main" ]; then
            SRC="esp-box/custom/main"
          else
            echo "❌ ERROR: custom/main folder NOT found"
            exit 1
          fi

          echo "✅ Using source: $SRC"
          ls -l $SRC

          echo "🔥 Removing original factory main..."
          rm -rf examples/factory_demo/main/*

          echo "📦 Copying custom files..."
          cp -v $SRC/* examples/factory_demo/main/

          echo "📁 Final main folder:"
          ls -l examples/factory_demo/main/

          echo "🔍 Verifying custom main..."
          grep -r "CUSTOM MAIN" examples/factory_demo/main/ || echo "❌ CUSTOM MAIN NOT FOUND"

      # 5️⃣ Prepare dependencies (CRITICAL FIX)
      - name: Prepare ESP-IDF Dependencies
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          # Remove broken dependency lock
          rm -f dependencies.lock

          # Re-resolve dependencies correctly
          idf.py reconfigure

      # 6️⃣ Build firmware
      - name: Build Firmware
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean build

      # 7️⃣ Merge firmware
      - name: Merge Firmware
        run: |
          set -e

          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_web.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 8️⃣ Upload firmware
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Web
          path: examples/factory_demo/build/factory_demo_web.bin
