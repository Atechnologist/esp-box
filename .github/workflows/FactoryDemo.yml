name: ESP32-S3-BOX Factory Demo Stable Build (Final Fix)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Git safe directory fix
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔐 Inject WiFi credentials safely
      - name: Inject WiFi config
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🧹 REMOVE MISSING COMPONENT DEPENDENCY (AHT20 FIX)
      - name: Remove unsupported components
        run: |
          . $IDF_PATH/export.sh

          # Remove ONLY aht20 references safely
          find . -type f -name "CMakeLists.txt" -exec sed -i '/aht20/d' {} \;
          find . -type f -name "idf_component.yml" -exec sed -i '/aht20/d' {} \;

      # 🧹 Clean build environment (SAFE)
      - name: Clean build artifacts
        run: |
          rm -rf build
          rm -rf managed_components

      # 🛠 Build firmware
      - name: Build Factory Demo
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use correct BOX-S3 configuration
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py reconfigure

          # Safe HTTP tuning
          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

      # 📦 Merge firmware
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_final.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Final-Firmware
          path: examples/factory_demo/build/factory_demo_box_s3_final.bin
      # 📦 Merge firmware binary
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Stable
          path: examples/factory_demo/build/factory_demo_box_s3_stable.bin
