name: ESP32-S3-BOX Factory + Web

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # 1️⃣ Checkout YOUR repo (contains esp-box/custom/main)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory issue
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ Inject your custom files into factory demo
      - name: Inject Custom Code
        run: |
          set -e

          echo "📂 Checking custom files..."
          ls -l esp-box/custom/main/

          echo "🔥 Removing original factory main..."
          rm -rf examples/factory_demo/main/*

          echo "📦 Copying custom files..."
          cp -v esp-box/custom/main/* examples/factory_demo/main/

          echo "📁 Final main folder:"
          ls -l examples/factory_demo/main/

          echo "🔍 Verifying custom main is present..."
          grep -r "CUSTOM MAIN" examples/factory_demo/main/ || echo "❌ CUSTOM MAIN NOT FOUND"

      # 4️⃣ Build firmware
      - name: Build Firmware
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean build

      # 5️⃣ Merge final firmware
      - name: Merge Firmware
        run: |
          set -e

          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_web.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 6️⃣ Upload firmware artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Web
          path: examples/factory_demo/build/factory_demo_web.bin
