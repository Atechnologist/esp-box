name: ESP-BOX-S3 Clean Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util

      - name: Clone ESP-IDF
        run: |
          git clone -b v5.2.2 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf

      - name: Install ESP-IDF
        run: |
          cd $HOME/esp-idf
          ./install.sh

      - name: Export ESP-IDF
        run: |
          echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV

      # 🔥 FULL CLEAN (THIS FIXES YOUR ERROR)
      - name: HARD CLEAN BUILD ENV
        shell: bash
        run: |
          rm -rf build
          rm -rf sdkconfig
          rm -rf dependencies.lock
          rm -rf managed_components
          rm -rf .idf_build_get
          rm -rf .cmake
          rm -rf CMakeCache.txt

      - name: Configure ESP32-S3
        shell: bash
        run: |
          . $HOME/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py reconfigure

      - name: Build firmware
        shell: bash
        run: |
          . $HOME/esp-idf/export.sh
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-s3-firmware
          path: |
            build/*.bin
            build/*.elf
