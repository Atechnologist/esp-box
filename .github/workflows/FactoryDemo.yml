name: ESP32-S3-BOX Factory Demo Stable Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout full repo (with submodules)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Fix Git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔐 Inject WiFi credentials (safe, no BSP impact)
      - name: Inject WiFi credentials
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🧹 SAFE CLEAN (NO YAML editing!)
      - name: Safe project cleanup
        run: |
          . $IDF_PATH/export.sh

          # ONLY remove build artifacts (SAFE)
          rm -rf managed_components
          rm -rf build

      # 🛠 Build factory demo
      - name: Build Firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use official working config for ESP32-S3-BOX
          cp sdkconfig.ci.box sdkconfig

          # Clean rebuild (safe)
          idf.py fullclean
          idf.py reconfigure

          # Enable HTTP server buffer tuning (safe add)
          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

      # 📦 Merge binaries
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-Stable-Firmware
          path: examples/factory_demo/build/factory_demo_box_s3_stable.bin
