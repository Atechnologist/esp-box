name: Build ESP-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container: espressif/idf:release-v5.2

    steps:
      # 1️⃣ Checkout repository (with submodules)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory
      - name: Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ Debug repo structure
      - name: Debug Repo
        run: ls -R

      # 4️⃣ Build factory demo
      - name: Build Factory Demo
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          # Set target
          idf.py set-target esp32s3

          # Use provided config
          cp sdkconfig.ci.box sdkconfig

          # 🔥 CRITICAL STEP: install missing components
          idf.py install-dependencies

          # Clean build
          idf.py fullclean

          # Build project
          idf.py build

      # 5️⃣ Merge binaries into single flashable file
      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 6️⃣ Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-factory-firmware
          path: examples/factory_demo/build/factory_demo.bin
