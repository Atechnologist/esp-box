name: ESP32-S3-BOX Stable Build (Custom Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout YOUR repo
        uses: actions/checkout@v4

      # 🔥 Use official ESP-BOX (THIS IS REQUIRED)
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          path: esp-box
          submodules: recursive

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🔥 Inject ONLY safe custom files
      - name: Inject Custom Files
        shell: bash
        run: |
          set -e
          cp custom/main/main.c esp-box/examples/factory_demo/main/main.c
          cp custom/main/web_server.c esp-box/examples/factory_demo/main/web_server.c
          cp custom/main/web_server.h esp-box/examples/factory_demo/main/web_server.h

      # 🔥 Ensure correct build
      - name: Build Firmware
        shell: bash
        run: |
          set -e
          cd esp-box/examples/factory_demo

          # IMPORTANT: do NOT break component system
          idf.py set-target esp32s3

          rm -rf build
          idf.py fullclean || true

          idf.py build
