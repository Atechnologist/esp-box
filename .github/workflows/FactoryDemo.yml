name: ESP32-S3-BOX Factory Demo (LOCKED STABLE BUILD)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Git safety
      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      # 🔐 WiFi injection (SAFE ONLY FILE)
      - name: Inject WiFi config
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🧹 HARD RULE CLEAN (NO FILE EDITING OF BUILD SYSTEM)
      - name: Clean only build artifacts
        run: |
          rm -rf build
          rm -rf managed_components

      # 🛠 Build
      - name: Build firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # IMPORTANT: do NOT overwrite CMakeLists or BSP files
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py reconfigure

          # safe tuning only
          echo "CONFIG_HTTPD_MAX_REQ_HDR_LEN=1024" >> sdkconfig

          idf.py build

      # 📦 Merge binaries
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_stable.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-STABLE
          path: examples/factory_demo/build/factory_demo_box_s3_stable.bin
