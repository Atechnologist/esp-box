name: Build ESP-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ Use newer IDF that supports esp-box components
    container: espressif/idf:release-v5.2

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Fix git safe directory issue
      - name: Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 3️⃣ Debug structure
      - name: Debug Files
        run: ls -R

      # 4️⃣ Build Factory Demo
      - name: Build
        run: |
          set -e
          . $IDF_PATH/export.sh

          # 🔥 Prevent dependency resolution issues
          export IDF_COMPONENT_MANAGER=1
          export IDF_COMPONENT_CHECK=1

          cd examples/factory_demo

          idf.py set-target esp32s3

          # Use official config
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean

          idf.py build

      # 5️⃣ Merge binaries
      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 6️⃣ Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-factory-firmware
          path: examples/factory_demo/build/factory_demo.bin
