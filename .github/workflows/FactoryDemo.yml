name: Build ESP-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container: espressif/idf:release-v5.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Git Safe Directory
        run: git config --global --add safe.directory '*'

      # ✅ Initialize ESP-IDF environment
      - name: Export ESP-IDF
        run: |
          . $IDF_PATH/export.sh
          idf.py --version

      # ✅ Force component manager to update registry
      - name: Update Component Registry
        run: |
          . $IDF_PATH/export.sh
          idf.py update-components

      # ✅ Install dependencies BEFORE CMake configure
      - name: Install Dependencies
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py install-dependencies

      # ✅ Build
      - name: Build Factory Demo
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py build

      # ✅ Merge firmware
      - name: Merge Firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ✅ Upload artifact
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-factory-firmware
          path: examples/factory_demo/build/factory_demo.bin
