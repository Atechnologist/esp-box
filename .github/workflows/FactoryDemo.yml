name: ESP-IDF Custom Build (ESP-BOX-S3)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev dfu-util

      - name: Clone ESP-IDF
        run: |
          git clone -b v5.2.2 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf

      - name: Install ESP-IDF tools
        run: |
          cd $HOME/esp-idf
          ./install.sh

      - name: Export ESP-IDF
        run: |
          echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV

      - name: Prepare dependencies (esp-box, esp-sr, rainmaker)
        run: |
          . $HOME/esp-idf/export.sh
          idf.py reconfigure

      - name: Set target ESP32-S3
        run: |
          . $HOME/esp-idf/export.sh
          idf.py set-target esp32s3

      - name: Build firmware
        run: |
          . $HOME/esp-idf/export.sh
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-box-s3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
