name: ESP32-S3-BOX Clean Build (Official + Custom)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      # ✅ Checkout your repo
      - name: Checkout user repo
        uses: actions/checkout@v4

      # 🔥 Clone official ESP-BOX
      - name: Clone ESP-BOX
        run: |
          git clone --recursive https://github.com/espressif/esp-box.git esp-box

      # 🔐 Fix git safe directory
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      # 🚀 Build firmware
      - name: Build firmware
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd esp-box/examples/factory_demo

          # Inject your files
          cp $GITHUB_WORKSPACE/custom/main/main.c main/main.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.c main/web_server.c
          cp $GITHUB_WORKSPACE/custom/main/web_server.h main/web_server.h

          # ✅ FIX CMakeLists (YAML-safe)
          cat <<EOF > main/CMakeLists.txt
          idf_component_register(
          SRCS "main.c" "web_server.c"
          INCLUDE_DIRS "."
          )
          EOF

          # Use config
          cp sdkconfig.ci.box sdkconfig

          # Clean build
          idf.py set-target esp32s3
          idf.py fullclean || true

          # Build
          idf.py build

      # 📦 Merge firmware
      - name: Merge firmware
        run: |
          cd esp-box/examples/factory_demo/build
          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp-box/examples/factory_demo/build/factory_demo_box.bin
