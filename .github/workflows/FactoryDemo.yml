name: ESP32-S3-BOX Factory Demo (FINAL STABLE CLEAN)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # 📥 Checkout clean repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 🔧 Git safety
      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      # 🚨 CRITICAL FIX: RESTORE BSP YAML (THIS FIXES YOUR ERROR)
      - name: Restore BSP YAML integrity
        run: |
          echo "Restoring BSP manifest..."
          git checkout -- components/bsp/idf_component.yml || true

          echo "Checking BSP YAML:"
          cat components/bsp/idf_component.yml || true

      # 🧹 CLEAN ONLY BUILD OUTPUT (NEVER TOUCH COMPONENTS)
      - name: Clean build artifacts
        run: |
          rm -rf build
          rm -rf managed_components

      # 🔐 Inject WiFi safely (ONLY USER APP AREA)
      - name: Inject WiFi config
        run: |
          mkdir -p examples/factory_demo/main
          cat <<EOF > examples/factory_demo/main/wifi_config.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASS "${{ secrets.WIFI_PASS }}"
          EOF

      # 🛠 Build firmware
      - name: Build ESP32-S3-BOX firmware
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          # IMPORTANT: use official BOX config
          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # 📦 Merge binaries
      - name: Merge firmware
        run: |
          cd examples/factory_demo/build

          esptool.py --chip esp32s3 merge_bin \
            -o factory_demo_box_s3_final.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # 📤 Upload artifact
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-BOX-FINAL
          path: examples/factory_demo/build/factory_demo_box_s3_final.bin
