name: ESP32-S3-BOX AI WEBUI FIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory
        run: git config --global --add safe.directory '*'

      # =====================================================
      # CLEAN
      # =====================================================

      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =====================================================
      # RESTORE MANIFEST
      # =====================================================

      - name: Restore manifest
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml || true

      - name: Enable component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =====================================================
      # ESPNOW STUB
      # =====================================================

      - name: Add espnow relay stub
        run: |

          cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
          #pragma once

          void espnow_relay_init(void);
          void espnow_relay_broadcast(const char *msg);
          EOF

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'

          #include "espnow_relay.h"
          #include "esp_log.h"

          static const char *TAG = "ESPNOW";

          void espnow_relay_init(void)
          {
              ESP_LOGI(TAG, "Relay stub init");
          }

          void espnow_relay_broadcast(const char *msg)
          {
              if (!msg) return;

              ESP_LOGI(TAG,
                       "Broadcast: %s",
                       msg);
          }

          EOF

      # =====================================================
      # SIMPLE WEB SERVER
      # =====================================================

      - name: Add web server
        run: |

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once

          void web_server_start(void);
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'

          #include "web_server.h"

          #include "esp_http_server.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include "espnow_relay.h"

          static httpd_handle_t server = NULL;

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char *html =
              "<html>"
              "<head>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "</head>"
              "<body style='font-family:sans-serif;background:#111;color:#fff;padding:20px'>"

              "<h1>ESP32-S3-BOX</h1>"

              "<button style='width:200px;height:60px;font-size:20px' "
              "onclick=\"fetch('/light/on')\">LIGHT ON</button><br><br>"

              "<button style='width:200px;height:60px;font-size:20px' "
              "onclick=\"fetch('/light/off')\">LIGHT OFF</button><br><br>"

              "<button style='width:200px;height:60px;font-size:20px' "
              "onclick=\"fetch('/relay/toggle')\">RELAY TOGGLE</button>"

              "</body>"
              "</html>";

              httpd_resp_send(req,
                              html,
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t light_on(httpd_req_t *req)
          {
              app_pwm_led_set_power(true);

              espnow_relay_broadcast("LIGHT:ON");

              httpd_resp_send(req,
                              "OK",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t light_off(httpd_req_t *req)
          {
              app_pwm_led_set_power(false);

              espnow_relay_broadcast("LIGHT:OFF");

              httpd_resp_send(req,
                              "OK",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t relay_toggle(httpd_req_t *req)
          {
              espnow_relay_broadcast("RELAY:TOGGLE");

              httpd_resp_send(req,
                              "OK",
                              HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          void web_server_start(void)
          {
              if (server)
                  return;

              httpd_config_t config =
                  HTTPD_DEFAULT_CONFIG();

              config.stack_size = 8192;

              if (httpd_start(&server,
                              &config) != ESP_OK)
              {
                  return;
              }

              httpd_uri_t root = {
                  .uri = "/",
                  .method = HTTP_GET,
                  .handler = root_handler
              };

              httpd_uri_t on_uri = {
                  .uri = "/light/on",
                  .method = HTTP_GET,
                  .handler = light_on
              };

              httpd_uri_t off_uri = {
                  .uri = "/light/off",
                  .method = HTTP_GET,
                  .handler = light_off
              };

              httpd_uri_t relay_uri = {
                  .uri = "/relay/toggle",
                  .method = HTTP_GET,
                  .handler = relay_toggle
              };

              httpd_register_uri_handler(server,
                                         &root);

              httpd_register_uri_handler(server,
                                         &on_uri);

              httpd_register_uri_handler(server,
                                         &off_uri);

              httpd_register_uri_handler(server,
                                         &relay_uri);

              ESP_LOGI("WEB",
                       "Web server started");
          }

          EOF

      # =====================================================
      # PATCH CMAKE
      # =====================================================

      - name: Patch CMake
        run: |

          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i '/web_server.c/d' $FILE || true
          sed -i '/espnow_relay.c/d' $FILE || true

          sed -i 's/main.c/main.c web_server.c espnow_relay.c/' $FILE

      # =====================================================
      # PATCH MAIN
      # =====================================================

      - name: Patch main
        run: |

          FILE=examples/factory_demo/main/main.c

          sed -i '/web_server.h/d' $FILE || true
          sed -i '/espnow_relay.h/d' $FILE || true

          LAST=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)

          sed -i "${LAST}a\\
          #include \"web_server.h\"\n\
          #include \"espnow_relay.h\"" $FILE

          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/espnow_relay_init()/d' $FILE || true

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(1000));\
          espnow_relay_init();\
          web_server_start();' $FILE

      # =====================================================
      # DISABLE TOUCH ERROR
      # =====================================================

      - name: Disable touch error
        run: |

          find examples/factory_demo -type f \
          -name "*.c" \
          -exec sed -i 's/ESP_LOGE([^;]*Touch not found[^;]*);/ESP_LOGW("PATCH","Touch skipped");/g' {} \; || true

      # =====================================================
      # SDKCONFIG
      # =====================================================

      - name: Patch sdkconfig
        run: |

          cd examples/factory_demo

          echo 'CONFIG_ESP_TASK_WDT=n' >> sdkconfig.ci.box

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build firmware
        run: |

          source $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean

          idf.py reconfigure

          idf.py build

      # =====================================================
      # MERGE BIN
      # =====================================================

      - name: Merge BIN
        run: |

          source $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-webui-fix
          path: examples/factory_demo/build/factory.bin
          retention-days: 30
