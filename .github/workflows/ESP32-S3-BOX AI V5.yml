name: ESP32-S3-BOX AI VOICE + ESP-NOW NODE REGISTRY V6 STABLE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe dir
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true

      # =========================================================
      # VOICE HOOK (UPDATED)
      # =========================================================
      - name: Add voice hook
        run: |

          cat > examples/factory_demo/main/voice_hook.c << 'EOF'
          #include "voice_hook.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include "espnow_relay.h"
          #include "web_server.h"
          #include "esp_wifi.h"

          #include <string.h>

          static const char *TAG = "VOICE";

          static bool has(const char *a, const char *b)
          {
              return a && b && strstr(a,b);
          }

          static void send_channel_sync()
          {
              uint8_t ch;
              wifi_second_chan_t second;

              esp_wifi_get_channel(&ch, &second);

              char msg[32];
              snprintf(msg, sizeof(msg), "SYS:CH:%d", ch);

              espnow_relay_broadcast(msg);
              web_server_log_voice("CHANNEL SYNC SENT");
          }

          void voice_hook_process(const char *phrase)
          {
              if (!phrase) return;

              ESP_LOGI(TAG, "VOICE: %s", phrase);

              // LIGHT (LOCAL)
              if (has(phrase, "light"))
              {
                  if (has(phrase, "on"))
                  {
                      app_pwm_led_set_power(true);
                      web_server_log_voice("LIGHT ON");
                  }
                  if (has(phrase, "off"))
                  {
                      app_pwm_led_set_power(false);
                      web_server_log_voice("LIGHT OFF");
                  }
              }

              // RELAY CONTROL (EXTERNAL)
              if (has(phrase, "relay") || has(phrase, "switch"))
              {
                  if (has(phrase, "on"))
                  {
                      espnow_relay_broadcast("RELAY:ON");
                      send_channel_sync();
                      web_server_log_voice("RELAY ON");
                  }

                  if (has(phrase, "off"))
                  {
                      espnow_relay_broadcast("RELAY:OFF");
                      send_channel_sync();
                      web_server_log_voice("RELAY OFF");
                  }

                  if (has(phrase, "toggle"))
                  {
                      espnow_relay_broadcast("RELAY:TOGGLE");
                      send_channel_sync();
                      web_server_log_voice("RELAY TOGGLE");
                  }
              }
          }
          EOF

      # =========================================================
      # ESPNOW RELAY (MASTER SIDE)
      # =========================================================
      - name: Add espnow relay
        run: |

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
          #include "espnow_relay.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          #include <string.h>

          static const char *TAG = "ESPNOW";
          static const uint8_t BCAST[6] = {0xff,0xff,0xff,0xff,0xff,0xff};

          static bool ready = false;

          static void recv_cb(const esp_now_recv_info_t *info,
                              const uint8_t *data, int len)
          {
              char msg[128] = {0};
              memcpy(msg, data, len < 127 ? len : 127);

              ESP_LOGI(TAG, "RX: %s", msg);

              web_server_log_voice(msg);
          }

          void espnow_relay_broadcast(const char *msg)
          {
              if (!ready || !msg) return;

              esp_now_send(BCAST,
                           (uint8_t*)msg,
                           strlen(msg)+1);
          }

          static void init_task(void *arg)
          {
              uint8_t ch;
              wifi_second_chan_t second;

              while (1)
              {
                  esp_wifi_get_channel(&ch, &second);

                  if (ch != 0) break;

                  vTaskDelay(pdMS_TO_TICKS(500));
              }

              esp_now_init();
              esp_now_register_recv_cb(recv_cb);

              esp_now_peer_info_t peer = {0};
              memcpy(peer.peer_addr, BCAST, 6);
              peer.channel = 0;
              peer.encrypt = false;

              esp_now_add_peer(&peer);

              ready = true;

              ESP_LOGI(TAG, "ESP-NOW READY CH=%d", ch);

              vTaskDelete(NULL);
          }

          void espnow_relay_init(void)
          {
              xTaskCreate(init_task, "espnow", 4096, NULL, 5, NULL);
          }
          EOF

      # =========================================================
      # WEB UI (ADD RELAY BUTTON)
      # =========================================================
      - name: Web UI update
        run: |

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "app_led.h"
          #include "espnow_relay.h"
          #include "node_registry.h"

          static httpd_handle_t server;

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] =
              "<h1>ESP32 BOX</h1>"
              "<button onclick=\"fetch('/light/on')\">Light ON</button>"
              "<button onclick=\"fetch('/light/off')\">Light OFF</button>"
              "<br><br>"
              "<button onclick=\"fetch('/relay/on')\">Relay ON</button>"
              "<button onclick=\"fetch('/relay/off')\">Relay OFF</button>"
              "<button onclick=\"fetch('/relay/toggle')\">Relay TOGGLE</button>";

              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t relay_on(httpd_req_t *req)
          {
              espnow_relay_broadcast("RELAY:ON");
              httpd_resp_send(req,"OK",2);
              return ESP_OK;
          }

          static esp_err_t relay_off(httpd_req_t *req)
          {
              espnow_relay_broadcast("RELAY:OFF");
              httpd_resp_send(req,"OK",2);
              return ESP_OK;
          }

          static esp_err_t relay_toggle(httpd_req_t *req)
          {
              espnow_relay_broadcast("RELAY:TOGGLE");
              httpd_resp_send(req,"OK",2);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t cfg = HTTPD_DEFAULT_CONFIG();
              httpd_start(&server, &cfg);

              httpd_uri_t u[] = {
                  {"/", HTTP_GET, root},
                  {"/relay/on", HTTP_GET, relay_on},
                  {"/relay/off", HTTP_GET, relay_off},
                  {"/relay/toggle", HTTP_GET, relay_toggle},
              };

              for (int i=0;i<3;i++)
                  httpd_register_uri_handler(server, &u[i]);
          }
          EOF

      # =========================================================
      # PATCH MAIN
      # =========================================================

      - name: Patch main
        run: |

          FILE=examples/factory_demo/main/main.c

          sed -i '/voice_hook.h/d' $FILE || true
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/espnow_relay.h/d' $FILE || true
          sed -i '/node_registry.h/d' $FILE || true

          LAST=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)

          sed -i "${LAST}a\\
          #include \"voice_hook.h\"\n\
          #include \"web_server.h\"\n\
          #include \"espnow_relay.h\"\n\
          #include \"node_registry.h\"" $FILE

          sed -i '/voice_hook_init()/d' $FILE || true
          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/espnow_relay_init()/d' $FILE || true
          sed -i '/node_registry_init()/d' $FILE || true

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(1000));\
          node_registry_init();\
          web_server_start();\
          voice_hook_init();\
          espnow_relay_init();' $FILE

      # =========================================================
      # PATCH SR HANDLER
      # =========================================================

      - name: Patch SR handler
        run: |

          FILE=$(find examples/factory_demo \
          -name "app_sr_handler.c" | head -1)

          if [ ! -z "$FILE" ]; then

            if ! grep -q 'voice_hook.h' "$FILE"; then
              sed -i '1i #include "voice_hook.h"' "$FILE"
            fi

            if ! grep -q \
            'voice_hook_process(result->phrase);' \
            "$FILE"; then

              sed -i '/ESP_LOGI.*phrase/a\
              if (result && result->phrase) {\
                  voice_hook_process(result->phrase);\
              }' "$FILE"
            fi
          fi

      # =========================================================
      # PATCH CMAKE
      # =========================================================

      - name: Patch CMake
        run: |

          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i '/voice_hook.c/d' $FILE || true

          sed -i '/SRCS/s/main.c/main.c voice_hook.c web_server.c espnow_relay.c node_registry.c/' $FILE

      # =========================================================
      # SDKCONFIG
      # =========================================================

      - name: Patch sdkconfig
        run: |
          cd examples/factory_demo
          echo 'CONFIG_ESP_TASK_WDT=n' >> sdkconfig.ci.box

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build
        run: |

          source $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean

          idf.py reconfigure

          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================

      - name: Merge binary
        run: |

          source $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-ai-relay-stable
          path: examples/factory_demo/build/factory.bin
          retention-days: 30
