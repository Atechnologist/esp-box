name: ESP32-S3-BOX INDUSTRIAL RELAY HUB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe dir
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =========================================================
      # FORCE ESP32-S3-BOX
      # =========================================================

      - name: Force ESP32-S3-BOX
        run: |
          cd examples/factory_demo

          sed -i '/CONFIG_ESP_BOX_3/d' sdkconfig.ci.box || true
          echo "CONFIG_ESP_BOX_3=n" >> sdkconfig.ci.box

      # =========================================================
      # VOICE HOOK
      # =========================================================

      - name: Add voice hook
        run: |

          cat > examples/factory_demo/main/voice_hook.h << 'EOF'
          #pragma once

          void voice_hook_init(void);
          void voice_hook_process(const char *phrase);
          EOF

          cat > examples/factory_demo/main/voice_hook.c << 'EOF'
          #include "voice_hook.h"

          #include "esp_log.h"
          #include "app_led.h"
          #include "espnow_relay.h"
          #include "web_server.h"

          #include <string.h>

          static const char *TAG = "VOICE";

          static int has(const char *a, const char *b)
          {
              if (!a || !b) return 0;
              return strstr(a, b) != NULL;
          }

          void voice_hook_init(void)
          {
              ESP_LOGI(TAG, "Voice ready");
          }

          void voice_hook_process(const char *phrase)
          {
              if (!phrase) return;

              ESP_LOGI(TAG, "VOICE: %s", phrase);
              web_server_log_voice(phrase);

              // =====================================================
              // LIGHT
              // =====================================================

              if (has(phrase, "light"))
              {
                  if (has(phrase, "on"))
                  {
                      app_pwm_led_set_power(true);
                      espnow_relay_broadcast("LIGHT:ON");
                      web_server_log_voice("VOICE LIGHT ON");
                  }

                  if (has(phrase, "off"))
                  {
                      app_pwm_led_set_power(false);
                      espnow_relay_broadcast("LIGHT:OFF");
                      web_server_log_voice("VOICE LIGHT OFF");
                  }
              }

              // =====================================================
              // SWITCH / RELAY
              // =====================================================

              if (has(phrase, "switch") ||
                  has(phrase, "relay"))
              {
                  if (has(phrase, "on"))
                  {
                      espnow_relay_broadcast("RELAY:ON");
                      web_server_log_voice("VOICE RELAY ON");
                  }

                  if (has(phrase, "off"))
                  {
                      espnow_relay_broadcast("RELAY:OFF");
                      web_server_log_voice("VOICE RELAY OFF");
                  }

                  if (has(phrase, "toggle"))
                  {
                      espnow_relay_broadcast("RELAY:TOGGLE");
                      web_server_log_voice("VOICE RELAY TOGGLE");
                  }
              }
          }
          EOF

      # =========================================================
      # NODE REGISTRY
      # =========================================================

      - name: Add node registry
        run: |

          cat > examples/factory_demo/main/node_registry.h << 'EOF'
          #pragma once

          void node_registry_init(void);
          void node_registry_add(const char *node);
          const char **node_registry_get_all(int *count);
          EOF

          cat > examples/factory_demo/main/node_registry.c << 'EOF'
          #include "node_registry.h"

          #include <string.h>

          #define MAX_NODES 20

          static char nodes[MAX_NODES][32];
          static const char *ptrs[MAX_NODES];
          static int count = 0;

          void node_registry_init(void)
          {
              memset(nodes, 0, sizeof(nodes));
              count = 0;
          }

          void node_registry_add(const char *node)
          {
              if (!node) return;

              for (int i = 0; i < count; i++)
              {
                  if (strcmp(nodes[i], node) == 0)
                      return;
              }

              if (count >= MAX_NODES)
                  return;

              strncpy(nodes[count], node, 31);

              ptrs[count] = nodes[count];

              count++;
          }

          const char **node_registry_get_all(int *c)
          {
              if (c) *c = count;
              return ptrs;
          }
          EOF

      # =========================================================
      # ESPNOW RELAY
      # =========================================================

      - name: Add espnow relay
        run: |

          cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
          #pragma once

          void espnow_relay_init(void);
          void espnow_relay_broadcast(const char *msg);
          EOF

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
          #include "espnow_relay.h"

          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"

          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"

          #include "node_registry.h"
          #include "web_server.h"

          #include <string.h>
          #include <stdio.h>
          #include <stdlib.h>

          static const char *TAG = "ESPNOW";

          static const uint8_t BCAST[6] =
          {
              0xff,0xff,0xff,0xff,0xff,0xff
          };

          static bool ready = false;

          static void recv_cb(
              const esp_now_recv_info_t *info,
              const uint8_t *data,
              int len)
          {
              char msg[128] = {0};

              memcpy(msg,
                     data,
                     len < sizeof(msg)-1 ?
                     len : sizeof(msg)-1);

              ESP_LOGI(TAG, "RX: %s", msg);

              web_server_log_voice(msg);

              if (strncmp(msg, "NODE:", 5) == 0)
              {
                  node_registry_add(msg + 5);
              }

              // INDUSTRIAL CHANNEL LOCK
              if (strncmp(msg, "CH:", 3) == 0)
              {
                  int ch = atoi(msg + 3);

                  if (ch > 0 && ch < 14)
                  {
                      ESP_LOGI(TAG,
                               "LOCK CHANNEL %d",
                               ch);

                      esp_wifi_set_channel(
                          ch,
                          WIFI_SECOND_CHAN_NONE);
                  }
              }
          }

          static void espnow_task(void *arg)
          {
              uint8_t primary = 0;
              wifi_second_chan_t second;

              while (primary == 0)
              {
                  vTaskDelay(pdMS_TO_TICKS(1000));

                  esp_wifi_get_channel(
                      &primary,
                      &second);
              }

              ESP_LOGI(TAG,
                       "WiFi locked channel %d",
                       primary);

              web_server_log_voice(
                  "ESP-NOW START");

              if (esp_now_init() != ESP_OK)
              {
                  ESP_LOGE(TAG,
                           "esp_now_init failed");

                  vTaskDelete(NULL);
                  return;
              }

              esp_now_register_recv_cb(recv_cb);

              esp_now_peer_info_t peer = {0};

              memcpy(peer.peer_addr,
                     BCAST,
                     6);

              peer.channel = 0;
              peer.encrypt = false;

              esp_now_add_peer(&peer);

              ready = true;

              while (1)
              {
                  char chmsg[16];

                  snprintf(chmsg,
                           sizeof(chmsg),
                           "CH:%d",
                           primary);

                  esp_now_send(BCAST,
                               (uint8_t *)chmsg,
                               strlen(chmsg)+1);

                  esp_now_send(BCAST,
                               (uint8_t *)"HB",
                               3);

                  ESP_LOGI(TAG,
                           "HB CH%d",
                           primary);

                  vTaskDelay(
                      pdMS_TO_TICKS(3000));
              }
          }

          void espnow_relay_init(void)
          {
              xTaskCreate(
                  espnow_task,
                  "espnow_task",
                  4096,
                  NULL,
                  5,
                  NULL);
          }

          void espnow_relay_broadcast(const char *msg)
          {
              if (!ready || !msg)
                  return;

              ESP_LOGI(TAG,
                       "Broadcast: %s",
                       msg);

              esp_now_send(
                  BCAST,
                  (const uint8_t *)msg,
                  strlen(msg)+1);
          }
          EOF

      # =========================================================
      # WEB SERVER
      # =========================================================

      - name: Add web server
        run: |

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once

          void web_server_start(void);
          void web_server_log_voice(const char *msg);
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"

          #include "esp_http_server.h"
          #include "esp_log.h"

          #include "app_led.h"
          #include "espnow_relay.h"

          #include <string.h>
          #include <stdio.h>

          static httpd_handle_t server = NULL;

          #define LOG_SIZE 4096

          static char logbuf[LOG_SIZE] =
              "-- log start --\n";

          void web_server_log_voice(const char *msg)
          {
              if (!msg) return;

              strncat(logbuf,
                      msg,
                      LOG_SIZE -
                      strlen(logbuf) - 2);

              strcat(logbuf, "\n");
          }

          static esp_err_t root_handler(
              httpd_req_t *req)
          {
              const char *html =
              "<html>"
              "<body style='font-family:sans-serif'>"

              "<h1>ESP32-S3-BOX INDUSTRIAL</h1>"

              "<button onclick=\"fetch('/light/on')\">"
              "Light ON</button>"

              "<button onclick=\"fetch('/light/off')\">"
              "Light OFF</button>"

              "<br><br>"

              "<button onclick=\"fetch('/relay/on')\">"
              "Relay ON</button>"

              "<button onclick=\"fetch('/relay/off')\">"
              "Relay OFF</button>"

              "<button onclick=\"fetch('/relay/toggle')\">"
              "Relay Toggle</button>"

              "<br><br>"

              "<pre id='log'>Loading...</pre>"

              "<script>"

              "function upd(){"

              "fetch('/log')"
              ".then(r=>r.text())"
              ".then(t=>{"
              "document.getElementById('log').innerText=t;"
              "});"

              "}"

              "setInterval(upd,2000);"
              "upd();"

              "</script>"

              "</body>"
              "</html>";

              httpd_resp_send(
                  req,
                  html,
                  HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          static esp_err_t light_on(
              httpd_req_t *req)
          {
              app_pwm_led_set_power(true);

              espnow_relay_broadcast(
                  "LIGHT:ON");

              web_server_log_voice(
                  "WEB LIGHT ON");

              httpd_resp_send(req,
                              "OK",
                              2);

              return ESP_OK;
          }

          static esp_err_t light_off(
              httpd_req_t *req)
          {
              app_pwm_led_set_power(false);

              espnow_relay_broadcast(
                  "LIGHT:OFF");

              web_server_log_voice(
                  "WEB LIGHT OFF");

              httpd_resp_send(req,
                              "OK",
                              2);

              return ESP_OK;
          }

          static esp_err_t relay_on(
              httpd_req_t *req)
          {
              espnow_relay_broadcast(
                  "RELAY:ON");

              web_server_log_voice(
                  "WEB RELAY ON");

              httpd_resp_send(req,
                              "OK",
                              2);

              return ESP_OK;
          }

          static esp_err_t relay_off(
              httpd_req_t *req)
          {
              espnow_relay_broadcast(
                  "RELAY:OFF");

              web_server_log_voice(
                  "WEB RELAY OFF");

              httpd_resp_send(req,
                              "OK",
                              2);

              return ESP_OK;
          }

          static esp_err_t relay_toggle(
              httpd_req_t *req)
          {
              espnow_relay_broadcast(
                  "RELAY:TOGGLE");

              web_server_log_voice(
                  "WEB RELAY TOGGLE");

              httpd_resp_send(req,
                              "OK",
                              2);

              return ESP_OK;
          }

          static esp_err_t log_handler(
              httpd_req_t *req)
          {
              httpd_resp_send(
                  req,
                  logbuf,
                  HTTPD_RESP_USE_STRLEN);

              return ESP_OK;
          }

          void web_server_start(void)
          {
              if (server) return;

              httpd_config_t cfg =
                  HTTPD_DEFAULT_CONFIG();

              cfg.stack_size = 8192;

              httpd_start(&server,
                          &cfg);

              httpd_uri_t root = {
                  .uri="/",
                  .method=HTTP_GET,
                  .handler=root_handler
              };

              httpd_uri_t l1 = {
                  .uri="/light/on",
                  .method=HTTP_GET,
                  .handler=light_on
              };

              httpd_uri_t l2 = {
                  .uri="/light/off",
                  .method=HTTP_GET,
                  .handler=light_off
              };

              httpd_uri_t r1 = {
                  .uri="/relay/on",
                  .method=HTTP_GET,
                  .handler=relay_on
              };

              httpd_uri_t r2 = {
                  .uri="/relay/off",
                  .method=HTTP_GET,
                  .handler=relay_off
              };

              httpd_uri_t r3 = {
                  .uri="/relay/toggle",
                  .method=HTTP_GET,
                  .handler=relay_toggle
              };

              httpd_uri_t lg = {
                  .uri="/log",
                  .method=HTTP_GET,
                  .handler=log_handler
              };

              httpd_register_uri_handler(server,&root);
              httpd_register_uri_handler(server,&l1);
              httpd_register_uri_handler(server,&l2);
              httpd_register_uri_handler(server,&r1);
              httpd_register_uri_handler(server,&r2);
              httpd_register_uri_handler(server,&r3);
              httpd_register_uri_handler(server,&lg);

              ESP_LOGI("WEB",
                       "Web server started");
          }
          EOF

      # =========================================================
      # PATCH CMAKE
      # =========================================================

      - name: Patch CMake
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt

          sed -i '/voice_hook.c/d' $FILE || true

          sed -i 's/main.c/main.c voice_hook.c web_server.c espnow_relay.c node_registry.c/' $FILE

      # =========================================================
      # PATCH MAIN
      # =========================================================

      - name: Patch main
        run: |

          FILE=examples/factory_demo/main/main.c

          sed -i '/voice_hook.h/d' $FILE || true
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/espnow_relay.h/d' $FILE || true

          LAST=$(grep -n "^#include" $FILE | tail -1 | cut -d: -f1)

          sed -i "${LAST}a #include \"voice_hook.h\"" $FILE
          sed -i "${LAST}a #include \"web_server.h\"" $FILE
          sed -i "${LAST}a #include \"espnow_relay.h\"" $FILE

          sed -i '/voice_hook_init()/d' $FILE || true
          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/espnow_relay_init()/d' $FILE || true

          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(1000));\
          web_server_start();\
          voice_hook_init();\
          espnow_relay_init();' $FILE

      # =========================================================
      # PATCH SR HANDLER
      # =========================================================

      - name: Patch SR handler
        run: |

          FILE=$(find examples/factory_demo \
                 -name "app_sr_handler.c" | head -1)

          if [ ! -z "$FILE" ]; then

            if ! grep -q 'voice_hook.h' "$FILE"; then
              sed -i '1i #include "voice_hook.h"' "$FILE"
            fi

            if ! grep -q 'voice_hook_process(result->phrase);' "$FILE"; then

              sed -i '/ESP_LOGI.*phrase/a\
              if (result && result->phrase) {\
                  voice_hook_process(result->phrase);\
              }' "$FILE"

            fi
          fi

      # =========================================================
      # SDKCONFIG
      # =========================================================

      - name: Patch sdkconfig
        run: |
          cd examples/factory_demo
          echo 'CONFIG_ESP_TASK_WDT=n' >> sdkconfig.ci.box

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          idf.py fullclean
          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================

      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh

          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
 
      # =========================================================
      # NODE REGISTRY
      # =========================================================
      - name: Node registry
        run: |

          cat > examples/factory_demo/main/node_registry.h << 'EOF'
          #pragma once
          void node_registry_init(void);
          void node_registry_add(const char *node);
          const char **node_registry_get_all(int *count);
          EOF

          cat > examples/factory_demo/main/node_registry.c << 'EOF'
          #include "node_registry.h"
          #include <string.h>

          #define MAX 20

          static char nodes[MAX][32];
          static const char *ptr[MAX];
          static int cnt=0;

          void node_registry_init(){ cnt=0; }

          void node_registry_add(const char *n)
          {
              if(!n) return;

              for(int i=0;i<cnt;i++)
                  if(!strcmp(nodes[i],n)) return;

              if(cnt>=MAX) return;

              strncpy(nodes[cnt],n,31);
              ptr[cnt]=nodes[cnt];
              cnt++;
          }

          const char **node_registry_get_all(int *c)
          {
              if(c) *c=cnt;
              return ptr;
          }
          EOF

      # =========================================================
      # ESPNOW (INDUSTRIAL FIX)
      # =========================================================
      - name: ESPNOW relay
        run: |

          cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
          #pragma once
          void espnow_relay_init(void);
          void espnow_relay_broadcast(const char *msg);
          EOF

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
          #include "espnow_relay.h"
          #include "node_registry.h"
          #include "web_server.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include <string.h>

          static const uint8_t BCAST[6]={0xff,0xff,0xff,0xff,0xff,0xff};
          static bool ready=false;
          static uint8_t master[6]={0};

          static void recv(const esp_now_recv_info_t *info,
                           const uint8_t *data,int len)
          {
              char msg[128]={0};
              memcpy(msg,data,len<127?len:127);

              if(!master[0])
                  memcpy(master,info->src_addr,6);

              /* CHANNEL SYNC */
              if(strncmp(msg,"CH:",3)==0)
              {
                  uint8_t ch=atoi(msg+3);
                  wifi_set_channel(ch);
                  web_server_log_voice("CH SYNC");
                  return;
              }

              if(strcmp(msg,"HB")==0)
              {
                  web_server_log_voice("HB");
                  return;
              }

              if(strncmp(msg,"NODE:",5)==0)
                  node_registry_add(msg+5);

              web_server_log_voice(msg);
          }

          static void task(void *p)
          {
              uint8_t ch=0;
              wifi_second_chan_t s;

              while(ch==0)
              {
                  vTaskDelay(500/portTICK_PERIOD_MS);
                  esp_wifi_get_channel(&ch,&s);
              }

              esp_now_init();
              esp_now_register_recv_cb(recv);

              esp_now_peer_info_t peer={0};
              memcpy(peer.peer_addr,BCAST,6);
              peer.channel=0;
              esp_now_add_peer(&peer);

              ready=true;
              web_server_log_voice("ESP-NOW READY");

              while(1)
              {
                  esp_now_send(BCAST,(uint8_t*)"HB",3);
                  vTaskDelay(3000/portTICK_PERIOD_MS);
              }
          }

          void espnow_relay_init()
          {
              xTaskCreate(task,"espnow",4096,NULL,5,NULL);
          }

          void espnow_relay_broadcast(const char *msg)
          {
              if(!ready) return;
              esp_now_send(BCAST,(uint8_t*)msg,strlen(msg)+1);
          }
          EOF

      # =========================================================
      # WEB UI (STABLE + RELAY BUTTON FIXED)
      # =========================================================
      - name: Web server
        run: |

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "esp_http_server.h"
          #include "espnow_relay.h"
          #include "app_led.h"
          #include "node_registry.h"
          #include <string.h>

          static httpd_handle_t s=NULL;
          static char logbuf[2048]="--log--\n";

          void web_server_log_voice(const char *m)
          {
              if(!m) return;
              strncat(logbuf,m,2000-strlen(logbuf)-2);
              strcat(logbuf,"\n");
          }

          static esp_err_t root(httpd_req_t *r)
          {
              char html[2048];

              snprintf(html,sizeof(html),

              "<h1>ESP32-S3 BOX INDUSTRIAL</h1>"

              "<button onclick=\"fetch('/light/on')\">Light ON</button>"
              "<button onclick=\"fetch('/light/off')\">Light OFF</button>"

              "<button onclick=\"fetch('/relay/toggle')\">Relay TOGGLE</button>"

              "<pre id=log></pre>"
              "<script>"
              "setInterval(()=>{fetch('/log').then(r=>r.text()).then(t=>log.innerText=t)},2000)"
              "</script>");

              httpd_resp_send(r,html,HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t relay_toggle(httpd_req_t *r)
          {
              espnow_relay_broadcast("RELAY:TOGGLE");
              web_server_log_voice("WEB RELAY");
              return httpd_resp_send(r,"OK",2);
          }

          static esp_err_t light_on(httpd_req_t *r)
          {
              app_pwm_led_set_power(true);
              espnow_relay_broadcast("LIGHT:ON");
              return httpd_resp_send(r,"OK",2);
          }

          static esp_err_t light_off(httpd_req_t *r)
          {
              app_pwm_led_set_power(false);
              espnow_relay_broadcast("LIGHT:OFF");
              return httpd_resp_send(r,"OK",2);
          }

          static esp_err_t log(httpd_req_t *r)
          {
              return httpd_resp_send(r,logbuf,HTTPD_RESP_USE_STRLEN);
          }

          void web_server_start()
          {
              httpd_config_t c=HTTPD_DEFAULT_CONFIG();
              httpd_start(&s,&c);

              httpd_uri_t u[]={
                  {"/",HTTP_GET,root},
                  {"/light/on",HTTP_GET,light_on},
                  {"/light/off",HTTP_GET,light_off},
                  {"/relay/toggle",HTTP_GET,relay_toggle},
                  {"/log",HTTP_GET,log}
              };

              for(int i=0;i<4;i++)
                  httpd_register_uri_handler(s,&u[i]);
          }
          EOF

      # =========================================================
      # MAIN PATCH
      # =========================================================
      - name: main patch
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/voice_hook.h/d' $FILE || true
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/espnow_relay.h/d' $FILE || true

          LAST=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)

          sed -i "${LAST}a\\
#include \"voice_hook.h\"\\n#include \"web_server.h\"\\n#include \"espnow_relay.h\"" $FILE

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================
      - name: Merge
        run: |
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin -o factory.bin --flash_mode dio --flash_size 16MB $(cat flash_args)

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-industrial
          path: examples/factory_demo/build/factory.bin
