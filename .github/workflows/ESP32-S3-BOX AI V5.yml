#include "web_server.h"

#include "esp_http_server.h"
#include "esp_log.h"
#include "esp_app_desc.h"

#include "app_led.h"
#include "node_registry.h"
#include "espnow_relay.h"

#include <stdio.h>
#include <string.h>

static const char *TAG = "WEB";

static httpd_handle_t server = NULL;

#define LOG_SIZE 2048

static char voice_log[LOG_SIZE] =
    "-- log start --\n";

void web_server_log_voice(const char *msg)
{
    if (!msg) return;

    size_t cur  = strlen(voice_log);
    size_t mlen = strlen(msg);

    if (cur + mlen + 4 >= LOG_SIZE)
    {
        size_t remove = (mlen + 32);

        if (remove > cur)
            remove = cur;

        memmove(voice_log,
                voice_log + remove,
                cur - remove + 1);

        cur = strlen(voice_log);
    }

    strncat(voice_log,
            msg,
            LOG_SIZE - cur - 2);

    strncat(voice_log,
            "\n",
            LOG_SIZE - strlen(voice_log) - 1);
}

/* ===================================================== */

static esp_err_t root_handler(httpd_req_t *req)
{
    const esp_app_desc_t *app =
        esp_app_get_description();

    char html[8192];

    int count = 0;

    const char **nodes =
        node_registry_get_all(&count);

    char node_html[1024] = "";

    for (int i = 0; i < count; i++)
    {
        char row[128];

        snprintf(row,
                 sizeof(row),
                 "<tr><td>%d</td><td>%s</td></tr>",
                 i + 1,
                 nodes[i]);

        strncat(node_html,
                row,
                sizeof(node_html) -
                strlen(node_html) - 1);
    }

    if (count == 0)
    {
        strcpy(node_html,
               "<tr><td colspan='2'>No nodes</td></tr>");
    }

    snprintf(html,
             sizeof(html),

"<!DOCTYPE html>"
"<html>"
"<head>"
"<meta charset='utf-8'>"
"<title>ESP32-S3-BOX</title>"

"<style>"
"body{font-family:sans-serif;background:#111;color:#eee;padding:20px}"
"button{padding:12px 18px;margin:4px;font-size:16px}"
"table{border-collapse:collapse;width:100%%}"
"td,th{border:1px solid #444;padding:8px}"
"pre{background:#222;padding:10px;overflow:auto}"
"</style>"

"</head>"
"<body>"

"<h1>ESP32-S3-BOX AI</h1>"

"<p>Firmware: %s</p>"

"<button onclick=\"fetch('/on')\">Light ON</button>"
"<button onclick=\"fetch('/off')\">Light OFF</button>"

"<br><br>"

"<button onclick=\"fetch('/relay_on')\">Relay ON</button>"
"<button onclick=\"fetch('/relay_off')\">Relay OFF</button>"
"<button onclick=\"fetch('/relay_toggle')\">Relay Toggle</button>"

"<br><br>"

"<button onclick=\"fetch('/ping')\">PING</button>"

"<h2>Nodes (%d)</h2>"

"<table>"
"<tr><th>#</th><th>Node</th></tr>"
"%s"
"</table>"

"<h2>Event Log</h2>"

"<pre>%s</pre>"

"</body>"
"</html>",

app->version,
count,
node_html,
voice_log);

    httpd_resp_set_type(req, "text/html");

    httpd_resp_send(req,
                    html,
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

/* ===================================================== */

static esp_err_t on_handler(httpd_req_t *req)
{
    app_pwm_led_set_power(true);

    httpd_resp_send(req,
                    "ON",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

static esp_err_t off_handler(httpd_req_t *req)
{
    app_pwm_led_set_power(false);

    httpd_resp_send(req,
                    "OFF",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

static esp_err_t relay_on_handler(httpd_req_t *req)
{
    espnow_relay_broadcast("RELAY:ON");

    web_server_log_voice("WEB RELAY ON");

    httpd_resp_send(req,
                    "Relay ON",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

static esp_err_t relay_off_handler(httpd_req_t *req)
{
    espnow_relay_broadcast("RELAY:OFF");

    web_server_log_voice("WEB RELAY OFF");

    httpd_resp_send(req,
                    "Relay OFF",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

static esp_err_t relay_toggle_handler(httpd_req_t *req)
{
    espnow_relay_broadcast("RELAY:TOGGLE");

    web_server_log_voice("WEB RELAY TOGGLE");

    httpd_resp_send(req,
                    "Relay Toggle",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

static esp_err_t ping_handler(httpd_req_t *req)
{
    espnow_relay_broadcast("PING");

    web_server_log_voice("PING");

    httpd_resp_send(req,
                    "PING",
                    HTTPD_RESP_USE_STRLEN);

    return ESP_OK;
}

/* ===================================================== */

void web_server_start(void)
{
    if (server)
        return;

    httpd_config_t cfg =
        HTTPD_DEFAULT_CONFIG();

    cfg.stack_size = 8192;
    cfg.max_uri_handlers = 16;

    if (httpd_start(&server, &cfg) != ESP_OK)
    {
        ESP_LOGE(TAG,
                 "httpd failed");

        return;
    }

    httpd_uri_t uris[] =
    {
        {
            .uri="/",
            .method=HTTP_GET,
            .handler=root_handler
        },

        {
            .uri="/on",
            .method=HTTP_GET,
            .handler=on_handler
        },

        {
            .uri="/off",
            .method=HTTP_GET,
            .handler=off_handler
        },

        {
            .uri="/relay_on",
            .method=HTTP_GET,
            .handler=relay_on_handler
        },

        {
            .uri="/relay_off",
            .method=HTTP_GET,
            .handler=relay_off_handler
        },

        {
            .uri="/relay_toggle",
            .method=HTTP_GET,
            .handler=relay_toggle_handler
        },

        {
            .uri="/ping",
            .method=HTTP_GET,
            .handler=ping_handler
        },
    };

    for (int i = 0;
         i < sizeof(uris)/sizeof(uris[0]);
         i++)
    {
        httpd_register_uri_handler(server,
                                   &uris[i]);
    }

    ESP_LOGI(TAG,
             "Web server started");
}
