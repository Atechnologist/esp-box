name: ESP32-S3-BOX PRODUCTION BUILD (Voice + ESPNOW + MQTT + WebUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ✅ FIX ALL MISSING COMPONENTS HERE
      - name: Fix dependencies (ESP-NOW + sensors)
        run: |
          cat > examples/factory_demo/main/idf_component.yml << 'EOF'
          dependencies:
            espressif/esp-now: "==2.1.0"
            espressif/aht20: ">=1.0.0"
            espressif/at581x: ">=1.0.0"
          EOF

      # ---------------------------
      # SYSTEM STATE
      # ---------------------------
      - name: Add system state
        run: |
          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include <stdbool.h>

          static bool started = false;

          void system_start_services(void)
          {
              if (started) return;
              started = true;
          }

          bool system_is_started(void)
          {
              return started;
          }
          EOF

          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          void system_start_services(void);
          bool system_is_started(void);
          EOF

      # ---------------------------
      # COMMAND ROUTER
      # ---------------------------
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "mqtt_bridge.h"
          #include "espnow_bridge.h"
          #include "app_led.h"
          #include <string.h>

          void command_router_execute(const char *cmd)
          {
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
              }
              else if (strcmp(cmd, "REMOTE_ON") == 0) {
                  mqtt_bridge_publish("esp32/relay", "on");
              }
              else if (strcmp(cmd, "ESPNOW_ON") == 0) {
                  espnow_send_command("ON");
              }
          }
          EOF

          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          void command_router_execute(const char *cmd);
          EOF

      # ---------------------------
      # ESPNOW
      # ---------------------------
      - name: Add ESPNOW bridge
        run: |
          cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
          #include "espnow_bridge.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include <string.h>

          static uint8_t peer_mac[] = {0x24,0x6F,0x28,0xAA,0xBB,0xCC};

          void espnow_init(void)
          {
              esp_wifi_start();
              esp_now_init();

              esp_now_peer_info_t peer = {0};
              memcpy(peer.peer_addr, peer_mac, 6);
              esp_now_add_peer(&peer);
          }

          void espnow_send_command(const char *cmd)
          {
              esp_now_send(peer_mac, (uint8_t *)cmd, strlen(cmd));
          }
          EOF

          cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
          #pragma once
          void espnow_init(void);
          void espnow_send_command(const char *cmd);
          EOF

      # ---------------------------
      # STUB MODULES (SAFE)
      # ---------------------------
      - name: Add stubs
        run: |
          echo '#pragma once\nvoid mqtt_bridge_start(void);void mqtt_bridge_publish(const char*,const char*);' > examples/factory_demo/main/mqtt_bridge.h
          echo 'void mqtt_bridge_start(void){} void mqtt_bridge_publish(const char*a,const char*b){}' > examples/factory_demo/main/mqtt_bridge.c

          echo '#pragma once\nvoid web_server_start(void);' > examples/factory_demo/main/web_server.h
          echo 'void web_server_start(void){}' > examples/factory_demo/main/web_server.c

          echo '#pragma once\nvoid ap_fallback_init(void);' > examples/factory_demo/main/ap_fallback.h
          echo 'void ap_fallback_init(void){}' > examples/factory_demo/main/ap_fallback.c

      # ---------------------------
      # PATCH CMAKE
      # ---------------------------
      - name: Patch CMakeLists.txt
        run: |
          sed -i 's/main.c/main.c system_state.c command_router.c espnow_bridge.c mqtt_bridge.c web_server.c ap_fallback.c/' \
          examples/factory_demo/main/CMakeLists.txt

      # ---------------------------
      # PATCH MAIN
      # ---------------------------
      - name: Patch main.c
        run: |
          sed -i '1i #include "system_state.h"\n#include "espnow_bridge.h"' \
          examples/factory_demo/main/main.c

          sed -i 's/app_rmaker_start();/app_rmaker_start();\n    system_start_services();\n    espnow_init();/' \
          examples/factory_demo/main/main.c

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            @flash_args

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-voice-router
          path: examples/factory_demo/build/factory_merged.bin
