name: ESP32-S3-BOX PRODUCTION BUILD (3-Layer Voice + ESP-NOW + MQTT + WebUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

    # =========================
    # CHECKOUT
    # =========================
    - name: Checkout ESP-BOX
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-box
        submodules: recursive
        fetch-depth: 0

    - name: Safe directory fix
      run: git config --global --add safe.directory '*'

    # =========================
    # CLEAN
    # =========================
    - name: Clean build
      run: rm -rf examples/factory_demo/build || true

    # =========================
    # COMPONENT MANAGER
    # =========================
    - name: Enable Component Manager
      run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

    # =========================================================
    # LAYER 1 — CORE SYSTEM (BOOT SAFE)
    # =========================================================

    - name: Core system layer
      run: |
        mkdir -p examples/factory_demo/main/core

        cat > examples/factory_demo/main/system_state.c << 'EOF'
        #include "system_state.h"
        #include <stdbool.h>

        static bool started = false;

        void system_start_services(void)
        {
            if (started) return;
            started = true;
        }

        bool system_is_started(void)
        {
            return started;
        }
        EOF

        cat > examples/factory_demo/main/system_state.h << 'EOF'
        #pragma once
        void system_start_services(void);
        bool system_is_started(void);
        EOF

        cat > examples/factory_demo/main/command_router.c << 'EOF'
        #include "command_router.h"
        #include "mqtt_bridge.h"
        #include "espnow_bridge.h"
        #include "app_led.h"
        #include <string.h>

        void command_router_execute(const char *cmd)
        {
            if (!cmd) return;

            if (strcmp(cmd, "LED_ON") == 0)
                app_pwm_led_set_power(true);

            else if (strcmp(cmd, "LED_OFF") == 0)
                app_pwm_led_set_power(false);

            else if (strcmp(cmd, "MQTT_ON") == 0)
                mqtt_bridge_publish("box/cmd", "on");

            else if (strcmp(cmd, "ESPNOW_ON") == 0)
                espnow_send_command("ON");
        }
        EOF

        cat > examples/factory_demo/main/command_router.h << 'EOF'
        #pragma once
        void command_router_execute(const char *cmd);
        EOF

    # =========================================================
    # LAYER 2 — NETWORK + CONTROL
    # =========================================================

    - name: Network layer (MQTT + ESP-NOW + WebUI + AP)
      run: |

        # -------- MQTT --------
        cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
        #include "mqtt_bridge.h"
        void mqtt_bridge_start(void) {}
        void mqtt_bridge_publish(const char *topic, const char *data) {}
        EOF

        cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
        #pragma once
        void mqtt_bridge_start(void);
        void mqtt_bridge_publish(const char *, const char *);
        EOF

        # -------- ESP-NOW (FIXED + SAFE) --------
        cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
        #include "espnow_bridge.h"
        #include "esp_now.h"
        #include "esp_wifi.h"
        #include "esp_log.h"
        #include <string.h>

        static const char *TAG = "ESPNOW";
        static uint8_t peer[] = {0x24,0x6F,0x28,0xAA,0xBB,0xCC};

        void espnow_init(void)
        {
            esp_wifi_start();
            esp_now_init();

            esp_now_peer_info_t p = {0};
            memcpy(p.peer_addr, peer, 6);
            p.channel = 0;
            p.encrypt = false;
            esp_now_add_peer(&p);
        }

        void espnow_send_command(const char *cmd)
        {
            esp_now_send(peer, (uint8_t*)cmd, strlen(cmd));
        }
        EOF

        cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
        #pragma once
        void espnow_init(void);
        void espnow_send_command(const char *);
        EOF

        # -------- WEB UI (RESTORED) --------
        cat > examples/factory_demo/main/web_server.c << 'EOF'
        #include "web_server.h"
        void web_server_start(void) {}
        EOF

        cat > examples/factory_demo/main/web_server.h << 'EOF'
        #pragma once
        void web_server_start(void);
        EOF

        # -------- AP FALLBACK --------
        cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
        void ap_fallback_init(void) {}
        void start_ap_fallback(void) {}
        EOF

        cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
        #pragma once
        void ap_fallback_init(void);
        void start_ap_fallback(void);
        EOF

    # =========================================================
    # LAYER 3 — VOICE PIPELINE (SAFE HOOK ONLY)
    # =========================================================

    - name: Voice layer (non-blocking SR hook)
      run: |
        cat > examples/factory_demo/main/voice_router.c << 'EOF'
        #include "command_router.h"

        // SAFE HOOK: SR/Wakeword output entry
        void voice_on_command(const char *text)
        {
            command_router_execute(text);
        }
        EOF

    # =========================================================
    # FIX: AHT20 COMPONENT CRASH
    # =========================================================

    - name: Fix missing sensor dependency (AHT20)
      run: |
        COMP=examples/factory_demo/main/idf_component.yml

        if [ ! -f "$COMP" ]; then
          echo "dependencies:" > $COMP
        fi

        # pin safe version (IDF 5.1 compatible)
        grep -q aht20 $COMP || echo '  espressif/aht20: "2.0.0"' >> $COMP

    # =========================================================
    # PATCH MAIN ENTRY (BOOT SAFE ORDER)
    # =========================================================

    - name: Patch main.c boot order
      run: |
        python3 - << 'EOF'
        import pathlib, re

        f = pathlib.Path("examples/factory_demo/main/main.c")
        s = f.read_text()

        inject = """
            system_start_services();
            espnow_init();
            web_server_start();
            mqtt_bridge_start();
        """

        if "system_start_services" not in s:
            s = s.replace("app_rmaker_start();", "app_rmaker_start();" + inject)

        f.write_text(s)
        print("patched main.c")
        EOF

    # =========================================================
    # FIX CMAKE (SAFE ADDITION)
    # =========================================================

    - name: Patch CMakeLists
      run: |
        FILE=examples/factory_demo/main/CMakeLists.txt
        for f in system_state.c command_router.c espnow_bridge.c mqtt_bridge.c web_server.c ap_fallback.c voice_router.c; do
          grep -q $f $FILE || sed -i "/SRCS/a \        $f" $FILE
        done

    # =========================================================
    # BUILD
    # =========================================================

    - name: Build firmware
      run: |
        source $IDF_PATH/export.sh
        cd examples/factory_demo
        idf.py set-target esp32s3
        cp sdkconfig.ci.box sdkconfig
        idf.py build

    # =========================================================
    # MERGE BIN
    # =========================================================

    - name: Merge firmware
      run: |
        source $IDF_PATH/export.sh
        cd examples/factory_demo/build
        python $IDF_PATH/components/esptool_py/esptool/esptool.py \
          --chip esp32s3 merge_bin \
          -o factory_merged.bin \
          @flash_args

    # =========================================================
    # ARTIFACT
    # =========================================================

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-box-3layer-voice
        path: examples/factory_demo/build/factory_merged.bin
