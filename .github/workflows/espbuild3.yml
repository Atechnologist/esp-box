name: ESP32-S3-BOX PRODUCTION BUILD (Voice + ESPNOW + MQTT + WebUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN
      # ---------------------------
      - name: Clean build
        run: |
          rm -rf examples/factory_demo/build || true

      # ---------------------------
      # ENABLE COMPONENT MANAGER
      # ---------------------------
      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ---------------------------
      # SYSTEM STATE
      # ---------------------------
      - name: Add system state
        run: |
          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include <stdbool.h>

          static bool started = false;

          void system_start_services(void)
          {
              if (started) return;
              started = true;
          }

          bool system_is_started(void)
          {
              return started;
          }
          EOF

          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          void system_start_services(void);
          bool system_is_started(void);
          EOF

      # ---------------------------
      # COMMAND ROUTER
      # ---------------------------
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "mqtt_bridge.h"
          #include "espnow_bridge.h"
          #include "app_led.h"
          #include <string.h>

          void command_router_execute(const char *cmd)
          {
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
              }
              else if (strcmp(cmd, "REMOTE_ON") == 0) {
                  mqtt_bridge_publish("esp32/relay", "on");
              }
              else if (strcmp(cmd, "ESPNOW_ON") == 0) {
                  espnow_send_command("ON");
              }
          }
          EOF

          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          void command_router_execute(const char *cmd);
          EOF

      # ---------------------------
      # ESPNOW BRIDGE
      # WiFi must be started before esp_now_init().
      # espnow_init() calls esp_wifi_start() as a guard,
      # which is safe to call even if WiFi is already up.
      # ---------------------------
      - name: Add ESPNOW bridge
        run: |
          cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
          #include "espnow_bridge.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "espnow_bridge";

          static uint8_t peer_mac[] = {0x24, 0x6F, 0x28, 0xAA, 0xBB, 0xCC};

          void espnow_init(void)
          {
              /* WiFi must be initialised and started before ESP-NOW */
              esp_err_t err = esp_wifi_start();
              if (err != ESP_OK && err != ESP_ERR_WIFI_CONN) {
                  ESP_LOGE(TAG, "esp_wifi_start failed: %s", esp_err_to_name(err));
                  return;
              }

              err = esp_now_init();
              if (err != ESP_OK) {
                  ESP_LOGE(TAG, "esp_now_init failed: %s", esp_err_to_name(err));
                  return;
              }

              esp_now_peer_info_t peer = {0};
              memcpy(peer.peer_addr, peer_mac, 6);
              peer.channel = 0;
              peer.encrypt = false;

              err = esp_now_add_peer(&peer);
              if (err != ESP_OK) {
                  ESP_LOGE(TAG, "esp_now_add_peer failed: %s", esp_err_to_name(err));
              }
          }

          void espnow_send_command(const char *cmd)
          {
              esp_err_t err = esp_now_send(peer_mac, (uint8_t *)cmd, strlen(cmd));
              if (err != ESP_OK) {
                  ESP_LOGE(TAG, "esp_now_send failed: %s", esp_err_to_name(err));
              }
          }
          EOF

          cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
          #pragma once
          void espnow_init(void);
          void espnow_send_command(const char *cmd);
          EOF

      # ---------------------------
      # MQTT BRIDGE
      # ---------------------------
      - name: Add MQTT bridge
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "esp_log.h"

          void mqtt_bridge_start(void) {}
          void mqtt_bridge_publish(const char *topic, const char *data) {}
          EOF

          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          void mqtt_bridge_publish(const char *topic, const char *data);
          EOF

      # ---------------------------
      # WEB SERVER
      # ---------------------------
      - name: Add Web Server
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          void web_server_start(void) {}
          EOF

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

      # ---------------------------
      # AP FALLBACK
      # ---------------------------
      - name: Add AP fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
          #include "ap_fallback.h"
          void ap_fallback_init(void) {}
          void start_ap_fallback(void) {}
          EOF

          cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
          #pragma once
          void ap_fallback_init(void);
          void start_ap_fallback(void);
          EOF

      # ---------------------------
      # ADD ESP-NOW COMPONENT DEPENDENCY
      # Ensures idf_component.yml declares espressif/esp-now
      # so the Component Manager fetches it automatically.
      # ---------------------------
      - name: Add ESP-NOW component dependency
        run: |
          COMP_YML=examples/factory_demo/main/idf_component.yml
          if [ ! -f "$COMP_YML" ]; then
            echo "dependencies:" > "$COMP_YML"
          fi
          if ! grep -q 'espressif/esp-now' "$COMP_YML"; then
            echo '  espressif/esp-now: ">=2.0.0"' >> "$COMP_YML"
          fi

      # ---------------------------
      # PATCH CMAKE
      # Uses a Python script to reliably insert source files
      # into the SRCS list — avoids brittle sed regex on SRCS.
      # ---------------------------
      - name: Patch CMakeLists.txt
        run: |
          python3 - << 'EOF'
          import pathlib, re

          cmake_path = pathlib.Path("examples/factory_demo/main/CMakeLists.txt")
          src = cmake_path.read_text()

          new_files = [
              "ap_fallback.c",
              "web_server.c",
              "mqtt_bridge.c",
              "system_state.c",
              "command_router.c",
              "espnow_bridge.c",
          ]

          # Insert extra source files after the first occurrence of "SRCS"
          def insert_srcs(match):
              indent = "        "
              extras = "".join(f"\n{indent}{f}" for f in new_files)
              return match.group(0) + extras

          src = re.sub(r'SRCS\b', insert_srcs, src, count=1)
          cmake_path.write_text(src)
          print("CMakeLists.txt patched successfully")
          EOF

      # ---------------------------
      # PATCH MAIN
      # Uses a Python script for reliable multiline edits —
      # avoids portability issues with sed backslash-newlines.
      # ---------------------------
      - name: Patch main.c
        run: |
          python3 - << 'EOF'
          import pathlib, re

          main_path = pathlib.Path("examples/factory_demo/main/main.c")
          src = main_path.read_text()

          # --- 1. Inject includes after the last #include line ---
          extra_includes = (
              '#include "system_state.h"\n'
              '#include "command_router.h"\n'
              '#include "espnow_bridge.h"\n'
          )

          # Find position just after the last #include line
          last_inc = None
          for m in re.finditer(r'^#include\s+.+$', src, re.MULTILINE):
              last_inc = m
          if last_inc is None:
              raise RuntimeError("No #include found in main.c")

          insert_pos = last_inc.end()
          # Only inject if not already present
          if 'system_state.h' not in src:
              src = src[:insert_pos] + '\n' + extra_includes + src[insert_pos:]

          # --- 2. Inject calls after app_rmaker_start() ---
          injection = (
              '\n    system_start_services();'
              '\n    espnow_init();'
          )
          token = 'app_rmaker_start();'
          if token in src and 'espnow_init()' not in src:
              src = src.replace(token, token + injection)

          main_path.write_text(src)
          print("main.c patched successfully")
          EOF

      # ---------------------------
      # BUILD
      # Uses `source` (not `.`) for reliable shell sourcing
      # inside the espressif/idf container.
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py build

      # ---------------------------
      # MERGE BIN
      # Uses @flash_args (esptool argument-file syntax) instead
      # of $(cat flash_args) to avoid flag conflicts with
      # explicit --flash_mode / --flash_size arguments.
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            @flash_args

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-voice-router
          path: examples/factory_demo/build/factory_merged.bin


      # ---------------------------
      # PATCH MAIN
      # ---------------------------
      - name: Patch main.c
        run: |
          FILE=examples/factory_demo/main/main.c

          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)

          sed -i "${LAST_INCLUDE}a\\
          #include \"system_state.h\"\n#include \"command_router.h\"\n#include \"espnow_bridge.h\"" $FILE

          sed -i '/app_rmaker_start()/a \
          system_start_services();\
          espnow_init();' $FILE

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          . $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-voice-router
          path: examples/factory_demo/build/factory_merged.bin
