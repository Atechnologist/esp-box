name: ESP32-S3-BOX PRODUCTION BUILD (Voice + ESPNOW + MQTT + WebUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN
      # ---------------------------
      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

      # ---------------------------
      # ENABLE COMPONENT MANAGER
      # ---------------------------
      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ---------------------------
      # 🔥 REMOVE PROBLEM COMPONENTS
      # ---------------------------
      - name: Remove problematic components
        run: |
          find . -name "idf_component.yml" -exec sed -i '/aht20/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/at581x/d' {} \; || true

      # ---------------------------
      # PIN ESPNOW VERSION (CRITICAL)
      # ---------------------------
      - name: Fix ESPNOW version
        run: |
          COMP=examples/factory_demo/main/idf_component.yml
          echo "dependencies:" > $COMP
          echo '  espressif/esp-now: "2.1.0"' >> $COMP

      # ---------------------------
      # SYSTEM STATE
      # ---------------------------
      - name: Add system state
        run: |
          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include <stdbool.h>

          static bool started = false;

          void system_start_services(void)
          {
              if (started) return;
              started = true;
          }

          bool system_is_started(void)
          {
              return started;
          }
          EOF

          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          void system_start_services(void);
          bool system_is_started(void);
          EOF

      # ---------------------------
      # COMMAND ROUTER
      # ---------------------------
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "app_led.h"
          #include <string.h>

          void command_router_execute(const char *cmd)
          {
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
              }
          }
          EOF

          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          void command_router_execute(const char *cmd);
          EOF

      # ---------------------------
      # ESPNOW BRIDGE (SAFE INIT)
      # ---------------------------
      - name: Add ESPNOW bridge
        run: |
          cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
          #include "espnow_bridge.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "ESPNOW";

          void espnow_init(void)
          {
              ESP_LOGI(TAG, "ESPNOW init (safe)");

              if (esp_now_init() != ESP_OK) {
                  ESP_LOGW(TAG, "ESPNOW already init or failed");
              }
          }

          void espnow_send_command(const char *cmd)
          {
              ESP_LOGI(TAG, "Send: %s", cmd);
          }
          EOF

          cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
          #pragma once
          void espnow_init(void);
          void espnow_send_command(const char *cmd);
          EOF

      # ---------------------------
      # PATCH CMAKE
      # ---------------------------
      - name: Patch CMakeLists.txt
        run: |
          python3 - << 'EOF'
          import pathlib, re

          path = pathlib.Path("examples/factory_demo/main/CMakeLists.txt")
          txt = path.read_text()

          extras = ["system_state.c","command_router.c","espnow_bridge.c"]

          def repl(m):
              return m.group(0) + "".join("\n        " + f for f in extras)

          txt = re.sub(r'SRCS', repl, txt, count=1)
          path.write_text(txt)
          EOF

      # ---------------------------
      # PATCH MAIN (SAFE)
      # ---------------------------
      - name: Patch main.c
        run: |
          python3 - << 'EOF'
          import pathlib, re

          p = pathlib.Path("examples/factory_demo/main/main.c")
          s = p.read_text()

          if "espnow_bridge.h" not in s:
              s = s.replace("#include", "#include \"espnow_bridge.h\"\n#include", 1)

          if "espnow_init();" not in s:
              s = s.replace("app_rmaker_start();",
                            "app_rmaker_start();\n    espnow_init();")

          p.write_text(s)
          EOF

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            @flash_args

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-stable
          path: examples/factory_demo/build/factory_merged.bin
