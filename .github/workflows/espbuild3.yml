name: ESP32-S3-BOX PRODUCTION BUILD (VOICE + ESPNOW + MQTT + WEBUI FIXED)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN STATE
      # ---------------------------
      - name: Clean build
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/dependencies.lock || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/.idf_component_cache || true

      # ---------------------------
      # RESTORE ORIGINAL DEPENDENCIES
      # ---------------------------
      - name: Restore original idf_component.yml
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml 2>/dev/null || true

      # ---------------------------
      # ENABLE COMPONENT MANAGER
      # ---------------------------
      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ---------------------------
      # SYSTEM STATE MODULE
      # ---------------------------
      - name: Add system state module
        run: |
          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include "esp_log.h"
          #include <stdbool.h>
          
          static const char *TAG = "SYSTEM_STATE";
          static bool started = false;
          
          void system_start_services(void)
          {
              if (started) {
                  ESP_LOGW(TAG, "Services already started");
                  return;
              }
              
              started = true;
              ESP_LOGI(TAG, "System services started");
          }
          
          bool system_is_started(void)
          {
              return started;
          }
          EOF
          
          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void system_start_services(void);
          bool system_is_started(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # COMMAND ROUTER (VOICE CORE)
      # ---------------------------
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include <string.h>
          
          static const char *TAG = "CMD_ROUTER";
          
          void command_router_execute(const char *cmd)
          {
              if (!cmd) {
                  ESP_LOGW(TAG, "NULL command received");
                  return;
              }
              
              ESP_LOGI(TAG, "Executing command: %s", cmd);
              
              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
                  ESP_LOGI(TAG, "LED turned ON");
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
                  ESP_LOGI(TAG, "LED turned OFF");
              }
              else {
                  ESP_LOGW(TAG, "Unknown command: %s", cmd);
              }
          }
          EOF
          
          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void command_router_execute(const char *cmd);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # ESPNOW BRIDGE (STUB)
      # ---------------------------
      - name: Add ESPNOW bridge
        run: |
          cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
          #include "espnow_bridge.h"
          #include "esp_log.h"
          
          static const char *TAG = "ESPNOW";
          
          void espnow_init(void)
          {
              ESP_LOGI(TAG, "ESPNOW initialized");
          }
          
          void espnow_send_command(const char *cmd)
          {
              ESP_LOGI(TAG, "ESPNOW send: %s", cmd);
          }
          EOF
          
          cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void espnow_init(void);
          void espnow_send_command(const char *cmd);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # MQTT BRIDGE (STUB)
      # ---------------------------
      - name: Add MQTT bridge
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "esp_log.h"
          
          static const char *TAG = "MQTT";
          
          void mqtt_bridge_start(void)
          {
              ESP_LOGI(TAG, "MQTT bridge started");
          }
          
          void mqtt_bridge_publish(const char *topic, const char *data)
          {
              ESP_LOGI(TAG, "MQTT publish: %s = %s", topic, data);
          }
          EOF
          
          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void mqtt_bridge_start(void);
          void mqtt_bridge_publish(const char *topic, const char *data);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # WEB SERVER (FULL IMPLEMENTATION)
      # ---------------------------
      - name: Add web server
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "app_led.h"
          #include <stdio.h>
          #include <string.h>
          
          static const char *TAG = "WEB_SERVER";
          static httpd_handle_t server = NULL;
          
          static esp_err_t status_json_handler(httpd_req_t *req)
          {
              bool led_state = app_pwm_led_get_state();
              char response[256];
              snprintf(response, sizeof(response),
                  "{\"status\":\"ok\",\"led\":%s}",
                  led_state ? "true" : "false");
              
              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, response, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t led_on_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED ON requested");
              app_pwm_led_set_power(true);
              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, "{\"result\":\"on\"}", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t led_off_handler(httpd_req_t *req)
          {
              ESP_LOGI(TAG, "LED OFF requested");
              app_pwm_led_set_power(false);
              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, "{\"result\":\"off\"}", HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char html[] = 
              "<!DOCTYPE html><html><head><title>ESP32-S3-BOX</title>"
              "<meta name='viewport' content='width=device-width,initial-scale=1'>"
              "<style>body{font-family:Arial;margin:20px;}"
              ".btn{padding:10px 20px;margin:10px;font-size:16px;cursor:pointer;border:none;border-radius:4px;}"
              ".on{background:#4CAF50;color:white;}"
              ".off{background:#f44336;color:white;}"
              ".on:hover,.off:hover{opacity:0.8;}"
              "#stat{margin-top:20px;padding:10px;background:#e3f2fd;}</style>"
              "</head><body><h1>ESP32-S3-BOX Control</h1>"
              "<button class='btn on' onclick='fetch(\"/led/on\").then(()=>getStatus())'>LED ON</button>"
              "<button class='btn off' onclick='fetch(\"/led/off\").then(()=>getStatus())'>LED OFF</button>"
              "<div id='stat'>Loading...</div>"
              "<script>"
              "function getStatus(){fetch('/status').then(r=>r.json()).then(d=>"
              "document.getElementById('stat').innerHTML='LED: '+(d.led?'ON':'OFF')).catch(e=>console.log(e));}"
              "setInterval(getStatus,2000);getStatus();"
              "</script></body></html>";
              
              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }
          
          void web_server_start(void)
          {
              if (server != NULL) {
                  ESP_LOGW(TAG, "Web server already running");
                  return;
              }
              
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              config.stack_size = 8192;
              config.task_priority = 5;
              
              if (httpd_start(&server, &config) != ESP_OK) {
                  ESP_LOGE(TAG, "Failed to start web server");
                  return;
              }
              
              httpd_uri_t root_uri = {
                  .uri = "/",
                  .method = HTTP_GET,
                  .handler = root_handler,
                  .user_ctx = NULL
              };
              
              httpd_uri_t status_uri = {
                  .uri = "/status",
                  .method = HTTP_GET,
                  .handler = status_json_handler,
                  .user_ctx = NULL
              };
              
              httpd_uri_t led_on_uri = {
                  .uri = "/led/on",
                  .method = HTTP_GET,
                  .handler = led_on_handler,
                  .user_ctx = NULL
              };
              
              httpd_uri_t led_off_uri = {
                  .uri = "/led/off",
                  .method = HTTP_GET,
                  .handler = led_off_handler,
                  .user_ctx = NULL
              };
              
              httpd_register_uri_handler(server, &root_uri);
              httpd_register_uri_handler(server, &status_uri);
              httpd_register_uri_handler(server, &led_on_uri);
              httpd_register_uri_handler(server, &led_off_uri);
              
              ESP_LOGI(TAG, "Web server started on port 80");
          }
          EOF
          
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void web_server_start(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # AP FALLBACK (STUB)
      # ---------------------------
      - name: Add AP fallback
        run: |
          cat > examples/factory_demo/main/ap_fallback.c << 'EOF'
          #include "ap_fallback.h"
          #include "esp_log.h"
          
          static const char *TAG = "AP_FALLBACK";
          
          void ap_fallback_init(void)
          {
              ESP_LOGI(TAG, "AP fallback initialized");
          }
          
          void start_ap_fallback(void)
          {
              ESP_LOGI(TAG, "AP fallback started");
          }
          EOF
          
          cat > examples/factory_demo/main/ap_fallback.h << 'EOF'
          #pragma once
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          void ap_fallback_init(void);
          void start_ap_fallback(void);
          
          #ifdef __cplusplus
          }
          #endif
          EOF

      # ---------------------------
      # PATCH CMakeLists.txt (SAFE)
      # ---------------------------
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          
          if ! grep -q "command_router.c" $FILE; then
            sed -i '/SRCS.*main\.c/s/.*/& command_router.c espnow_bridge.c mqtt_bridge.c web_server.c ap_fallback.c system_state.c/' $FILE
          fi

      # ---------------------------
      # PATCH main.c
      # ---------------------------
      - name: Patch main.c includes
        run: |
          FILE=examples/factory_demo/main/main.c
          
          LAST_INCLUDE=$(grep -n "#include" $FILE | tail -1 | cut -d: -f1)
          
          sed -i '/command_router.h/d' $FILE || true
          sed -i '/espnow_bridge.h/d' $FILE || true
          sed -i '/mqtt_bridge.h/d' $FILE || true
          sed -i '/web_server.h/d' $FILE || true
          sed -i '/ap_fallback.h/d' $FILE || true
          sed -i '/system_state.h/d' $FILE || true
          
          sed -i "${LAST_INCLUDE}a\\
          #include \"command_router.h\"\n#include \"espnow_bridge.h\"\n#include \"mqtt_bridge.h\"\n#include \"web_server.h\"\n#include \"ap_fallback.h\"\n#include \"system_state.h\"" $FILE

      - name: Patch main.c calls
        run: |
          FILE=examples/factory_demo/main/main.c
          
          sed -i '/espnow_init()/d' $FILE || true
          sed -i '/web_server_start()/d' $FILE || true
          sed -i '/mqtt_bridge_start()/d' $FILE || true
          sed -i '/system_start_services()/d' $FILE || true
          sed -i '/ap_fallback_init()/d' $FILE || true
          
          sed -i '/app_rmaker_start()/a \
          ap_fallback_init();\
          system_start_services();\
          espnow_init();\
          vTaskDelay(pdMS_TO_TICKS(2000));\
          web_server_start();\
          mqtt_bridge_start();' $FILE

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py reconfigure
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            $(cat flash_args)

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-voice-espnow-mqtt
          path: examples/factory_demo/build/factory_merged.bin
