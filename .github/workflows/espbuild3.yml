name: ESP32-S3-BOX PRODUCTION BUILD (VOICE PIPELINE FINAL)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive

      - run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN
      # ---------------------------
      - name: Clean state
        run: |
          rm -rf examples/factory_demo/build
          rm -rf examples/factory_demo/dependencies.lock
          rm -rf examples/factory_demo/managed_components

      # ---------------------------
      # SYSTEM STATE (FIXED BOOL)
      # ---------------------------
      - name: Add system state
        run: |
          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          void system_start_services(void);
          bool system_is_started(void);
          EOF

          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include <stdbool.h>

          static bool started = false;

          void system_start_services(void){
              if(started) return;
              started = true;
          }

          bool system_is_started(void){
              return started;
          }
          EOF

      # ---------------------------
      # COMMAND ROUTER (DYNAMIC)
      # ---------------------------
      - name: Add command router
        run: |
          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          void command_router_execute(const char *cmd);
          EOF

          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "app_led.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "ROUTER";

          void command_router_execute(const char *cmd)
          {
              if (!cmd) return;

              ESP_LOGI(TAG, "VOICE CMD: %s", cmd);

              if (strstr(cmd, "turn on")) {
                  app_pwm_led_set_power(true);
              }
              else if (strstr(cmd, "turn off")) {
                  app_pwm_led_set_power(false);
              }
          }
          EOF

      # ---------------------------
      # WEB SERVER
      # ---------------------------
      - name: Add WebUI
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"
          #include "app_led.h"

          static httpd_handle_t server = NULL;

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const char resp[] = "<h1>ESP32 Voice Ready</h1>";
              httpd_resp_send(req, resp, -1);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t config = HTTPD_DEFAULT_CONFIG();
              httpd_start(&server, &config);

              httpd_uri_t uri = {
                  .uri="/",
                  .method=HTTP_GET,
                  .handler=root_handler
              };

              httpd_register_uri_handler(server, &uri);
          }
          EOF

      # ---------------------------
      # ESPNOW + MQTT (SAFE STUBS)
      # ---------------------------
      - name: Add bridges
        run: |
          echo 'void espnow_init(void){}' > examples/factory_demo/main/espnow_bridge.c
          echo 'void mqtt_bridge_start(void){}' > examples/factory_demo/main/mqtt_bridge.c

      # ---------------------------
      # PATCH CMAKE
      # ---------------------------
      - name: Patch CMake
        run: |
          sed -i '/SRCS/s/main.c/main.c command_router.c web_server.c system_state.c espnow_bridge.c mqtt_bridge.c/' \
          examples/factory_demo/main/CMakeLists.txt

      # ---------------------------
      # PATCH MAIN (VOICE HOOK)
      # ---------------------------
      - name: Inject voice pipeline
        run: |
          FILE=examples/factory_demo/main/main.c

          sed -i '/#include "app_priv.h"/a \
          #include "command_router.h"\n#include "web_server.h"\n#include "system_state.h"' $FILE

          sed -i '/app_rmaker_start()/a \
              system_start_services();\
              web_server_start();' $FILE

      # ---------------------------
      # HOOK INTO ESP-SR (KEY PART)
      # ---------------------------
      - name: Inject SR callback router
        run: |
          FILE=examples/factory_demo/main/app_sr.c

          sed -i '/printf("cmd:/a \
          command_router_execute(command_id);' $FILE || true

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            @flash_args

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-voice-pipeline
          path: examples/factory_demo/build/factory_merged.bin
