name: ESP32-S3-BOX PRODUCTION BUILD (Voice + ESP-NOW + MQTT + WebUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    defaults:
      run:
        shell: bash

    steps:

      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe directory fix
        run: git config --global --add safe.directory '*'

      # ---------------------------
      # CLEAN BUILD
      # ---------------------------
      - name: Clean build
        run: rm -rf examples/factory_demo/build || true

      # ---------------------------
      # ENABLE COMPONENT MANAGER
      # ---------------------------
      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ---------------------------
      # FIX BROKEN COMPONENTS (SAFE FILTER ONLY)
      # ---------------------------
      - name: Fix component conflicts safely
        run: |
          # DO NOT remove required esp-box dependencies
          # Only avoid broken optional sensors in CI
          find . -name "idf_component.yml" -exec sed -i '/at581x/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/aht20/d' {} \; || true

      # ---------------------------
      # SYSTEM STATE (safe minimal)
      # ---------------------------
      - name: System state
        run: |
          cat > examples/factory_demo/main/system_state.c << 'EOF'
          #include "system_state.h"
          #include <stdbool.h>

          static bool started = false;

          void system_start_services(void)
          {
              started = true;
          }

          bool system_is_started(void)
          {
              return started;
          }
          EOF

          cat > examples/factory_demo/main/system_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>
          void system_start_services(void);
          bool system_is_started(void);
          EOF

      # ---------------------------
      # COMMAND ROUTER (VOICE → ACTION LAYER)
      # ---------------------------
      - name: Command Router
        run: |
          cat > examples/factory_demo/main/command_router.c << 'EOF'
          #include "command_router.h"
          #include "esp_log.h"
          #include "app_led.h"

          static const char *TAG = "ROUTER";

          void command_router_execute(const char *cmd)
          {
              ESP_LOGI(TAG, "CMD: %s", cmd);

              if (!cmd) return;

              if (strcmp(cmd, "LED_ON") == 0) {
                  app_pwm_led_set_power(true);
              }
              else if (strcmp(cmd, "LED_OFF") == 0) {
                  app_pwm_led_set_power(false);
              }
          }
          EOF

          cat > examples/factory_demo/main/command_router.h << 'EOF'
          #pragma once
          void command_router_execute(const char *cmd);
          EOF

      # ---------------------------
      # ESP-NOW (LOCKED TO 2.1.0 FOR IDF 5.1)
      # ---------------------------
      - name: ESPNOW bridge
        run: |
          cat > examples/factory_demo/main/espnow_bridge.c << 'EOF'
          #include "espnow_bridge.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include <string.h>

          static const char *TAG = "ESPNOW";

          static uint8_t peer[] = {0x24,0x6F,0x28,0xAA,0xBB,0xCC};

          void espnow_init(void)
          {
              esp_wifi_start();
              esp_now_init();

              esp_now_peer_info_t p = {0};
              memcpy(p.peer_addr, peer, 6);
              p.channel = 0;
              p.encrypt = false;

              esp_now_add_peer(&p);
          }

          void espnow_send_command(const char *cmd)
          {
              esp_now_send(peer, (uint8_t*)cmd, strlen(cmd));
          }
          EOF

          cat > examples/factory_demo/main/espnow_bridge.h << 'EOF'
          #pragma once
          void espnow_init(void);
          void espnow_send_command(const char *cmd);
          EOF

      # ---------------------------
      # MQTT (stub safe layer)
      # ---------------------------
      - name: MQTT bridge
        run: |
          cat > examples/factory_demo/main/mqtt_bridge.c << 'EOF'
          #include "mqtt_bridge.h"
          #include "esp_log.h"

          static const char *TAG = "MQTT";

          void mqtt_bridge_start(void)
          {
              ESP_LOGI(TAG, "MQTT started");
          }

          void mqtt_bridge_publish(const char *topic, const char *data)
          {
              ESP_LOGI(TAG, "MQTT %s -> %s", topic, data);
          }
          EOF

          cat > examples/factory_demo/main/mqtt_bridge.h << 'EOF'
          #pragma once
          void mqtt_bridge_start(void);
          void mqtt_bridge_publish(const char *topic, const char *data);
          EOF

      # ---------------------------
      # WEB UI (REAL HTTP SERVER RESTORE)
      # ---------------------------
      - name: WebUI
        run: |
          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "esp_http_server.h"

          static httpd_handle_t server = NULL;

          static esp_err_t root(httpd_req_t *req)
          {
              const char html[] =
              "<h1>ESP32-S3 BOX OK</h1>";
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              httpd_config_t cfg = HTTPD_DEFAULT_CONFIG();
              httpd_start(&server, &cfg);

              httpd_uri_t uri = {
                  .uri="/",
                  .method=HTTP_GET,
                  .handler=root
              };

              httpd_register_uri_handler(server, &uri);
          }
          EOF

          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once
          void web_server_start(void);
          EOF

      # ---------------------------
      # COMPONENT DEPENDENCY LOCK (CRITICAL FIX)
      # ---------------------------
      - name: Fix component dependencies
        run: |
          cat > examples/factory_demo/main/idf_component.yml << 'EOF'
          dependencies:
            espressif/esp-now: "2.1.0"
            espressif/esp_http_server: "*"
            espressif/esp_wifi: "*"
          EOF

      # ---------------------------
      # PATCH CMAKE (SAFE ADD ONLY)
      # ---------------------------
      - name: Patch CMakeLists
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          echo 'REQUIRES esp_http_server esp_wifi' >> $FILE

      # ---------------------------
      # PATCH MAIN (NO BROKEN INJECTION)
      # ---------------------------
      - name: Patch main
        run: |
          FILE=examples/factory_demo/main/main.c

          if ! grep -q "espnow_init" $FILE; then
            sed -i '/app_rmaker_start/a espnow_init(); web_server_start(); mqtt_bridge_start();' $FILE
          fi

      # ---------------------------
      # BUILD
      # ---------------------------
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          idf.py build

      # ---------------------------
      # MERGE BIN
      # ---------------------------
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build
          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            @flash_args

      # ---------------------------
      # UPLOAD
      # ---------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-stable
          path: examples/factory_demo/build/factory_merged.bin
