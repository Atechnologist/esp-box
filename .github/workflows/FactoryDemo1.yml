name: Build ESP32-S3-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ----------------------------
      # Checkout ESP-BOX repo
      # ----------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      # ----------------------------
      # Fix Git safe directory
      # ----------------------------
      - name: Git safe directory fix
        run: git config --global --add safe.directory '*'

      # ----------------------------
      # IMPORTANT: Enable component manager
      # ----------------------------
      - name: Enable ESP-IDF component manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # ----------------------------
      # Patch broken LCD/touch deps (safe cleanup)
      # ----------------------------
      - name: Patch broken dependencies
        run: |
          set -e
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \; || true
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-ili9341/d' {} \; || true

      # ----------------------------
      # Build factory demo (correct flow)
      # ----------------------------
      - name: Build firmware
        shell: bash
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          # IMPORTANT: forces dependency resolution
          idf.py reconfigure
          idf.py build

      # ----------------------------
      # Upload firmware artifacts
      # ----------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-factory-demo
          path: |
            examples/factory_demo/build/*.bin
