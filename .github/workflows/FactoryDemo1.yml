name: Build ESP32-S3-BOX Factory Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.1

    steps:
      # ----------------------------
      # Checkout repo
      # ----------------------------
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      # ----------------------------
      # Fix git safe directory issue
      # ----------------------------
      - name: Git safe directory fix
        run: git config --global --add safe.directory '*'

      # ----------------------------
      # FIX missing component manager issues
      # ----------------------------
      - name: Patch broken LCD / touch dependencies
        run: |
          set -e
          find . -name "idf_component.yml" -exec sed -i '/esp-lcd-touch/d' {} \;
          find . -name "esp-lcd-ili9341/d' {} \;" || true

      # ----------------------------
      # Build ESP-S3-BOX factory demo
      # ----------------------------
      - name: Build firmware
        shell: bash
        run: |
          set -e

          . $IDF_PATH/export.sh

          cd examples/factory_demo

          idf.py set-target esp32s3

          cp sdkconfig.ci.box sdkconfig

          # IMPORTANT: reconfigure fixes component resolution
          idf.py reconfigure
          idf.py build

      # ----------------------------
      # Upload binaries (NO esptool needed)
      # ----------------------------
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-box-factory
          path: |
            examples/factory_demo/build/*.bin
