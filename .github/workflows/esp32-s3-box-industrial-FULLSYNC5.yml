name: ESP32-S3-BOX INDUSTRIAL RELAY HUB FULL SYNC V6

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    defaults:
      run:
        shell: bash
    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout ESP-BOX
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-box
          submodules: recursive
          fetch-depth: 0

      - name: Safe dir
        run: git config --global --add safe.directory '*'

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean
        run: |
          rm -rf examples/factory_demo/build || true
          rm -rf examples/factory_demo/managed_components || true
          rm -rf examples/factory_demo/dependencies.lock || true

      # =========================================================
      # RESTORE MANIFEST
      # =========================================================
      - name: Restore manifest
        run: |
          cd examples/factory_demo
          git checkout idf_component.yml || true

      - name: Enable Component Manager
        run: echo "IDF_COMPONENT_MANAGER=1" >> $GITHUB_ENV

      # =========================================================
      # FORCE ESP32-S3-BOX (not BOX-3)
      # =========================================================
      - name: Force ESP32-S3-BOX target
        run: |
          cd examples/factory_demo
          sed -i '/CONFIG_ESP_BOX_3/d' sdkconfig.ci.box || true
          echo "CONFIG_ESP_BOX_3=n" >> sdkconfig.ci.box

      # =========================================================
      # AUDIT — print every GUI and app file so we can see
      # exactly what the light button calls in the BOX UI
      # =========================================================
      - name: Audit UI files
        run: |
          echo "=== All C files calling app_pwm_led or led_set or set_power ==="
          grep -rn "app_pwm_led\|led_set_power\|set_power\|_led_" \
            examples/factory_demo/main/ \
            --include="*.c" || true

          echo ""
          echo "=== ui_device_ctrl.c FULL ==="
          UI=$(find examples/factory_demo -name "ui_device_ctrl.c" | head -1)
          [ -f "$UI" ] && cat -n "$UI" || echo "not found"

          echo ""
          echo "=== app_switch.c FULL ==="
          SW=$(find examples/factory_demo -name "app_switch.c" | head -1)
          [ -f "$SW" ] && cat -n "$SW" || echo "not found"

          echo ""
          echo "=== app_led.c FULL ==="
          LED=$(find examples/factory_demo -name "app_led.c" | head -1)
          [ -f "$LED" ] && cat -n "$LED" || echo "not found"

          echo ""
          echo "=== app_sr_handler.c FULL ==="
          SR=$(find examples/factory_demo -name "app_sr_handler.c" | head -1)
          [ -f "$SR" ] && cat -n "$SR" || echo "not found"

          echo ""
          echo "=== All .c files in main/ ==="
          find examples/factory_demo/main -name "*.c" | sort

      # =========================================================
      # RELAY STATE
      # =========================================================
      - name: Add relay state manager
        run: |
          cat > examples/factory_demo/main/relay_state.h << 'EOF'
          #pragma once
          #include <stdbool.h>

          typedef enum {
              SRC_VOICE  = 0,
              SRC_WEB    = 1,
              SRC_ESPNOW = 2,
              SRC_BOXUI  = 3,
          } relay_src_t;

          void relay_state_init(void);
          void relay_state_set_light(bool on, relay_src_t src);
          void relay_state_set_relay(bool on, relay_src_t src);
          void relay_state_toggle_relay(relay_src_t src);
          bool relay_state_get_light(void);
          bool relay_state_get_relay(void);
          EOF

          cat > examples/factory_demo/main/relay_state.c << 'EOF'
          #include "relay_state.h"
          #include "app_led.h"
          #include "web_server.h"
          #include "espnow_relay.h"
          #include "esp_log.h"
          #include <stdio.h>

          static const char *TAG = "STATE";
          static bool s_light = false;
          static bool s_relay = false;

          void relay_state_init(void)
          {
              s_light = false;
              s_relay = false;
              ESP_LOGI(TAG, "State manager ready");
          }

          void relay_state_set_light(bool on, relay_src_t src)
          {
              s_light = on;
              const char *who[] = {"VOICE","WEB","ESPNOW","BOXUI"};
              char log[64];
              snprintf(log, sizeof(log),
                       "[%s] LIGHT %s", who[src], on ? "ON":"OFF");
              ESP_LOGI(TAG, "%s", log);
              web_server_log_voice(log);

              if (src != SRC_BOXUI)
                  app_pwm_led_set_power(on);

              if (src != SRC_ESPNOW)
                  espnow_relay_broadcast(on ? "LIGHT:ON" : "LIGHT:OFF");
          }

          void relay_state_set_relay(bool on, relay_src_t src)
          {
              s_relay = on;
              const char *who[] = {"VOICE","WEB","ESPNOW","BOXUI"};
              char log[64];
              snprintf(log, sizeof(log),
                       "[%s] RELAY %s", who[src], on ? "ON":"OFF");
              ESP_LOGI(TAG, "%s", log);
              web_server_log_voice(log);

              if (src != SRC_ESPNOW)
                  espnow_relay_broadcast(on ? "RELAY:ON" : "RELAY:OFF");
          }

          void relay_state_toggle_relay(relay_src_t src)
          {
              relay_state_set_relay(!s_relay, src);
          }

          bool relay_state_get_light(void) { return s_light; }
          bool relay_state_get_relay(void) { return s_relay; }
          EOF

      # =========================================================
      # NODE REGISTRY
      # =========================================================
      - name: Add node registry
        run: |
          cat > examples/factory_demo/main/node_registry.h << 'EOF'
          #pragma once

          void node_registry_init(void);
          void node_registry_add(const char *node);
          const char **node_registry_get_all(int *count);
          int  node_registry_count(void);
          EOF

          cat > examples/factory_demo/main/node_registry.c << 'EOF'
          #include "node_registry.h"
          #include "esp_log.h"
          #include <string.h>

          #define MAX_NODES 20
          static char        nodes[MAX_NODES][32];
          static const char *ptrs[MAX_NODES];
          static int         n_count = 0;

          void node_registry_init(void)
          {
              memset(nodes, 0, sizeof(nodes));
              n_count = 0;
          }

          void node_registry_add(const char *node)
          {
              if (!node || node[0] == '\0') return;
              for (int i = 0; i < n_count; i++)
                  if (strcmp(nodes[i], node) == 0) return;
              if (n_count >= MAX_NODES) return;
              strncpy(nodes[n_count], node, 31);
              ptrs[n_count] = nodes[n_count];
              n_count++;
              ESP_LOGI("NODE_REG", "Added: %s", node);
          }

          const char **node_registry_get_all(int *c)
          {
              if (c) *c = n_count;
              return ptrs;
          }

          int node_registry_count(void) { return n_count; }
          EOF

      # =========================================================
      # ESPNOW RELAY
      # Now also handles M5Stack wireless mic commands:
      #   MIC:CMD:3  → Light ON  (same act codes as BOX SR)
      #   MIC:CMD:4  → Light OFF
      #   MIC:CMD:5  → Switch ON
      #   MIC:CMD:6  → Switch OFF
      #   MIC:PHRASE:turn on the light  → text phrase fallback
      # =========================================================
      - name: Add espnow relay
        run: |
          cat > examples/factory_demo/main/espnow_relay.h << 'EOF'
          #pragma once

          void espnow_relay_init(void);
          void espnow_relay_broadcast(const char *msg);
          EOF

          cat > examples/factory_demo/main/espnow_relay.c << 'EOF'
          #include "espnow_relay.h"
          #include "relay_state.h"
          #include "node_registry.h"
          #include "web_server.h"
          #include "esp_now.h"
          #include "esp_wifi.h"
          #include "esp_log.h"
          #include "freertos/FreeRTOS.h"
          #include "freertos/task.h"
          #include <string.h>
          #include <stdio.h>
          #include <stdlib.h>

          static const char *TAG = "ESPNOW";
          static const uint8_t BCAST[6] =
              {0xff,0xff,0xff,0xff,0xff,0xff};
          static bool s_ready = false;

          static void mac_str(const uint8_t *m, char *out, size_t len)
          {
              snprintf(out, len,
                       "%02X:%02X:%02X:%02X:%02X:%02X",
                       m[0],m[1],m[2],m[3],m[4],m[5]);
          }

          /* ── handle phrase text from M5 mic ─────────────────── */
          static void handle_mic_phrase(const char *phrase)
          {
              if (!phrase) return;

              char log[80];
              snprintf(log, sizeof(log), "[M5MIC] %s", phrase);
              web_server_log_voice(log);
              ESP_LOGI(TAG, "M5 phrase: %s", phrase);

              /* Simple keyword match — mirrors voice_hook logic */
              bool has_light  = strstr(phrase, "light") != NULL;
              bool has_relay  = strstr(phrase, "relay") != NULL ||
                                strstr(phrase, "switch") != NULL;
              bool has_on     = strstr(phrase, " on")  != NULL;
              bool has_off    = strstr(phrase, " off") != NULL;
              bool has_all    = strstr(phrase, "all")  != NULL;

              if (has_all && has_on)
              {
                  relay_state_set_light(true,  SRC_VOICE);
                  relay_state_set_relay(true,  SRC_VOICE);
              }
              else if (has_all && has_off)
              {
                  relay_state_set_light(false, SRC_VOICE);
                  relay_state_set_relay(false, SRC_VOICE);
              }
              else if (has_light && has_on)
                  relay_state_set_light(true,  SRC_VOICE);
              else if (has_light && has_off)
                  relay_state_set_light(false, SRC_VOICE);
              else if (has_relay && has_on)
                  relay_state_set_relay(true,  SRC_VOICE);
              else if (has_relay && has_off)
                  relay_state_set_relay(false, SRC_VOICE);
          }

          /* ── handle act code from M5 mic ────────────────────── */
          /* M5Stack sends same command_id as the BOX SR library:
           *   act 3 = Light ON   act 4 = Light OFF
           *   act 5 = Switch ON  act 6 = Switch OFF
           * (matches factory demo RainMaker voice config)          */
          static void handle_mic_cmd(int act)
          {
              char log[48];
              snprintf(log, sizeof(log), "[M5MIC] act:%d", act);
              web_server_log_voice(log);
              ESP_LOGI(TAG, "M5 act: %d", act);

              switch (act)
              {
                  case 3: relay_state_set_light(true,  SRC_VOICE); break;
                  case 4: relay_state_set_light(false, SRC_VOICE); break;
                  case 5: relay_state_set_relay(true,  SRC_VOICE); break;
                  case 6: relay_state_set_relay(false, SRC_VOICE); break;
                  default: break;
              }
          }

          static void recv_cb(
              const esp_now_recv_info_t *info,
              const uint8_t *data, int len)
          {
              char msg[128] = {0};
              int  n = len < (int)sizeof(msg)-1
                       ? len : (int)sizeof(msg)-1;
              memcpy(msg, data, n);
              char mac[24];
              mac_str(info->src_addr, mac, sizeof(mac));
              ESP_LOGI(TAG, "RX [%s] %s", mac, msg);
              char log_line[96];

              /* ── relay node messages ──────────────────────── */
              if (strncmp(msg, "DISCOVER:", 9) == 0)
              {
                  const char *name = msg + 9;
                  node_registry_add(name);
                  node_registry_add(mac);
                  snprintf(log_line, sizeof(log_line),
                           "NODE JOINED: %s", name);
                  web_server_log_voice(log_line);
                  espnow_relay_broadcast("BOX:READY");
                  espnow_relay_broadcast(
                      relay_state_get_light()
                      ? "LIGHT:ON" : "LIGHT:OFF");
                  espnow_relay_broadcast(
                      relay_state_get_relay()
                      ? "RELAY:ON" : "RELAY:OFF");
                  return;
              }

              if (strncmp(msg, "NODE:", 5) == 0)
              {
                  char tmp[64] = {0};
                  strncpy(tmp, msg + 5, sizeof(tmp)-1);
                  char *sep = strchr(tmp, ':');
                  if (sep) *sep = '\0';
                  node_registry_add(tmp);
                  node_registry_add(mac);
                  return;
              }

              if (strcmp(msg, "PONG") == 0)
              {
                  node_registry_add(mac);
                  snprintf(log_line, sizeof(log_line),
                           "PONG from %s", mac);
                  web_server_log_voice(log_line);
                  return;
              }

              if (strncmp(msg, "ACK:LIGHT:", 10) == 0)
              {
                  node_registry_add(mac);
                  bool on = strcmp(msg + 10, "ON") == 0;
                  relay_state_set_light(on, SRC_ESPNOW);
                  return;
              }

              if (strncmp(msg, "ACK:RELAY:", 10) == 0)
              {
                  node_registry_add(mac);
                  bool on = strcmp(msg + 10, "ON") == 0;
                  relay_state_set_relay(on, SRC_ESPNOW);
                  return;
              }

              if (strncmp(msg, "RELAY:STATE:", 12) == 0)
              {
                  int light_on = 0, relay_on = 0;
                  sscanf(msg + 12, "%d,%d", &light_on, &relay_on);
                  relay_state_set_light(light_on != 0, SRC_ESPNOW);
                  relay_state_set_relay(relay_on != 0, SRC_ESPNOW);
                  return;
              }

              /* ── M5Stack wireless mic messages ────────────── */

              /* MIC:CMD:N  — act code from M5 SR library */
              if (strncmp(msg, "MIC:CMD:", 8) == 0)
              {
                  node_registry_add(mac);
                  int act = atoi(msg + 8);
                  handle_mic_cmd(act);
                  return;
              }

              /* MIC:PHRASE:text — recognised phrase text */
              if (strncmp(msg, "MIC:PHRASE:", 11) == 0)
              {
                  node_registry_add(mac);
                  handle_mic_phrase(msg + 11);
                  return;
              }

              /* MIC:DISCOVER:name — M5 announces itself */
              if (strncmp(msg, "MIC:DISCOVER:", 13) == 0)
              {
                  const char *name = msg + 13;
                  node_registry_add(name);
                  node_registry_add(mac);
                  snprintf(log_line, sizeof(log_line),
                           "MIC NODE: %s", name);
                  web_server_log_voice(log_line);
                  /* Acknowledge so M5 knows it's connected */
                  espnow_relay_broadcast("BOX:READY");
                  return;
              }

              /* MIC:WAKE — wake word detected on M5, BOX plays tone */
              if (strcmp(msg, "MIC:WAKE") == 0)
              {
                  node_registry_add(mac);
                  web_server_log_voice("[M5MIC] Wake word detected");
                  return;
              }

              /* Unknown */
              snprintf(log_line, sizeof(log_line),
                       "RX [%s]: %s", mac, msg);
              web_server_log_voice(log_line);
          }

          static void send_cb(
              const uint8_t *mac,
              esp_now_send_status_t status)
          {
              if (status != ESP_NOW_SEND_SUCCESS)
                  ESP_LOGW(TAG,
                      "TX FAIL %02X:%02X:%02X:%02X:%02X:%02X",
                      mac[0],mac[1],mac[2],mac[3],mac[4],mac[5]);
          }

          static void ping_task(void *arg)
          {
              vTaskDelay(pdMS_TO_TICKS(4000));
              while (1)
              {
                  if (s_ready)
                  {
                      esp_now_send(BCAST, (uint8_t *)"PING", 5);
                      ESP_LOGI(TAG, "PING");
                  }
                  vTaskDelay(pdMS_TO_TICKS(10000));
              }
          }

          static void espnow_init_task(void *arg)
          {
              uint8_t primary = 0;
              wifi_second_chan_t second;
              while (primary == 0)
              {
                  vTaskDelay(pdMS_TO_TICKS(500));
                  esp_wifi_get_channel(&primary, &second);
              }
              char ch_msg[48];
              snprintf(ch_msg, sizeof(ch_msg),
                       "ESP-NOW ch:%d (set relay to match)", primary);
              ESP_LOGI(TAG, "%s", ch_msg);
              web_server_log_voice(ch_msg);

              if (esp_now_init() != ESP_OK)
              {
                  ESP_LOGE(TAG, "esp_now_init failed");
                  vTaskDelete(NULL);
                  return;
              }
              esp_now_register_recv_cb(recv_cb);
              esp_now_register_send_cb(send_cb);

              esp_now_peer_info_t peer = {0};
              memcpy(peer.peer_addr, BCAST, 6);
              peer.channel = 0;
              peer.encrypt = false;
              esp_now_add_peer(&peer);

              s_ready = true;
              ESP_LOGI(TAG, "ESP-NOW ready ch%d", primary);
              vTaskDelete(NULL);
          }

          void espnow_relay_init(void)
          {
              xTaskCreate(espnow_init_task,
                          "espnow_init", 4096, NULL, 5, NULL);
              xTaskCreate(ping_task,
                          "espnow_ping", 2048, NULL, 4, NULL);
          }

          void espnow_relay_broadcast(const char *msg)
          {
              if (!s_ready || !msg) return;
              esp_now_send(BCAST,
                           (const uint8_t *)msg,
                           strlen(msg) + 1);
          }
          EOF

      # =========================================================
      # WEB SERVER
      # =========================================================
      - name: Add web server
        run: |
          cat > examples/factory_demo/main/web_server.h << 'EOF'
          #pragma once

          void web_server_start(void);
          void web_server_log_voice(const char *msg);
          EOF

          cat > examples/factory_demo/main/web_server.c << 'EOF'
          #include "web_server.h"
          #include "relay_state.h"
          #include "node_registry.h"
          #include "esp_http_server.h"
          #include "esp_log.h"
          #include "esp_app_desc.h"
          #include <string.h>
          #include <stdio.h>

          static const char *TAG = "WEB";
          static httpd_handle_t server = NULL;

          #define LOG_SIZE 4096
          static char logbuf[LOG_SIZE] = "-- log start --\n";

          void web_server_log_voice(const char *msg)
          {
              if (!msg) return;
              size_t cur  = strlen(logbuf);
              size_t mlen = strlen(msg);
              if (cur + mlen + 2 >= LOG_SIZE)
              {
                  size_t drop = mlen + 2;
                  if (drop >= cur) drop = cur;
                  memmove(logbuf, logbuf + drop, cur - drop + 1);
                  cur = strlen(logbuf);
              }
              strncat(logbuf, msg,  LOG_SIZE - cur - 2);
              strcat (logbuf, "\n");
          }

          static esp_err_t root_handler(httpd_req_t *req)
          {
              const esp_app_desc_t *app = esp_app_get_description();
              char html[4096];
              snprintf(html, sizeof(html),
              "<!DOCTYPE html><html><head>"
              "<meta charset='utf-8'><link rel='icon' href='data:,'>"
              "<title>ESP32-BOX Industrial</title>"
              "<style>"
              "body{font-family:sans-serif;background:#1a1a2e;color:#eee;padding:20px;margin:0}"
              "h1{color:#e94560;margin:0 0 4px}"
              "p{margin:0 0 14px;color:#aaa;font-size:13px}"
              ".row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}"
              ".btn{padding:11px 22px;border:none;border-radius:7px;cursor:pointer;font-size:14px;font-weight:bold}"
              ".on{background:#27ae60;color:#fff}.off{background:#e74c3c;color:#fff}"
              ".tog{background:#8e44ad;color:#fff}.png{background:#2980b9;color:#fff}"
              ".card{background:#16213e;border-radius:8px;padding:14px;margin-bottom:14px}"
              ".dot{display:inline-block;width:12px;height:12px;border-radius:50%%;margin-right:6px}"
              ".on-dot{background:#2ecc71}.off-dot{background:#7f8c8d}"
              "table{width:100%%;border-collapse:collapse}"
              "th,td{border:1px solid #2c3e50;padding:7px 10px;text-align:left;font-size:13px}"
              "th{background:#0f3460}"
              "#log{background:#0d1117;padding:12px;height:220px;overflow-y:auto;"
                   "border-radius:6px;font-size:12px;white-space:pre-wrap;"
                   "font-family:monospace;color:#8be9fd}"
              "</style></head><body>"
              "<h1>&#x1F3ED; ESP32-S3-BOX Industrial Hub</h1>"
              "<p>Firmware: <b>%s</b></p>"
              "<div class='card'><b>&#x1F4A1; Light</b>&nbsp;"
              "<span id='li' class='dot off-dot'></span>"
              "<span id='ls'>OFF</span><br><br>"
              "<div class='row'>"
              "<button class='btn on'  onclick=\"cmd('/light/on')\">Light ON</button>"
              "<button class='btn off' onclick=\"cmd('/light/off')\">Light OFF</button>"
              "</div></div>"
              "<div class='card'><b>&#x26A1; Relay</b>&nbsp;"
              "<span id='ri' class='dot off-dot'></span>"
              "<span id='rs'>OFF</span><br><br>"
              "<div class='row'>"
              "<button class='btn on'  onclick=\"cmd('/relay/on')\">Relay ON</button>"
              "<button class='btn off' onclick=\"cmd('/relay/off')\">Relay OFF</button>"
              "<button class='btn tog' onclick=\"cmd('/relay/toggle')\">Toggle</button>"
              "</div></div>"
              "<div class='card'><b>&#x1F4E1; Nodes (<span id='nc'>-</span>)</b>"
              "<button class='btn png' style='float:right;padding:6px 14px'"
              " onclick=\"cmd('/ping')\">PING</button>"
              "<table style='margin-top:10px'>"
              "<tr><th>#</th><th>Node</th><th>Status</th></tr>"
              "<tbody id='nodes'><tr><td colspan=3>Waiting...</td></tr></tbody>"
              "</table></div>"
              "<div class='card'><b>&#x1F4CB; Event Log</b>"
              "<div id='log' style='margin-top:8px'>Loading...</div></div>"
              "<script>"
              "function cmd(u){fetch(u).then(()=>refresh());}"
              "function refresh(){"
              "fetch('/status').then(r=>r.json()).then(d=>{"
              "  document.getElementById('li').className='dot '+(d.light?'on-dot':'off-dot');"
              "  document.getElementById('ls').textContent=d.light?'ON':'OFF';"
              "  document.getElementById('ri').className='dot '+(d.relay?'on-dot':'off-dot');"
              "  document.getElementById('rs').textContent=d.relay?'ON':'OFF';"
              "}).catch(()=>{});"
              "fetch('/nodes').then(r=>r.json()).then(d=>{"
              "  document.getElementById('nc').textContent=d.length;"
              "  var tb=document.getElementById('nodes');"
              "  tb.innerHTML=d.length===0?'<tr><td colspan=3>No nodes yet</td></tr>'"
              "  :d.map((n,i)=>'<tr><td>'+(i+1)+'</td><td>'+n+"
              "  '</td><td>&#x1F7E2; Online</td></tr>').join('');"
              "}).catch(()=>{});"
              "fetch('/log').then(r=>r.text()).then(t=>{"
              "  var el=document.getElementById('log');"
              "  el.textContent=t;el.scrollTop=el.scrollHeight;"
              "}).catch(()=>{});"
              "}"
              "refresh();setInterval(refresh,2500);"
              "</script></body></html>",
              app->version);
              httpd_resp_set_type(req, "text/html");
              httpd_resp_send(req, html, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t status_handler(httpd_req_t *req)
          {
              char buf[64];
              snprintf(buf, sizeof(buf),
                       "{\"light\":%s,\"relay\":%s}",
                       relay_state_get_light() ? "true":"false",
                       relay_state_get_relay() ? "true":"false");
              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, buf, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t nodes_handler(httpd_req_t *req)
          {
              char buf[1024] = "[";
              int  count = 0;
              const char **nodes = node_registry_get_all(&count);
              for (int i = 0; i < count; i++)
              {
                  if (i > 0) strncat(buf, ",",  sizeof(buf)-strlen(buf)-1);
                  strncat(buf, "\"",     sizeof(buf)-strlen(buf)-1);
                  strncat(buf, nodes[i], sizeof(buf)-strlen(buf)-1);
                  strncat(buf, "\"",     sizeof(buf)-strlen(buf)-1);
              }
              strncat(buf, "]", sizeof(buf)-strlen(buf)-1);
              httpd_resp_set_type(req, "application/json");
              httpd_resp_send(req, buf, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t log_handler(httpd_req_t *req)
          {
              httpd_resp_set_type(req, "text/plain");
              httpd_resp_send(req, logbuf, HTTPD_RESP_USE_STRLEN);
              return ESP_OK;
          }

          static esp_err_t light_on_h(httpd_req_t *req)
          { relay_state_set_light(true,  SRC_WEB); httpd_resp_send(req,"OK",2); return ESP_OK; }
          static esp_err_t light_off_h(httpd_req_t *req)
          { relay_state_set_light(false, SRC_WEB); httpd_resp_send(req,"OK",2); return ESP_OK; }
          static esp_err_t relay_on_h(httpd_req_t *req)
          { relay_state_set_relay(true,  SRC_WEB); httpd_resp_send(req,"OK",2); return ESP_OK; }
          static esp_err_t relay_off_h(httpd_req_t *req)
          { relay_state_set_relay(false, SRC_WEB); httpd_resp_send(req,"OK",2); return ESP_OK; }
          static esp_err_t relay_toggle_h(httpd_req_t *req)
          { relay_state_toggle_relay(SRC_WEB); httpd_resp_send(req,"OK",2); return ESP_OK; }

          extern void espnow_relay_broadcast(const char *msg);

          static esp_err_t ping_h(httpd_req_t *req)
          {
              espnow_relay_broadcast("PING");
              web_server_log_voice("Manual PING sent");
              httpd_resp_send(req, "OK", 2);
              return ESP_OK;
          }

          static esp_err_t favicon_h(httpd_req_t *req)
          {
              httpd_resp_set_status(req, "204 No Content");
              httpd_resp_send(req, NULL, 0);
              return ESP_OK;
          }

          void web_server_start(void)
          {
              if (server) return;
              httpd_config_t cfg   = HTTPD_DEFAULT_CONFIG();
              cfg.stack_size       = 8192;
              cfg.max_uri_handlers = 16;
              if (httpd_start(&server, &cfg) != ESP_OK)
              {
                  ESP_LOGE(TAG, "httpd start failed");
                  return;
              }
              httpd_uri_t uris[] = {
                  {"/",             HTTP_GET, root_handler,   NULL},
                  {"/status",       HTTP_GET, status_handler, NULL},
                  {"/nodes",        HTTP_GET, nodes_handler,  NULL},
                  {"/log",          HTTP_GET, log_handler,    NULL},
                  {"/light/on",     HTTP_GET, light_on_h,     NULL},
                  {"/light/off",    HTTP_GET, light_off_h,    NULL},
                  {"/relay/on",     HTTP_GET, relay_on_h,     NULL},
                  {"/relay/off",    HTTP_GET, relay_off_h,    NULL},
                  {"/relay/toggle", HTTP_GET, relay_toggle_h, NULL},
                  {"/ping",         HTTP_GET, ping_h,         NULL},
                  {"/favicon.ico",  HTTP_GET, favicon_h,      NULL},
              };
              for (int i = 0;
                   i < (int)(sizeof(uris)/sizeof(uris[0])); i++)
                  httpd_register_uri_handler(server, &uris[i]);
              ESP_LOGI(TAG, "Web server started");
          }
          EOF

      # =========================================================
      # PATCH CMAKE
      # =========================================================
      - name: Patch CMake
        run: |
          FILE=examples/factory_demo/main/CMakeLists.txt
          sed -i '/web_server.c/d'    $FILE || true
          sed -i '/espnow_relay.c/d'  $FILE || true
          sed -i '/node_registry.c/d' $FILE || true
          sed -i '/relay_state.c/d'   $FILE || true
          sed -i 's/main.c/main.c web_server.c espnow_relay.c node_registry.c relay_state.c/' $FILE

      # =========================================================
      # PATCH MAIN
      # =========================================================
      - name: Patch main includes
        run: |
          FILE=examples/factory_demo/main/main.c
          for H in web_server.h espnow_relay.h \
                   node_registry.h relay_state.h; do
            sed -i "/${H}/d" $FILE || true
          done
          LAST=$(grep -n "^#include" $FILE | tail -1 | cut -d: -f1)
          sed -i "${LAST}a #include \"node_registry.h\"" $FILE
          sed -i "${LAST}a #include \"relay_state.h\""   $FILE
          sed -i "${LAST}a #include \"espnow_relay.h\""  $FILE
          sed -i "${LAST}a #include \"web_server.h\""    $FILE

      - name: Patch main calls
        run: |
          FILE=examples/factory_demo/main/main.c
          for FN in web_server_start espnow_relay_init \
                    relay_state_init node_registry_init; do
            sed -i "/${FN}()/d" $FILE || true
          done
          sed -i '/app_rmaker_start()/a \
          vTaskDelay(pdMS_TO_TICKS(1000));\
          relay_state_init();\
          node_registry_init();\
          web_server_start();\
          espnow_relay_init();' $FILE

      # =========================================================
      # PATCH app_sr_handler.c
      # Inject relay_state_set_light after app_pwm_led_set_power
      # (voice commands — already working, keep this patch)
      # =========================================================
      - name: Patch app_sr_handler.c
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          sr_file = None
          for root, dirs, files in os.walk("examples/factory_demo"):
              for f in files:
                  if f == "app_sr_handler.c":
                      sr_file = os.path.join(root, f)
                      break

          if not sr_file:
              print("not found"); sys.exit(0)

          with open(sr_file) as fh:
              src = fh.read()

          changed = False

          if "relay_state.h" not in src:
              src = '#include "relay_state.h"\n' + src
              changed = True

          if "relay_state_set_light" not in src:
              def inject(m):
                  val = m.group(1)
                  return (f"app_pwm_led_set_power({val});\n"
                          f"        relay_state_set_light({val}, SRC_BOXUI);")
              new = re.sub(
                  r'app_pwm_led_set_power\(\s*(true|false|\w+)\s*\)\s*;',
                  inject, src)
              if new != src:
                  src = new; changed = True
                  print("SR handler: relay_state_set_light injected")

          if changed:
              with open(sr_file, "w") as fh:
                  fh.write(src)
          PYEOF

      # =========================================================
      # PATCH ALL GUI/APP FILES — broad sweep
      #
      # Since ui_device_ctrl.c does NOT call app_pwm_led_set_power
      # directly, we do a broad Python sweep across ALL .c files
      # in the main/ tree looking for any function that sets LED
      # state that we haven't patched yet.
      #
      # The Audit step output will show us exactly which file
      # and function the light button uses so we can confirm.
      # =========================================================
      - name: Patch all LED call sites
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          # Files we already handle — skip them here
          already_patched = {
              "app_sr_handler.c",
              "relay_state.c",
              "web_server.c",
              "espnow_relay.c",
              "node_registry.c",
          }

          # Patterns that indicate an LED state set
          led_patterns = [
              # Direct power call (bool literal or variable)
              re.compile(
                  r'app_pwm_led_set_power\(\s*(true|false|\w+)\s*\)\s*;'),
              # RGB set with all zeros = off, or non-zero = on
              re.compile(
                  r'app_led_set_all_rgb\(\s*(\d+)\s*,\s*\d+\s*,\s*\d+\s*\)\s*;'),
              # app_led_set_power if it exists
              re.compile(
                  r'app_led_set_power\(\s*(true|false|\w+)\s*\)\s*;'),
          ]

          total_injected = 0

          for root, dirs, files in os.walk("examples/factory_demo/main"):
              for fname in files:
                  if not fname.endswith(".c"):
                      continue
                  if fname in already_patched:
                      continue

                  fpath = os.path.join(root, fname)
                  with open(fpath) as fh:
                      src = fh.read()

                  # Skip files that don't mention LED at all
                  if ("app_pwm_led" not in src and
                      "app_led_set" not in src):
                      continue

                  print(f"\n--- Checking: {fpath} ---")

                  changed = False

                  # Add include if needed
                  if "relay_state.h" not in src:
                      src = '#include "relay_state.h"\n' + src
                      changed = True

                  # Inject after app_pwm_led_set_power calls
                  if "relay_state_set_light" not in src:
                      def inject_led(m):
                          val = m.group(1)
                          return (
                              f"app_pwm_led_set_power({val});\n"
                              f"    relay_state_set_light({val}, SRC_BOXUI);"
                          )
                      new = re.sub(
                          r'app_pwm_led_set_power\(\s*(true|false|\w+)\s*\)\s*;',
                          inject_led, src)
                      if new != src:
                          src = new; changed = True
                          print(f"  -> injected relay_state_set_light")
                          total_injected += 1

                  if changed:
                      with open(fpath, "w") as fh:
                          fh.write(src)
                      print(f"  -> saved {fname}")

          print(f"\nTotal files patched: {total_injected}")
          if total_injected == 0:
              print("WARNING: No LED call sites found outside SR handler.")
              print("Check Audit step output for the actual function name used.")
          PYEOF

      # =========================================================
      # SDKCONFIG
      # =========================================================
      - name: Patch sdkconfig
        run: |
          cd examples/factory_demo
          echo 'CONFIG_ESP_TASK_WDT=n' >> sdkconfig.ci.box

      
      - name: Find BOX UI Light Handler
        run: |
         echo "===== ui_dev_ctrl ====="
         grep -R "set_power" \
         examples/factory_demo/main \
         -n || true

         echo "===== Light Power ====="
         grep -R "Request to set the power of Light" \
         examples/factory_demo/main \
         -n || true

         echo "===== app_pwm_led_set_power ====="
         grep -R "app_pwm_led_set_power" \
         examples/factory_demo/main \
         -n || true

         echo "===== ui_dev_ctrl ====="
         grep -R "ui_dev_ctrl" \
         examples/factory_demo/main \
         -n || true
         
      - name: Patch BOX UI Sync
        run: |
           sed -i 's/app_pwm_led_set_power(!state);/relay_state_set_light(!state, SRC_BUTTON); relay_state_set_relay(!state, SRC_BUTTON);/' \
           examples/factory_demo/main/gui/ui_device_ctrl.c

      - name: Add relay_state include
        run: |
             grep -q "relay_state.h" \
             examples/factory_demo/main/gui/ui_device_ctrl.c || \
             sed -i '/#include "app_led.h"/a #include "relay_state.h"' \
             examples/factory_demo/main/gui/ui_device_ctrl.c

      - name: Show UI control code
        run: |
               sed -n '55,90p' \
               examples/factory_demo/main/gui/ui_device_ctrl.c


      - name: Show UI Device Control Function
        run: |
         sed -n '60,90p' examples/factory_demo/main/gui/ui_device_ctrl.c
      - name: Show relay_state.h
        run: |
         echo "===== relay_state.h ====="
         sed -n '1,120p' \
         examples/factory_demo/main/relay_state.h || true
      
      - name: Fix BOX UI relay source
        run: |
         sed -i 's/SRC_BUTTON/SRC_BOXUI/g' \
         examples/factory_demo/main/gui/ui_device_ctrl.c
      # =========================================================
      # BUILD
      # =========================================================
      - name: Build firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo
          idf.py set-target esp32s3
          cp sdkconfig.ci.box sdkconfig
          idf.py fullclean
          idf.py build

      # =========================================================
      # MERGE BIN
      # =========================================================
      - name: Merge firmware
        run: |
          source $IDF_PATH/export.sh
          cd examples/factory_demo/build

          python $IDF_PATH/components/esptool_py/esptool/esptool.py \
            --chip esp32s3 merge_bin \
            -o factory.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            $(cat flash_args)

          echo "=== Binary info ==="
          ls -lh factory.bin
          sha256sum factory.bin

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-box-industrial
          path: examples/factory_demo/build/factory.bin
          retention-days: 30
